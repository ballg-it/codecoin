// จดสถานะลง sessionStorage ก่อนเริ่มจับเวลา — refresh กลางเกมแล้วเวลาต้องเดินต่อ
function startMeltdown(cfg) {
  renderMeltdownFight(Session.begin({
    route: "meltdown", key: routeKey(),
    round: cfg.round, count: cfg.count, slot: cfg.slot,
    damage: 0, qIndex: 0, wrong: 0, lockoutUntil: 0, subjects: [],
  }, CONFIG.cooling_boss.seconds));
}

// ---- หน้า 3: สู้ (รัวตอบ ตอบถูก = ฟัน 1 แต้ม / ตอบผิด = ล็อก 5 วิ) ----
function renderMeltdownFight(st) {
  const C = CONFIG.cooling_boss;
  const seed = meltdownSeed(st.round, st.count, st.slot);
  const deck = meltdownDeck(seed);
  const target = meltdownTarget(st.count);
  let damage = st.damage || 0, qIndex = st.qIndex || 0, wrong = st.wrong || 0;
  let lockUntil = st.lockoutUntil || 0;
  const subjects = st.subjects || [];
  let tick = null, lastSec = -1, ended = false;
  let qShownAt = Date.now();   // ใช้เฉพาะการ log เวลาตอบรายข้อ ไม่เกี่ยวกับกติกา/เวลาบอสไฟต์

  // ต้องมี แม้ทางเข้าปกติจะมีดีเลย์นับ 3-2-1 ≥3000ms ก็ตาม — animation ที่ยัง "running" ไม่ได้แปลว่า
  // จะจบเองภายใน 180ms เสมอ ถ้าแท็บถูกพักกลางคัน (จอดับ/สลับแอประหว่างนับ) เบราว์เซอร์จะหยุด
  // timeline ค้างไว้ที่ currentTime เดิม (พิสูจน์แล้วจากการทดสอบจริง: ค้างที่ 0 นานนับวินาที
  // opacity เป็น 0 ทั้งจอบอสไฟต์) ไม่มี "ดีเลย์นานพอ" ที่ปลอดภัยจริงในทุกกรณี ต้องยกเลิกเสมอ
  cancelScreenEnter();
  screen.innerHTML = `
    <div class="card">
      <span class="zone-tag" style="background:var(--office)">🔥 SERVER MELTDOWN · รอบ ${st.round}</span>
      <div id="timerBox"></div>
      <div class="hp-wrap">
        <div class="hp-row">
          <span>ดาเมจของคุณ <b id="dmgNum">0</b></span>
          <span>เป้าหมายทีม <b id="tgtNum">0</b></span>
        </div>
        <div class="hp-bar"><div class="hp-fill" id="hpFill"></div></div>
      </div>
      <div class="shout">📢 ตะโกนบอกเพื่อนทุกครั้งที่ฟันโดน!</div>
      <p class="q" id="qText"></p>
      <div id="choices"></div>
    </div>`;
  document.getElementById("tgtNum").textContent = target;

  const save = () => Session.patch({ damage, qIndex, wrong, lockoutUntil: lockUntil, subjects });
  const paintHp = () => {
    document.getElementById("dmgNum").textContent = damage;   // อยู่นอก .hp-fill เสมอ — ไม่โดน scaleX ตามไปด้วย
    document.getElementById("hpFill").style.transform = `scaleX(${Math.min(1, damage / target)})`;
  };

  // จอสั่นตอนฟันโดน — id ต้องคนละตัวกับ SCREEN_ENTER_ID เด็ดขาด (Stage 4 ข้อ B)
  // ไม่งั้น cancelScreenEnter() ที่หน้าถัดไปเรียกจะไปยกเลิกตัวนี้ทิ้งโดยไม่ตั้งใจ (หรือกลับกัน
  // ตัวนี้ไปโดนยกเลิกก่อนเล่นจบ) เก็บ reference ไว้ยกเลิกเองตอน finish() กันค้างข้ามหน้าแน่นอน
  let shakeAnim = null;
  const screenShake = () => {
    if (shakeAnim) { try { shakeAnim.cancel(); } catch (e) {} }
    shakeAnim = MOTION.run(screen, [
      { transform: "translateX(0)" }, { transform: "translateX(-3px)" },
      { transform: "translateX(3px)" }, { transform: "translateX(0)" },
    ], { id: "screen-shake", duration: 150, easing: easeVar("--ease-io") });
  };

  // เอฟเฟกต์ฟันโดน — เสียง + แฟลช + สั่น + ตัวใหญ่กลางจอ (ความรู้สึก "สู้ร่วมกัน" มาจากเสียงในห้อง)
  const hitFx = () => {
    SFX.correct(); flash("green"); screenShake();
    try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {}
    const el = document.createElement("div");
    el.className = "hit-fx";
    el.textContent = "💥 โจมตี!";
    el.addEventListener("animationend", () => el.remove());
    document.body.appendChild(el);
  };

  const askNext = () => {
    if (ended) return;
    qShownAt = Date.now();   // นาฬิกาเวลาตอบรายข้อ (เริ่มใหม่ทุกครั้งที่โจทย์ขึ้นจอ)
    const q = meltdownQuestion(deck, qIndex, seed);
    // คำถาม/ตัวเลือกอาจมีแท็ก HTML เป็นตัวอย่างบทเรียน — ใส่แบบ text ล้วนเสมอ
    document.getElementById("qText").textContent = "Q: " + q.question_th;
    const box = document.getElementById("choices");
    box.innerHTML = "";
    q.choices.forEach((c, i) => {
      const b = document.createElement("button");
      b.className = "choice";
      b.textContent = String.fromCharCode(65 + i) + ". " + c;
      b.onclick = () => answer(q, i);
      box.appendChild(b);
    });
  };

  const paintLockout = () => {
    const left = Math.max(0, Math.ceil((lockUntil - Date.now()) / 1000));
    document.getElementById("qText").textContent = "❌ ตอบผิด — รอระบบกลับมา";
    document.getElementById("choices").innerHTML =
      `<div class="lockout">⚙️ ระบบกำลังรีบูต... <span id="lockNum">${left}</span></div>`;
  };

  const answer = (q, i) => {
    if (ended || Date.now() < lockUntil) return;
    // จดค่าสำหรับ log ให้ครบก่อนเข้าสองกิ่ง — กิ่งตอบถูกเรียก askNext() ซึ่งรีเซ็ต qShownAt ทันที
    const okLog = i === q.answer;
    const ansMs = Date.now() - qShownAt;
    const subjLog = (SPACES[q.space_id] || {}).zone || null;
    qIndex++;
    if (i === q.answer) {
      damage++;
      const zone = (SPACES[q.space_id] || {}).zone;
      if (zone && subjects.indexOf(zone) < 0) subjects.push(zone);
      save(); paintHp(); hitFx(); askNext();
    } else {
      wrong++;
      lockUntil = Date.now() + C.wrong_lockout_sec * 1000;   // ล็อกเวลาแทนตัดสิทธิ์ — ไม่ตกรอบกลางคัน
      save(); SFX.wrong(); flash("red"); paintLockout();
    }
    /* 1 แถวต่อ 1 ข้อ — kind แยก "meltdown_q" ไม่ใช่ cooling_boss เด็ดขาด ไม่งั้นยอดรวม
       รายบอสไฟต์ (damage/questions_seen) จะถูกนับเบิ้ลรวมกับแถวรายข้อ
       ช่วงนี้ seed ต่างกันรายคน (รอบ+จำนวนคน+เลขผู้เล่น) → เด็กแต่ละคนเจอคนละชุด คนละลำดับ
       ตัวเลือก จึงเป็นช่วงเดียวในเกมที่ทำ item analysis รายคนได้จริง และเป็นเหตุผลที่
       picked_label สำคัญกว่าที่อื่น — picked เป็นตำแหน่งบนจอเครื่องนั้น เทียบข้ามเครื่องไม่ได้
       elapsed_ms = เวลาตอบข้อนี้จริง (นับจากตอนโจทย์ขึ้นจอ) ต้อง override ค่าที่ logAnswer
       ใส่มาเอง เพราะ cc_active ยัง active อยู่ ค่าที่ได้จะเป็นเวลาตั้งแต่เริ่มบอสไฟต์         */
    logAnswer("meltdown_q", q.space_id || "cooling", q.level || 0, okLog, {
      mode: "meltdown", round: st.round, player_slot: st.slot,
      question_id: qKey(q), qtype: "mcq",
      picked: i, picked_label: String(q.choices[i]).slice(0, 80),
      subject: subjLog, q_index: qIndex,
      elapsed_ms: (ansMs >= 0 && ansMs <= 600000) ? ansMs : null,
      timed_out: false,   // หมดเวลากลางข้อ = ไม่ได้กด จึงไม่มีแถวรายข้อของข้อนั้นเลย
    });
  };

  const timeLeft = () => Math.ceil((st.deadlineTs - Date.now() - 20) / 1000);

  const finish = () => {
    if (ended) return;
    ended = true;
    clearInterval(tick);
    Wake.off();
    // ยกเลิกจอสั่นที่อาจค้างอยู่ก่อนออกจากหน้านี้เสมอ — กันสั่นเลยไปโผล่หน้าสรุปผล (Stage 4 ข้อ B)
    if (shakeAnim) { try { shakeAnim.cancel(); } catch (e) {} shakeAnim = null; }
    Session.done(routeKey());
    // mode แยกสอง schema ที่ใช้ kind เดียวกัน (ห้ามเปลี่ยนชื่อ kind — ข้อมูลเก่าจะเทียบไม่ได้)
    // timed_out เป็น true เสมอ: บอสไฟต์จบด้วยหมดเวลาทางเดียว ฟันครบเป้าแล้วก็สู้ต่อจนหมดเวลา
    //
    // elapsed_ms = null บังคับ: ค่าที่ logAnswer คำนวณให้คือความยาวบอสไฟต์ (~75,000 ms คงที่)
    // ไม่ใช่เวลาตอบคำถาม ถ้าปล่อยไว้ในคอลัมน์เดียวกับเวลาตอบจริง (1,000-3,000 ms) ค่าเฉลี่ย
    // ตอน pivot จะพุ่งโดยไม่มีอะไรฟ้อง — ย้ายไปอยู่ fight_duration_ms ซึ่งเป็นคนละความหมาย
    // (เวลาตอบรายข้อของช่วงนี้อยู่ในแถว kind "meltdown_q" แยกต่างหาก)
    const fightMs = st.startedAt ? Date.now() - st.startedAt : null;
    logAnswer("cooling_boss", "cooling", 0, damage >= target, {
      mode: "meltdown",
      round: st.round, player_slot: st.slot, player_count: st.count,
      damage, hp_target: target, questions_seen: qIndex, wrong_count: wrong, subjects_hit: subjects,
      question_id: null, qtype: "meltdown_rush", timed_out: true,
      elapsed_ms: null,
      fight_duration_ms: (fightMs !== null && fightMs >= 0 && fightMs <= 600000) ? fightMs : null,
    });
    renderMeltdownSummary({ round: st.round, count: st.count, damage, qIndex, wrong }, target);
  };

  const paintTime = () => {
    const t = Math.max(0, timeLeft());
    if (t === lastSec) return;
    lastSec = t;
    const danger = t <= 15;
    document.getElementById("timerBox").innerHTML =
      `<div class="timer ${danger ? "danger" : ""}">⏱ ${t} วินาที</div>`;
    if (danger && t > 0) SFX.tick(true);
  };

  paintHp();
  if (timeLeft() <= 0) { SFX.buzzer(); finish(); return; }   // refresh กลับมาหลังหมดเวลา = สรุปทันที
  paintTime();
  Wake.on();
  if (lockUntil > Date.now()) paintLockout(); else { lockUntil = 0; askNext(); }

  // tick ถี่กว่า 1 วิ เพื่อให้ตัวเลขนับถอยหลังของ lockout ตอบสนองไว (เสียง/เวลาอัปเดตทีละวินาที)
  tick = setInterval(() => {
    if (ended) return;
    paintTime();
    if (timeLeft() <= 0) { SFX.buzzer(); flash("red"); finish(); return; }
    if (lockUntil) {
      const l = Math.ceil((lockUntil - Date.now()) / 1000);
      const n = document.getElementById("lockNum");
      if (l > 0) { if (n) n.textContent = l; }
      else { lockUntil = 0; save(); askNext(); }
    }
  }, 250);
}

// ---- หน้า 4: หมดเวลา → ตะโกนบอก Banker ----
function renderMeltdownSummary(r, target) {
  const share = Math.ceil(target / r.count);   // "ส่วนของตัวเอง" ไว้ตัดสินว่าควรฉลองไหม
  screen.innerHTML = `
    <div class="card">
      <span class="zone-tag" style="background:var(--office)">บอสไฟต์จบแล้ว · รอบ ${r.round}</span>
      <h2>⏱ หมดเวลา!</h2>
      <p class="content" style="text-align:center;margin-top:8px;">ดาเมจของคุณ</p>
      <div class="big-num">${r.damage}</div>
      <div class="result info" style="margin-top:12px;">📢 ตะโกนบอกเลขนี้ให้ Banker</div>
      <p class="content" style="margin-top:10px;text-align:center;">
        เป้าหมายทีม <b>${target}</b> — ถ้ารวมดาเมจทุกคนถึง ${target} = ล้มบอสสำเร็จ</p>
    </div>
    <div class="card">
      <p class="q">🏦 วิธีแบ่งกองกลาง</p>
      <div class="result win">✅ ถึงเป้า: แบ่งกองกลาง<b>ตามสัดส่วนดาเมจ</b><br>
        <span style="font-size:12.5px;">(ทำ 3 จาก 6 = ได้ครึ่งกอง)</span></div>
      <div class="result lose" style="margin-top:8px;">❌ ไม่ถึงเป้า: ไม่มีใครได้ — กองกลางสะสมต่อ</div>
      <p class="content" style="margin-top:12px;font-size:12.5px;color:var(--muted);">
        สถิติรอบนี้: ตอบไป ${r.qIndex} ข้อ · พลาด ${r.wrong} ครั้ง</p>
      <button class="btn" onclick="renderMenu()">กลับหน้าแรก</button>
    </div>`;
  enterScreen();
  if (r.damage >= share) confetti();   // ทำครบส่วนของตัวเองแล้ว (เสียงหมดเวลาเล่นไปแล้ว ไม่ซ้อนอีก)
}

/* ---------------------------------------------------------------------
   โหมด wirecut (ของเดิม) — เก็บไว้ให้ CONFIG.cooling_boss.mode = 'wirecut'
   เรียกใช้ได้ และโค้ด wire_cut ยังใช้ร่วมกับ ?space=debug_rescue
   --------------------------------------------------------------------- */
function renderCoolingWirecut() {
  let roundBtns = "";
  for (let r = 1; r <= CONFIG.bossfight_rounds; r++)
    roundBtns += `<button class="speed-player" data-round="${r}" style="flex:0 0 30%;">รอบ ${r}</button>`;

  screen.innerHTML = `
    <div class="card">
      <span class="zone-tag" style="background:var(--office)">จุดพักเครื่อง (Cooling Zone)</span>
      <h2>🚨 บอสไฟต์: กู้บั๊กด่วนทั้งวง!</h2>
      <p class="content"><b>ทุกคนหยิบมือถือขึ้นมาสแกน QR ช่องนี้ — ไม่ใช่เฉพาะคนที่หยุด!</b>
        ใครแก้บั๊กทันเวลา ได้ส่วนแบ่งจากกองกลาง 💰</p>
      <p class="content" style="margin-top:8px;font-size:13px;">
        1. คนที่หยุดประกาศ "เลขรอบ" (บอสครั้งแรกของเกม = รอบ 1, ครั้งถัดไป = รอบ 2, ...)<br>
        2. ทุกคนกดเลขรอบเดียวกัน → ได้โจทย์เดียวกันทุกเครื่อง<br>
        3. รอกันครบ นับ 3-2-1 แล้วกด "เริ่ม" พร้อมกัน</p>
      <p class="q" style="margin-top:10px;">เลขรอบ (ตามที่คนหยุดประกาศ):</p>
      <div class="speed-players" style="flex-wrap:wrap;">${roundBtns}</div>
    </div>`;
  enterScreen();
  document.querySelectorAll("[data-round]").forEach(b =>
    b.onclick = () => renderCoolingReady(+b.dataset.round));
}

function renderCoolingReady(round) {
  screen.innerHTML = `
    <div class="card">
      <span class="zone-tag" style="background:var(--office)">บอสไฟต์ · รอบ ${round}</span>
      <h2>พร้อมยัง?</h2>
      <p class="content">รอทุกคนมาถึงหน้านี้ แล้วนับ 3-2-1 กด "เริ่ม" พร้อมกันทั้งวง —
        เวลา <b>${CONFIG.bossfight_time} วินาที</b> เท่ากันทุกเครื่อง</p>
      <button class="btn" id="bossStart">🚀 เริ่ม!</button>
      <button class="btn ghost" id="bossBack">เปลี่ยนเลขรอบ</button>
    </div>`;
  enterScreen();
  document.getElementById("bossStart").onclick = () => renderCoolingPlay(round);
  document.getElementById("bossBack").onclick = renderCoolingBoss;
}

function renderCoolingPlay(round) {
  // seed จาก slug + เลขรอบ → ทุกเครื่องที่กดรอบเดียวกันได้กฎ+สายไฟชุดเดียวกันเป๊ะ
  const state = buildWireCut(seededRng("cooling-" + round));
  let step = 0, done = false, timer = null;

  cancelScreenEnter();   // นาฬิกาเริ่มทันที — กัน fade ค้างจากหน้าพร้อมยัง? ก่อนหน้า
  screen.innerHTML = `
    <div class="card">
      <span class="zone-tag" style="background:var(--office)">บอสไฟต์ · รอบ ${round}</span>
      <h2>ตัดสายไฟตามกฎ!</h2>
      <div id="rTimer"></div>
      <div class="rescue-guide" style="margin:10px 0;">📋 กฎ: ${state.variant.guide_text}</div>
      <div id="wires"></div>
      <div id="rResult"></div>
    </div>`;

  const wrap = document.getElementById("wires");
  state.colors.forEach((c, i) => {
    const row = document.createElement("div");
    row.className = "wire-row";
    row.innerHTML = `<span class="wire-idx">${i + 1}</span>
      <div class="wire-bar" style="background:${WIRE_HEX[c]}"></div>
      <button class="wire-cut-btn">✂ ตัด</button>`;
    row.querySelector("button").onclick = () => cut(i, row);
    wrap.appendChild(row);
  });

  // จบ (ของเครื่องนี้เท่านั้น): ผ่าน/ไม่ผ่าน แล้วเปิดแผงสรุปสำหรับธนาคาร
  const finish = (ok, timedOut, cutIndex) => {
    if (done) return;
    done = true; timer.stop();
    wrap.querySelectorAll("button").forEach(b => b.disabled = true);
    // เฉลยให้เห็นว่าต้องตัดเส้นไหน (เพื่อการเรียนรู้หลังจบ)
    state.answer.forEach(i => wrap.children[i].style.outline = "2px solid var(--ok)");
    if (ok) {
      SFX.celebrate(); confetti();
      document.getElementById("rResult").innerHTML =
        `<div class="result win pop">✅ คุณผ่าน! ยกมือบอกวงเลย 🙌</div>`;
    } else {
      if (!timedOut) { SFX.wrong(); flash("red"); }  // หมดเวลา rescueTimer เล่น buzzer ให้แล้ว
      document.getElementById("rResult").innerHTML =
        `<div class="result lose">${timedOut ? "⏱ หมดเวลา" : "❌ ตัดพลาด"} — รอบนี้อดส่วนแบ่ง</div>`;
    }
    // โหมดสำรอง (ตัดสายไฟ) — คนละ schema กับ meltdown ทั้งที่ kind เดียวกัน แยกด้วย mode
    // ไม่ได้ใช้ Session เช่นกัน → elapsed_ms null ถาวร
    // cut_index ฐาน 1 ตรงกับเลขที่โชว์ข้างเส้น (หมดเวลา = null เพราะไม่ได้กด)
    logAnswer("cooling_boss", "cooling", 0, ok,
      { mode: "wirecut", round, variant: state.variant.id, qtype: "wire_cut", timed_out: !!timedOut,
        cut_index: (cutIndex === undefined || cutIndex === null) ? null : cutIndex + 1 });
    renderBankPanel();
  };

  function cut(i, row) {
    if (done || row.classList.contains("cut")) return;
    row.classList.add("cut");
    row.querySelector("button").disabled = true;
    if (i === state.answer[step]) { SFX.correct(); step++; if (step >= state.answer.length) finish(true, false, i); }
    else finish(false, false, i);  // ตัดผิดเส้น = ล่มทันที
  }

  timer = rescueTimer(CONFIG.bossfight_time, "rTimer", () => finish(false, true));
}

// แผงสรุปการแบ่งกองกลาง — คนคุมธนาคารใช้เครื่องไหนก็ได้ กดจำนวนคนที่ผ่าน
// เว็บไม่รู้ขนาดกองกลาง (เงินจริงบนโต๊ะ) จึงประกาศเป็นสัดส่วน ไม่คำนวณจำนวนเงิน
function renderBankPanel() {
  const box = document.getElementById("rResult");
  const btns = [0, 1, 2, 3, 4, 5, 6].map(n =>
    `<button class="speed-player" data-pass="${n}" style="flex:0 0 22%;">${n}</button>`).join("");
  box.insertAdjacentHTML("beforeend", `
    <div class="card" style="margin-top:12px;">
      <p class="q">🏦 สำหรับคนคุมธนาคาร — ทั้งวงผ่านกี่คน?</p>
      <div class="speed-players" style="flex-wrap:wrap;">${btns}</div>
      <div id="bankShare"></div>
      <button class="btn" onclick="renderMenu()">กลับเมนู</button>
    </div>`);
  box.querySelectorAll("[data-pass]").forEach(b => b.onclick = () => {
    const n = +b.dataset.pass;
    const msg = n === 0
      ? `<div class="result lose">❌ ไม่มีใครแก้ทัน → กองกลางสะสมต่อ ไม่มีใครได้</div>`
      : n === 1
        ? `<div class="result win">🏆 ผ่านคนเดียว — รับกองกลางทั้งหมดไปเลย!</div>`
        : `<div class="result win">✅ ผ่าน ${n} คน → แบ่งกองกลางเท่ากัน คนละ 1/${n} ของกอง</div>`;
    document.getElementById("bankShare").innerHTML = msg;
  });
}

// ---------- ROUTER: อ่าน ?space= (+ &upgrade= / &role= &code=) แล้วเลือกหน้า ----------
// ลำดับสำคัญ: กู้คำถามที่ค้าง → กันสแกนซ้ำ → เปิดหน้าปกติ
function route() {
  const act = Session.active(routeKey());
  if (act) {
    if (resumeFrom(act)) return;
    Session.clear();   // กู้ไม่ได้ (คำถามหายจากคลัง/ข้อมูลเปลี่ยน) — เริ่มปกติแทน
  }
  // ถามเลขผู้เล่นครั้งแรกที่เปิดเว็บ ไม่ว่าจะสแกนเข้าหน้าไหน แล้วค่อยเข้าหน้าเดิมต่อ
  // วางไว้หลังการกู้สถานะ เพราะถ้ามีคำถามค้างอยู่ เวลาเดินอยู่แล้ว ห้ามเอากล่องนี้ไปกินเวลาตอบ
  if (Player.shouldAsk()) { renderPlayerGate(routeAfterPlayer); return; }
  routeAfterPlayer();
}

function routeAfterPlayer() {
  const wait = param ? Session.doneRecently(routeKey()) : 0;
  if (wait) { renderRescanGate(wait); return; }
  dispatch();
}

// กู้สถานะที่ค้างอยู่จาก sessionStorage — คืน true ถ้ากู้สำเร็จ
function resumeFrom(act) {
  try {
    if (act.route === "space" && SPACES[param]) { renderSpace(param, act); return true; }
    if (act.route === "upgrade" && SPACES[param]) { renderUpgrade(param, act.level, act); return true; }
    if (act.route === "bugjam") { renderBugQuestion(act.diff, act); return true; }
    if (act.route === "meltdown" && param === "cooling") { renderMeltdownFight(act); return true; }
    if (act.route === "speed" && param.startsWith("event_")) {
      renderEvent(param.replace("event_", ""), act); return true;
    }
  } catch (e) { console.warn("กู้สถานะเดิมไม่สำเร็จ:", e); }
  return false;
}

// เพิ่งเล่นช่องนี้จบไปไม่ถึงนาที — เตือนไว้ก่อน แต่ต้องข้ามได้เสมอ (เจอบั๊กแล้วต้องเล่นต่อได้)
function renderRescanGate(sec) {
  screen.innerHTML = `
    <div class="card">
      <span class="zone-tag" style="background:var(--gold)">สแกนซ้ำ</span>
      <h2>⏳ ช่องนี้เพิ่งทำไปแล้ว</h2>
      <p class="content">เพิ่งเปิดช่องนี้ไปเมื่อไม่ถึงนาทีที่แล้ว — กันเผลอสแกนซ้ำในเทิร์นเดียว
        (เปิดได้เองอีกครั้งในอีก <b>${sec}</b> วินาที)</p>
      <button class="btn" id="gateAgain">🔓 ทำอีกครั้ง (ครูอนุญาต)</button>
      <button class="btn ghost" onclick="renderMenu()">กลับเมนู</button>
    </div>`;
  enterScreen();
  document.getElementById("gateAgain").onclick = () => { Session.allowAgain(routeKey()); dispatch(); };
}

function dispatch() {
  setHeaderHidden(false);   // ค่าเริ่มต้นทุก route คือ header โชว์ — 3 ฟังก์ชันที่ต้องซ่อนจะสั่ง true เองที่ต้นฟังก์ชัน
  if (!param) renderMenu();
  else if (param === "bugjam") renderBugjam();
  else if (param === "debug_rescue") renderDebugRescue();
  else if (param === "cooling") renderCoolingBoss();
  else if (param.startsWith("event_")) {
    const zone = param.replace("event_", "");
    EVENTS.some(e => e.zone === zone) ? renderEvent(zone) : showNotFound();
  }
  else if (SPACES[param]) upgradeParam ? renderUpgrade(param, +upgradeParam) : renderSpace(param);
  else showNotFound();
}

loadData();
</script>
</body>
</html>
