<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeCoin — QR System</title>
<!-- PWA: path ทุกอันเป็น relative เพราะ deploy บน GitHub Pages แบบ subpath (/codecoin/) -->
<meta name="theme-color" content="#0B2B22">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --board:#0B2B22;      /* พื้น PCB */
    --panel:#0D3327;      /* กล่องเนื้อหา */
    --line:#1F4A3A;       /* เส้นขอบ */
    --gold:#FBBF24;       /* สีทอง (เหตุการณ์/ปุ่มหลัก) */
    --text:#E2E8F0;
    --muted:#94A3B8;
    --ok:#4ADE80;
    --bad:#F87171;
    /* สีประจำโซน */
    --coding:#4ADE80; --design:#FB923C; --office:#38BDF8; --hardware:#F472B6;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--board); color:var(--text);
    font-family:'Sarabun',sans-serif; min-height:100vh;
    display:flex; justify-content:center; padding:20px 14px 76px; /* เผื่อพื้นที่ล่างให้ปุ่ม mute ไม่บังปุ่มอื่น */
    background-image:
      linear-gradient(#0F4C3A 1px, transparent 1px),
      linear-gradient(90deg, #0F4C3A 1px, transparent 1px);
    background-size:28px 28px;
  }
  .app { width:100%; max-width:430px; }

  /* ---------- ส่วนหัวแบบชิป ---------- */
  header {
    background:#111827; border:2px solid var(--gold); border-radius:14px;
    padding:14px 18px; text-align:center; position:relative; margin-bottom:18px;
  }
  header::before, header::after {
    content:""; position:absolute; top:-8px; left:20%; width:60%; height:8px;
    background:repeating-linear-gradient(90deg, var(--gold) 0 4px, transparent 4px 18px);
  }
  header::after { top:auto; bottom:-8px; }
  header h1 { font-family:'Kanit',sans-serif; font-size:24px; color:var(--gold); letter-spacing:1px; }
  header p { font-size:12px; color:#86EFAC; }

  .zone-tag {
    display:inline-block; font-size:12px; font-weight:700; padding:3px 12px;
    border-radius:20px; margin-bottom:10px; color:#05100C;
  }
  .card {
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:18px 16px; margin-bottom:14px;
  }
  h2 { font-family:'Kanit',sans-serif; font-size:20px; margin-bottom:10px; }
  .content { font-size:14.5px; line-height:1.8; color:#CBD5E1; }
  .price { color:var(--gold); font-weight:700; }

  .q { font-weight:700; font-size:15px; margin:6px 0 12px; }
  .choice {
    display:block; width:100%; text-align:left; background:#0B241B;
    border:1px solid var(--line); border-radius:10px; color:var(--text);
    padding:12px 14px; font-size:14px; font-family:inherit; margin-bottom:9px; cursor:pointer;
  }
  .choice:hover { border-color:var(--gold); }
  .choice.correct { border-color:var(--ok); background:#0F3B2A; }
  .choice.wrong { border-color:var(--bad); background:#3B1414; }

  .timer { text-align:center; font-family:'Kanit',sans-serif; font-size:18px; color:var(--gold); margin-bottom:10px; }
  .timer.danger { color:var(--bad); }

  .result { text-align:center; border-radius:12px; padding:14px; font-size:15px; margin-top:6px; }
  .result.win { background:#0F3B2A; border:1px solid var(--ok); color:var(--ok); }
  .result.lose { background:#3B1414; border:1px solid var(--bad); color:var(--bad); }
  .result.info { background:#14200E; border:1px solid var(--gold); color:#FDE68A; }

  .btn {
    display:block; width:100%; border:none; border-radius:12px; padding:13px;
    font-family:'Kanit',sans-serif; font-size:16px; cursor:pointer; margin-top:10px;
    background:var(--gold); color:#05100C;
  }
  .btn.ghost { background:transparent; border:1px solid var(--gold); color:var(--gold); }

  .code-box {
    background:#05100C; border:1px solid var(--line); border-radius:10px;
    font-family:monospace; font-size:13px; color:#A7F3D0; padding:12px; white-space:pre; overflow-x:auto; margin-bottom:12px;
  }
  .menu-item {
    display:flex; justify-content:space-between; align-items:center;
    background:#0B241B; border:1px solid var(--line); border-radius:10px;
    border-left:4px solid var(--zc, var(--line));
    padding:11px 14px; margin-bottom:8px; cursor:pointer; font-size:14px;
  }
  .menu-item:hover { border-color:var(--gold); border-left-color:var(--zc, var(--gold)); }
  .menu-item small { color:var(--muted); font-size:11px; }
  .menu-zone { margin-top:16px; }
  .menu-zone-head {
    display:flex; align-items:center; gap:10px; margin-bottom:8px;
    font-family:'Kanit',sans-serif; font-size:13.5px; letter-spacing:.5px; color:var(--zc);
  }
  .menu-zone-head::after { content:""; flex:1; height:1px; background:var(--line); }
  .footer-note { text-align:center; font-size:11px; color:#4B6A5C; margin-top:16px; }

  .data-warn {
    background:#3A2A0A; border:1px solid var(--gold); border-radius:10px;
    font-size:12.5px; color:#FDE68A; padding:9px 12px; margin-bottom:14px; text-align:center;
  }
  .upgrade-links { display:flex; gap:8px; }
  .upgrade-links .btn { font-size:14px; padding:10px 6px; }

  /* ---------- ปุ่มเลือกโหมดเดิมพัน (หน้าซื้อทรัพย์สิน) ---------- */
  .bet-row { display:flex; gap:8px; margin-bottom:12px; }
  .bet-btn {
    flex:1; background:#0B241B; border:1px solid var(--line); border-radius:10px;
    color:var(--muted); padding:9px 6px; text-align:center;
    font-family:'Kanit',sans-serif; font-size:14px; cursor:pointer;
  }
  .bet-btn small { display:block; font-family:'Sarabun',sans-serif; font-size:10.5px; margin-top:2px; color:var(--muted); }
  .bet-btn.active { border-color:var(--gold); color:var(--gold); background:#14200E; }
  .bet-btn.active small { color:#FDE68A; }
  .bet-btn:disabled { opacity:.55; cursor:default; }

  /* ---------- modal ยืนยันโหมดมั่นใจ + countdown ---------- */
  .confirm-overlay {
    position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center;
    background:rgba(5,16,12,.82); padding:20px; animation:fxFade2 .2s ease-out;
  }
  @keyframes fxFade2 { from { opacity:0; } to { opacity:1; } }
  .confirm-modal {
    width:100%; max-width:340px; background:var(--panel); border:2px solid var(--gold);
    border-radius:16px; padding:20px 18px; text-align:center;
    box-shadow:0 12px 40px rgba(0,0,0,.5);
  }
  .confirm-modal .cd-num {
    display:inline-block; min-width:26px; font-family:'Kanit',sans-serif; font-weight:800;
  }
  .confirm-modal .btn { margin-top:12px; }

  /* ---------- กรอบวงล้อสุ่มผลแก้บั๊ก (เลนมั่นใจ+ผิด) ---------- */
  .roulette-frame {
    background:#05100C; border:1px solid var(--line); border-radius:10px;
    padding:13px 12px; margin-top:10px; text-align:center;
    font-family:'Kanit',sans-serif; font-size:15px; color:#A7F3D0;
    animation:roulettePulse .12s ease-out;
  }
  .roulette-frame.final {
    border-color:var(--gold); color:#FDE68A;
    animation:rouletteLand .45s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes roulettePulse { from { transform:scale(.97); opacity:.65; } to { transform:scale(1); opacity:1; } }
  @keyframes rouletteLand  { 0% { transform:scale(.9); } 60% { transform:scale(1.05); } 100% { transform:scale(1); } }

  /* ---------- มินิเกมกู้บั๊กด่วน (Debug Rescue) ---------- */
  .rescue-code {
    font-family:'Kanit',sans-serif; font-size:34px; letter-spacing:8px; color:var(--gold);
    text-align:center; background:#05100C; border:1px solid var(--gold); border-radius:10px;
    padding:12px; margin:10px 0;
  }
  .rescue-input {
    width:100%; text-align:center; text-transform:uppercase; letter-spacing:8px;
    font-family:'Kanit',sans-serif; font-size:26px; background:#05100C; color:var(--text);
    border:1px solid var(--line); border-radius:10px; padding:11px; margin-bottom:10px;
  }
  .role-pick { display:flex; gap:8px; }
  .role-pick .btn { margin-top:0; }
  .wire-row {
    display:flex; align-items:center; gap:10px; margin-bottom:9px;
    background:#0B241B; border:1px solid var(--line); border-radius:10px; padding:8px 12px;
  }
  .wire-bar { flex:1; height:16px; border-radius:8px; }
  .wire-idx { font-family:monospace; font-size:12px; color:var(--muted); width:20px; }
  .wire-row.cut { opacity:.4; }
  .wire-row.cut .wire-bar { background:#333 !important; position:relative; }
  .wire-cut-btn {
    background:transparent; border:1px solid var(--bad); color:var(--bad); border-radius:8px;
    font-family:'Kanit',sans-serif; font-size:13px; padding:5px 12px; cursor:pointer;
  }
  .wire-cut-btn:disabled { opacity:.4; cursor:default; }
  .rescue-guide {
    background:#14200E; border:1px solid var(--gold); border-radius:12px;
    padding:16px; font-size:16px; line-height:1.7; color:#FDE68A;
  }

  /* ---------- ปุ่มเลือกผู้ชนะ (event แบบ speed) ---------- */
  .speed-players { display:flex; gap:8px; margin:4px 0 6px; }
  .speed-player {
    flex:1; background:#0B241B; border:1px solid var(--gold); border-radius:10px;
    color:var(--gold); padding:12px 4px; text-align:center; cursor:pointer;
    font-family:'Kanit',sans-serif; font-size:14px;
  }
  .speed-player:hover { background:#14200E; }
  .speed-player:disabled { opacity:.5; cursor:default; }

  /* ---------- คำถามแบบ "ชี้ตำแหน่ง" (hotspot / colorwheel / linepick) ---------- */
  .point-wrap {
    background:#05100C; border:1px solid var(--line); border-radius:12px;
    padding:8px; margin-bottom:10px; touch-action:manipulation;
  }
  /* ห้าม preserveAspectRatio="none" — การคำนวณพิกัดอิงอัตราส่วนที่คงที่ */
  .point-wrap svg { width:100%; height:auto; display:block; cursor:crosshair; }
  .point-hint { text-align:center; font-size:12px; color:var(--muted); margin-bottom:8px; }

  /* linepick — โจทย์วัดเรื่องย่อหน้า ช่องว่างห้ามหาย */
  .lp-box { border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:10px; }
  .lp-row {
    display:flex; align-items:stretch; width:100%; text-align:left; cursor:pointer;
    background:#05100C; border:none; border-bottom:1px solid #10281F; padding:0; color:#A7F3D0;
  }
  .lp-row:last-child { border-bottom:none; }
  .lp-row:hover { background:#0B241B; }
  .lp-num {
    flex:0 0 32px; padding:9px 0; text-align:center; font-family:monospace; font-size:12px;
    color:var(--muted); background:#0B241B; border-right:1px solid #10281F; user-select:none;
  }
  .lp-code {
    flex:1; min-width:0; padding:9px 10px; font-family:monospace; font-size:13px;
    white-space:pre; overflow-x:auto;   /* เลื่อนเฉพาะบรรทัดที่ยาว ไม่ลากทั้งหน้า */
  }
  .lp-row.picked { background:#3B1414; color:var(--bad); }
  .lp-row.picked .lp-num { background:#4A1A1A; color:var(--bad); }
  .lp-row.answer { background:#0F3B2A; color:var(--ok); }
  .lp-row.answer .lp-num { background:#14472F; color:var(--ok); }
  .lp-row:disabled { cursor:default; }

  /* ---------- บอสไฟต์ Server Meltdown (?space=cooling) ---------- */
  .hp-wrap { background:#05100C; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px; }
  .hp-row { display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; color:var(--muted); margin-bottom:7px; }
  .hp-row b { color:var(--gold); font-family:'Kanit',sans-serif; font-size:17px; }
  .hp-bar { height:12px; background:#0B241B; border-radius:8px; overflow:hidden; }
  .hp-fill { height:100%; width:0; background:linear-gradient(90deg,#4ADE80,var(--gold)); transition:width .25s ease-out; }
  .shout {
    text-align:center; font-size:12.5px; color:#FDE68A; background:#3A2A0A;
    border:1px solid var(--gold); border-radius:20px; padding:6px 10px; margin-bottom:11px;
  }
  /* เอฟเฟกต์ฟันโดน — fixed + transform ล้วน ไม่แตะ layout ไม่หน่วง timer */
  .hit-fx {
    position:fixed; inset:0; z-index:65; display:flex; align-items:center; justify-content:center;
    pointer-events:none; font-family:'Kanit',sans-serif; font-size:46px; color:var(--gold);
    text-shadow:0 4px 20px rgba(0,0,0,.7); animation:hitPop .5s ease-out forwards;
  }
  @keyframes hitPop {
    0% { transform:scale(.5); opacity:0; } 22% { transform:scale(1.14); opacity:1; }
    100% { transform:scale(1.4); opacity:0; }
  }
  .lockout {
    text-align:center; background:#3B1414; border:1px solid var(--bad); border-radius:12px;
    padding:22px 14px; color:var(--bad); font-family:'Kanit',sans-serif; font-size:19px;
  }
  .pick-row { display:flex; flex-wrap:wrap; gap:7px; margin:4px 0 12px; }
  .pick {
    flex:1 0 17%; background:#0B241B; border:1px solid var(--line); border-radius:9px;
    color:var(--text); font-family:'Kanit',sans-serif; font-size:14.5px; padding:9px 0;
    text-align:center; cursor:pointer;
  }
  .pick.on { border-color:var(--gold); background:#14200E; color:var(--gold); }
  .big-num { font-family:'Kanit',sans-serif; font-size:56px; color:var(--gold); text-align:center; line-height:1.15; }
  .countdown-big { font-family:'Kanit',sans-serif; font-size:74px; color:var(--gold); text-align:center; margin:6px 0; animation:resultPop .4s ease-out; }

  /* ---------- ปุ่ม mute ลอยมุมขวาล่าง ---------- */
  .mute-btn {
    position:fixed; right:14px; bottom:14px; z-index:70;
    width:44px; height:44px; border-radius:50%; cursor:pointer;
    background:#111827; border:1.5px solid var(--gold); color:var(--gold);
    font-size:19px; line-height:1; opacity:.92;
  }
  .mute-btn.off { border-color:var(--line); color:var(--muted); }

  /* ---------- ป้ายบอกสถานะออฟไลน์ (มุมซ้ายล่าง — ไม่ชนปุ่ม mute) ---------- */
  .net-badge {
    position:fixed; left:14px; bottom:14px; z-index:70; display:none;
    background:#3A2A0A; border:1px solid var(--gold); border-radius:20px;
    color:#FDE68A; font-size:12px; padding:6px 12px; pointer-events:none;
  }
  .net-badge.show { display:block; }

  /* ---------- เอฟเฟกต์กะพริบเต็มจอ (โปร่งใส ไม่รับคลิก ไม่แตะ layout) ---------- */
  .fx-flash { position:fixed; inset:0; pointer-events:none; z-index:50; opacity:0; }
  .fx-flash.green { background:#4ADE80; animation:fxFade .35s ease-out; }
  .fx-flash.red   { background:#F87171; animation:fxFade .35s ease-out; }
  .fx-flash.gold  { background:#FBBF24; animation:fxFadeStrong .55s ease-out; }
  @keyframes fxFade       { 0% { opacity:.22; } 100% { opacity:0; } }
  @keyframes fxFadeStrong { 0% { opacity:.38; } 100% { opacity:0; } }

  /* กล่องผลลัพธ์เด้งรับ highlight moment (โหมดมั่นใจ) */
  .result.pop { animation:resultPop .45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes resultPop { 0% { transform:scale(.9); } 60% { transform:scale(1.06); } 100% { transform:scale(1); } }

  /* ---------- confetti (transform ล้วน — GPU, ไม่กระตุก) ---------- */
  .confetti {
    position:fixed; top:-16px; width:8px; height:14px; z-index:60;
    pointer-events:none; border-radius:2px;
    animation:confettiFall linear forwards;
  }
  @keyframes confettiFall { to { transform:translateY(112vh) rotate(720deg); } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>CodeCoin</h1>
    <p>QR SYSTEM — PCB EDITION REV 2.2</p>
  </header>
  <div id="dataStatus"></div>
  <div id="screen"><div class="card"><p class="content">⏳ กำลังโหลดข้อมูล...</p></div></div>
  <div class="footer-note">ต้นแบบระบบ QR — เปิดผ่าน ?space=รหัสช่อง</div>
</div>
<button class="mute-btn" id="muteBtn" title="เปิด/ปิดเสียง">🔊</button>
<div class="net-badge" id="netBadge">⚡ โหมดออฟไลน์</div>

<script>
/* =====================================================================
   ⚙️ ส่วนที่ 1: ข้อมูลสำรอง (FALLBACK)
   ---------------------------------------------------------------------
   ข้อมูลจริงอยู่ใน data.json (โหลดตอนเปิดหน้า) — ก้อนนี้ใช้เฉพาะกรณี
   โหลด data.json ไม่สำเร็จ เช่น เปิดไฟล์ตรง ๆ แบบ file:// หรือเน็ตล่ม
   โครงสร้างตรงกับเอกสาร qr_data_structure.md ทุกคอลัมน์
   ===================================================================== */
const FALLBACK = {

  },
  questions: [

    { space_id:"coding_02", level:1, question_th:"Python แบ่งบล็อกโค้ดด้วยอะไร?",

    { space_id:"coding_02", level:2, question_th:"ข้อใดคือ list ใน Python?",

/* =====================================================================
   ส่วนที่ 3: ตัวระบบ (ปกติไม่ต้องแก้ส่วนนี้)
   ===================================================================== */
let SPACES, QUESTIONS, EVENTS, BUGJAM;

const upgradeParam = params.get("upgrade");

// ---------- โหลดข้อมูลจาก data.json → ถ้าพลาดใช้ FALLBACK ----------
async function loadData() {
  let source = FALLBACK, usedFallback = true;
  try {
    const res = await fetch(CONFIG.data_url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const d = await res.json();
    if (d.spaces && d.questions && d.events && d.bugjam) { source = d; usedFallback = false; }
    else throw new Error("โครงสร้างข้อมูลไม่ครบ");
  } catch (e) {
    console.warn("โหลดฐานข้อมูลไม่สำเร็จ ใช้ข้อมูลสำรอง:", e.message);
  }

  SPACES = source.spaces;
  // ข้ามแถวร่าง (question_th ขึ้นต้นด้วย DRAFT) และข้อที่เรนเดอร์ไม่ได้จริง ๆ
  QUESTIONS = source.questions.filter(q =>
    !String(q.question_th).startsWith("DRAFT") && questionUsable(q));
  EVENTS = source.events;
  BUGJAM = source.bugjam.filter(b => !String(b.question_th).startsWith("DRAFT"));

  if (usedFallback)
    document.getElementById("dataStatus").innerHTML =
      `<div class="data-warn">⚠️ โหลดฐานข้อมูลไม่สำเร็จ — กำลังใช้ข้อมูลสำรองในเครื่อง</div>`;

  route();
}

// ---------- (optional) ส่งสถิติการตอบไป Google Sheet ผ่าน Apps Script ----------
function logAnswer(kind, id, level, correct, extra) {
  if (!CONFIG.log_url) return;
  const body = JSON.stringify({ kind, space_id: id, level, correct, ts: new Date().toISOString(), ...extra });
  try { navigator.sendBeacon(CONFIG.log_url, body); }
  catch (e) { fetch(CONFIG.log_url, { method:"POST", body, keepalive:true }).catch(() => {}); }
}

/* =====================================================================
   ส่วนที่ 3.5: ความทนต่อเหตุไม่คาดฝัน (refresh / เน็ตล่ม / จอดับ / สแกนซ้ำ)
   ---------------------------------------------------------------------
   ทุกอย่างในบล็อกนี้ degrade ได้เอง — เบราว์เซอร์ไหนไม่รองรับก็เล่นได้ปกติ
   ===================================================================== */

// รหัสประจำหน้าปัจจุบัน — ใช้แยกว่า cc_active/cc_done เป็นของช่องไหน
// (หน้าอัปเกรดนับเป็นคนละหน้ากับหน้าซื้อ แม้ ?space= จะเดียวกัน)
const routeKey = () => (param || "menu") + (upgradeParam ? "|u" + upgradeParam : "");

// กุญแจอ้างอิงคำถาม/โจทย์แบบทนข้อมูลเปลี่ยน (ข้อมูลสำรองในไฟล์นี้ไม่มี question_id)
const qKey = q => q.question_id || `${q.space_id}#${q.level}#${String(q.question_th).slice(0, 60)}`;
const bugKey = b => b.bug_id || String(b.question_th).slice(0, 60);
const findQuestion = key => QUESTIONS.find(q => qKey(q) === key);

/* ---------- สถานะข้ามการ refresh (sessionStorage — ปิดแท็บแล้วหายเอง) ----------
   cc_active = คำถามที่กำลังจับเวลาอยู่ (มี deadline สัมบูรณ์ → refresh แล้วเวลาเดินต่อ)
   cc_done   = ช่องที่เพิ่งเล่นจบ (กันเผลอสแกนซ้ำในเทิร์นเดียว)                     */
const Session = (() => {
  const AK = "cc_active", DK = "cc_done";
  const RESCAN_MS = 90000;   // สแกนช่องเดิมซ้ำภายในกี่มิลลิวินาที = ขึ้นหน้าเตือน
  const read = k => { try { return JSON.parse(sessionStorage.getItem(k) || "null"); } catch (e) { return null; } };
  const write = (k, v) => { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  return {
    // เริ่มจับเวลา: เก็บ deadline เป็น timestamp จริง ไม่ใช่จำนวนวินาทีที่เหลือ
    begin(rec, seconds) {
      const now = Date.now();
      const full = { ...rec, startedAt: now, deadlineTs: seconds > 0 ? now + seconds * 1000 : 0 };
      write(AK, full);
      return full;
    },
    active(key) {
      const a = read(AK);
      return a && a.key === key ? a : null;
    },
    patch(o) { const a = read(AK); if (a) write(AK, { ...a, ...o }); },
    clear() { try { sessionStorage.removeItem(AK); } catch (e) {} },
    // จบ flow ของหน้านี้: เลิกจับเวลา + จดเวลาไว้กันสแกนซ้ำ
    done(key) { this.clear(); this.markDone(key); },
    markDone(key) { const d = read(DK) || {}; d[key] = Date.now(); write(DK, d); },
    // คืนจำนวนวินาทีที่ยังเหลือของช่วงกันสแกนซ้ำ (0 = เข้าได้เลย)
    doneRecently(key) {
      const t = (read(DK) || {})[key];
      if (!t) return 0;
      const left = RESCAN_MS - (Date.now() - t);
      return left > 0 ? Math.ceil(left / 1000) : 0;
    },
    allowAgain(key) { const d = read(DK) || {}; delete d[key]; write(DK, d); },
    reset() { try { sessionStorage.clear(); } catch (e) {} },
  };
})();

/* ---------- Wake Lock — กันจอดับระหว่างจับเวลา (ไม่รองรับก็ไม่พัง) ---------- */
const Wake = (() => {
  let lock = null, want = false;
  const acquire = () => {
    if (!want || lock || !navigator.wakeLock) return;
    navigator.wakeLock.request("screen")
      .then(l => {
        // จบเวลาไปแล้วระหว่างรอ promise — ปล่อยทิ้งทันที ไม่งั้นจอค้างสว่างทั้งที่เลิกใช้แล้ว
        if (!want) { try { l.release(); } catch (e) {} return; }
        lock = l;
        l.addEventListener("release", () => { lock = null; });
      })
      .catch(() => {});   // ไม่รองรับ / ไม่ใช่ https / แท็บไม่ active — ปล่อยผ่าน
  };
  // สลับแอปแล้วกลับมา ระบบจะปล่อย lock ให้เอง ต้องขอใหม่
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") acquire();
  });
  return {
    on() { want = true; acquire(); },
    off() { want = false; if (lock) { try { lock.release(); } catch (e) {} lock = null; } },
  };
})();

/* ---------- ป้ายออฟไลน์ + ลงทะเบียน Service Worker ---------- */
const netBadge = document.getElementById("netBadge");
const paintNet = () => netBadge.classList.toggle("show", !navigator.onLine);
window.addEventListener("online", paintNet);
window.addEventListener("offline", paintNet);

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    try {
      navigator.serviceWorker.register("./sw.js", { scope: "./" })
        .catch(e => console.warn("Service Worker ไม่ทำงาน (เล่นออนไลน์ได้ตามปกติ):", e));
    } catch (e) { console.warn("เบราว์เซอร์นี้ลงทะเบียน SW ไม่ได้:", e); }
  });
}

window.addEventListener("error", e => {
  if (!e || (!e.error && !e.message)) return;   // ข้าม error ของ resource (ฟอนต์โหลดไม่ได้ตอนออฟไลน์)
  showFatal(e.message || e.error);
});
window.addEventListener("unhandledrejection", e => {
  console.warn("promise ล้มเหลว:", e.reason);
  // เด้งหน้า error เฉพาะตอนจอว่างจริง ๆ — ไม่ไปขัดจังหวะเกมที่กำลังเล่นอยู่
  if (!screen.children.length) showFatal((e.reason && e.reason.message) || e.reason);
});

/* =====================================================================
   ระบบเสียง (Web Audio ล้วน — ไม่มีไฟล์เสียง/CDN, รันบน GitHub Pages ได้)
   - AudioContext ถูกสร้าง/ปลดล็อกจาก user gesture แรกเท่านั้น (กัน autoplay block)
   - เสียงติ๊กจาก timer จะเงียบไปเองจนกว่าผู้เล่นแตะจอครั้งแรก
   ===================================================================== */
const SFX = (() => {
  let ctx = null, muted = false, warmed = false;
  const AC = window.AudioContext || window.webkitAudioContext;

  // ปลุก AudioContext จาก user gesture — สร้าง + resume + เล่น buffer เงียบให้ฮาร์ดแวร์ตื่น
  // ผูกหลาย event และคอยลองจนกว่าจะ running จริง (มือถือ resume เป็น async ครั้งเดียวมักไม่พอ)
  const UNLOCK_EVENTS = ["pointerdown", "touchstart", "touchend", "click", "keydown"];
  function unlock() {
    try {
      if (!ctx && AC) ctx = new AC();
      if (!ctx) return;
      if (ctx.state !== "running") ctx.resume().catch(() => {});
      if (!warmed) {  // silent buffer — เคล็ดปลุกเสียง iOS ให้พร้อมก่อนโน้ตจริง
        const b = ctx.createBuffer(1, 1, 22050);
        const s = ctx.createBufferSource();
        s.buffer = b; s.connect(ctx.destination); s.start(0);
        warmed = true;
      }
      if (ctx.state === "running")  // ปลุกสำเร็จแล้ว เลิกดักฟัง
        UNLOCK_EVENTS.forEach(ev => document.removeEventListener(ev, unlock));
    } catch (e) {}
  }
  UNLOCK_EVENTS.forEach(ev => document.addEventListener(ev, unlock, { passive: true }));

  // เล่นโน้ตเดียว: envelope ขึ้นเร็ว-จางลง กันเสียงคลิกป๊อก
  function tone(freq, dur, { type = "sine", vol = 0.15, when = 0 } = {}) {
    if (muted || !ctx) return;                       // ก่อนแตะจอครั้งแรก — เงียบ (กัน autoplay)
    if (ctx.state !== "running") { try { ctx.resume().catch(() => {}); } catch (e) {} }  // เร่งปลุก แล้ว schedule ต่อ
    try {                                            // โน้ตที่ schedule ตอน suspend จะดังเองเมื่อ resume
      const t0 = ctx.currentTime + when;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0 + dur + 0.05);
    } catch (e) {}
  }

  return {
    toggleMuted() { muted = !muted; return muted; },
    // นับถอยหลัง — โหมด danger (เหลือ ≤5 วิ) สูงและดังขึ้น
    tick(danger) {
      danger ? tone(1500, 0.07, { type: "square", vol: 0.14 })
             : tone(950, 0.045, { type: "square", vol: 0.05 });
    },
    correct()   { tone(1318.5, 0.14, { vol: 0.16 }); tone(1760, 0.22, { when: 0.09, vol: 0.14 }); },          // ติ๊ง 2 โน้ตสูง
    fanfare()   { [523.25, 659.25, 783.99].forEach((f, i) => tone(f, 0.16, { type: "triangle", when: i * 0.11, vol: 0.2 }));
                  tone(1046.5, 0.4, { type: "triangle", when: 0.33, vol: 0.22 }); },                          // C-E-G-C เรียงขึ้น
    wrong()     { tone(233, 0.22, { vol: 0.09 }); tone(196, 0.3, { when: 0.12, vol: 0.07 }); },               // โทนต่ำ นุ่ม
    buzzer()    { tone(155, 0.35, { type: "sawtooth", vol: 0.11 }); tone(110, 0.3, { when: 0.05, type: "sawtooth", vol: 0.08 }); },
    celebrate() { [659.25, 783.99, 987.77, 1318.5].forEach((f, i) => tone(f, 0.15, { type: "triangle", when: i * 0.09, vol: 0.2 }));
                  tone(1567.98, 0.45, { type: "triangle", when: 0.38, vol: 0.2 }); },
  };
})();

// ปุ่ม mute — ปิดเฉพาะเสียง (visual feedback ยังทำงานปกติ)

/* ---------- visual feedback (fixed overlay + transform ล้วน ไม่หน่วง timer) ---------- */
function flash(color) {
  const el = document.createElement("div");
  el.className = "fx-flash " + color;
  el.addEventListener("animationend", () => el.remove());
  document.body.appendChild(el);
}

function confetti() {
  const colors = ["#FBBF24", "#4ADE80", "#FB923C", "#38BDF8", "#F472B6", "#FFFFFF"];
  for (let i = 0; i < 44; i++) {
    const p = document.createElement("div");
    p.className = "confetti";
    p.style.left = Math.random() * 100 + "vw";
    p.style.background = colors[i % colors.length];
    p.style.transform = `rotate(${Math.random() * 360}deg)`;
    p.style.animationDuration = 1.6 + Math.random() * 1.3 + "s";
    p.style.animationDelay = Math.random() * 0.35 + "s";
    p.addEventListener("animationend", () => p.remove());
    document.body.appendChild(p);
  }
}

function zoneTag(zone) {
  return `<span class="zone-tag" style="background:${CONFIG.zone_colors[zone]}">${CONFIG.zone_names[zone]}</span>`;
}

// แปลรหัส effect เป็นข้อความภาษาไทย
function effectText(effect) {
  if (effect.startsWith("+")) return `รับ ${(+effect.slice(1)).toLocaleString()} TechCoin 🎉`;
  if (effect.startsWith("-")) return `จ่าย ${(+effect.slice(1)).toLocaleString()} TechCoin 💸`;
  if (effect.startsWith("skip")) return `ข้าม ${effect.split(":")[1]} เทิร์น ⏸`;
  if (effect.startsWith("all")) return `ผู้เล่นคนอื่นทุกคนจ่าย ${(+effect.split(":")[1].replace("-","")).toLocaleString()} TechCoin ยกเว้นคุณ!`;
  if (effect.startsWith("collect")) return `เก็บจากผู้เล่นทุกคน คนละ ${(+effect.split(":")[1]).toLocaleString()} TechCoin`;
  return effect;
}

// สุ่มแบบมีน้ำหนัก (weighted random)
function weightedPick(list) {
  const total = list.reduce((s, e) => s + e.weight, 0);
  let r = Math.random() * total;
  for (const e of list) { r -= e.weight; if (r <= 0) return e; }
  return list[list.length - 1];
}

// ---------- หน้าช่องทรัพย์สิน ----------
// flow: เลือกโหมดก่อน (ยังไม่เห็นคำถาม) → ปกติ = คำถาม L1 ทันที /
//        มั่นใจ = modal ยืนยัน + countdown → คำถาม L4 (ยากกว่า, คนละชุด)
// resume = record จาก Session (มีเมื่อผู้เล่น refresh กลางคำถาม) — กู้ข้อเดิม+เวลาเดิม
function renderSpace(id, resume) {
  const sp = SPACES[id];
  const l1pool = QUESTIONS.filter(q => q.space_id === id && q.level === 1);
  const l4pool = QUESTIONS.filter(q => q.space_id === id && q.level === CONFIG.bet_confident.question_level);
  const conf = CONFIG.bet_confident;

  // ราคาจ่ายเมื่อรู้ยอดแน่นอน (ตอบถูกทั้งสองโหมด / ปกติ+ผิด = ราคาเต็ม)
  // เลน มั่นใจ+ผิด ไม่ผ่านฟังก์ชันนี้ — ยอดมาจากวงล้อ fail_roulette
  const payPrice = (mode, ok) => {
    const pct = ok ? -(mode === "confident" ? conf.discount_percent : CONFIG.discount_percent) : 0;
    return Math.round(sp.price * (100 + pct) / 100);
  };

  const upgradeBtns = `
    <div class="card">
      <p class="q">⬆ อัปเกรดช่องนี้ (สำหรับเจ้าของ)</p>
      <div class="upgrade-links">
        <button class="btn ghost" onclick="location.search='?space=${id}&upgrade=2'">ชำนาญ (L2)</button>
        <button class="btn ghost" onclick="location.search='?space=${id}&upgrade=3'">ผู้เชี่ยวชาญ (L3)</button>
      </div>
    </div>`;

  const headerCard = `
    <div class="card">
      ${zoneTag(sp.zone)}
      <h2>${sp.name_th}</h2>
      <p class="content" id="spContent"></p>
      <p style="margin-top:10px;font-size:14px;">ราคา: <span class="price">${sp.price.toLocaleString()} TechCoin</span></p>
    </div>`;
  const setContent = () => document.getElementById("spContent").textContent =
    sp.content_th.startsWith("📘") ? sp.content_th : "📘 " + sp.content_th;

  // ---- 1) หน้าเลือกโหมด (ยังไม่โชว์คำถาม) ----
  function renderModeSelect(toast) {
    const modeCard = l1pool.length ? `
      <div class="card">
        <p class="q">เลือกโหมดตอบก่อนเห็นคำถาม:</p>
        <div class="bet-row">
          <button class="bet-btn active" id="modeNormal">ตอบปกติ
            <small>ถูก ลด ${CONFIG.discount_percent}% · ผิด ราคาเต็ม</small></button>
          <button class="bet-btn" id="modeConfident">ตอบมั่นใจ 💎
            <small>คำถามยากขึ้น · ถูก ลด ${conf.discount_percent}% · ผิด สุ่มผลแก้บั๊ก 🎰</small></button>
        </div>
        ${toast ? `<div class="result info" style="margin-top:4px;">${toast}</div>` : ""}
      </div>`
      : `<div class="card"><div class="result info">ยังไม่มีคำถามสำหรับช่องนี้ — ซื้อได้ในราคาเต็ม</div></div>`;

    screen.innerHTML = headerCard + modeCard + upgradeBtns;
    setContent();
    if (!l1pool.length) return;
    document.getElementById("modeNormal").onclick = () =>
      startQuiz("normal", l1pool[Math.floor(Math.random() * l1pool.length)], 1);
    document.getElementById("modeConfident").onclick = confirmConfident;
  }

  // ---- 2) modal ยืนยันโหมดมั่นใจ + countdown (หมดเวลา/ยกเลิก = กลับเลือกโหมด ไม่เสียสิทธิ์) ----
  function confirmConfident() {
    let remain = conf.confirm_seconds, iv = null;
    const overlay = document.createElement("div");
    overlay.className = "confirm-overlay";
    overlay.innerHTML = `
      <div class="confirm-modal">
        <div style="font-family:'Kanit',sans-serif;font-size:20px;color:var(--gold);margin-bottom:8px;">มั่นใจจริงเหรอ? 💎</div>
        <p class="content">คำถามจะ<b>ยากขึ้น</b> · ตอบถูกลด ${conf.discount_percent}% · <b style="color:var(--bad)">ตอบผิดต้องสุ่มผลแก้บั๊ก 🎰</b></p>
        <button class="btn" id="confirmYes">ยืนยัน (<span class="cd-num" id="cdNum">${remain}</span> วิ)</button>
        <button class="btn ghost" id="confirmNo">ยกเลิก</button>
      </div>`;
    document.body.appendChild(overlay);
    const close = () => { clearInterval(iv); overlay.remove(); };
    SFX.tick(true);
    iv = setInterval(() => {
      remain--;
      if (remain > 0) { document.getElementById("cdNum").textContent = remain; SFX.tick(true); }
      else { close(); SFX.buzzer(); flash("red"); renderModeSelect("⏱ หมดเวลายืนยัน — เลือกโหมดใหม่ได้"); }
    }, 1000);
    document.getElementById("confirmYes").onclick = () => { close(); startConfident(); };
    document.getElementById("confirmNo").onclick = () => { close(); renderModeSelect(); };
  }

  // ---- 3) เข้าคำถามโหมดมั่นใจ: ดึง L4 (fallback L1 ถ้าไม่มี) ----
  function startConfident() {
    if (l4pool.length)
      startQuiz("confident", l4pool[Math.floor(Math.random() * l4pool.length)], conf.question_level);
    else
      startQuiz("confident", l1pool[Math.floor(Math.random() * l1pool.length)], 1,
        "⚠️ ยังไม่มีคำถามมั่นใจสำหรับช่องนี้ — ใช้คำถามปกติแทน");
  }

  // ---- หน้าหมุนวงล้อแบบยืนแยก (ใช้ตอน refresh หนีวงล้อ — โหลดกลับมาเจอวงล้อรออยู่) ----
  function renderRouletteStage() {
    screen.innerHTML = headerCard + `
      <div class="card">
        <div class="result lose">💥 มั่นใจแต่พลาด — ระบบพัง! ต้องสุ่มผลแก้บั๊ก</div>
        <button class="btn" id="spinBtn">🎰 หมุนแก้บั๊ก</button>
        <div id="rouletteBox"></div>
      </div>`;
    setContent();
    document.getElementById("spinBtn").onclick = () => spinFailRoulette(sp, id);
  }

  // ---- การ์ดคำถาม (ใช้ทั้ง 2 โหมด) time_limit มาจากตัวคำถามเอง (L4 = 25 วิ) ----
  function startQuiz(mode, q, level, toast, sess) {
    // จดสถานะไว้ก่อนเริ่มจับเวลา — refresh แล้วกลับมาได้ข้อเดิม เวลาที่เหลือเท่าเดิม
    sess = sess || Session.begin({ route: "space", key: routeKey(), mode, level, qkey: qKey(q) }, q.time_limit);
    screen.innerHTML = `
      <div class="card">
        ${zoneTag(sp.zone)}
        <h2>${sp.name_th}</h2>
        <p style="font-size:14px;">ราคา <span class="price">${sp.price.toLocaleString()} TechCoin</span> · โหมด <b>${mode === "confident" ? "มั่นใจ 💎" : "ปกติ"}</b></p>
      </div>
      <div class="card">
        ${toast ? `<div class="result info" style="margin-bottom:10px;">${toast}</div>` : ""}
        <div id="timerBox"></div>
        <p class="q" id="qText"></p>
        <div id="choices"></div>
        <div id="result"></div>
      </div>`;
    document.getElementById("qText").textContent = "Q: " + q.question_th;

    renderQuiz(q, (ok, timedOut) => {
      logAnswer(mode === "confident" ? "buy_confident" : "buy", id, level, ok, { question_level: level });

      if (ok && mode === "confident") { SFX.fanfare(); flash("gold"); }
      else if (ok) { SFX.correct(); flash("green"); }
      else if (!timedOut) { SFX.wrong(); flash("red"); }

      // เลน มั่นใจ+ผิด — ไม่รู้ยอดทันที ต้องหมุนวงล้อสุ่มผลแก้บั๊ก (คงพฤติกรรม REV 1.6)
      if (!ok && mode === "confident") {
        // ยังไม่เคลียร์ cc_active — เทิร์นยังไม่จบจนกว่าจะหมุนวงล้อ (กัน refresh หนีค่าปรับ)
        Session.patch({ phase: "roulette" });
        document.getElementById("result").innerHTML = `
          <div class="result lose">💥 มั่นใจแต่พลาด — ระบบพัง! ต้องสุ่มผลแก้บั๊ก</div>
          <button class="btn" id="spinBtn">🎰 หมุนแก้บั๊ก</button>
          <div id="rouletteBox"></div>`;
        document.getElementById("spinBtn").onclick = () => spinFailRoulette(sp, id);
        return;
      }

      Session.done(routeKey());   // จบ flow ของช่องนี้
      const pay = payPrice(mode, ok).toLocaleString();
      let msg;
      if (ok) msg = mode === "confident"
        ? `<div class="result win pop">🔥🎉 มั่นใจแล้วถูกจริง! ซื้อได้ในราคา <b>${pay}</b> (ลด ${conf.discount_percent}%)</div>`
        : `<div class="result win">🎉 ตอบถูก! ซื้อได้ในราคา <b>${pay}</b> (ลด ${CONFIG.discount_percent}%)</div>`;
      else msg = `<div class="result lose">ตอบผิด — ซื้อได้ในราคาเต็ม ${sp.price.toLocaleString()} TechCoin</div>`;
      document.getElementById("result").innerHTML = msg;
    }, false, sess);
  }

  // กู้สถานะเดิมถ้ามี (refresh กลางคัน) ไม่งั้นเริ่มที่หน้าเลือกโหมดตามปกติ
  if (resume) {
    if (resume.phase === "roulette") { renderRouletteStage(); return; }
    const q = findQuestion(resume.qkey);
    if (q) { startQuiz(resume.mode, q, resume.level, undefined, resume); return; }
    Session.clear();   // คำถามหายจากคลัง (ข้อมูลเปลี่ยน) — เริ่มใหม่ดีกว่าค้าง
  }
  renderModeSelect();
}

// ---------- วงล้อสุ่มผลแก้บั๊ก (เฉพาะเลน มั่นใจ! + ตอบผิด) ----------
// สุ่มผลด้วย weightedPick ตัวเดียวกับ event card / เสียงหมุนใช้ SFX.tick เดิม
function spinFailRoulette(sp, spaceId) {
  const btn = document.getElementById("spinBtn");
  btn.disabled = true;
  const box = document.getElementById("rouletteBox");
  const pool = CONFIG.fail_roulette;
  const final = weightedPick(pool);   // ผลจริงถูกล็อกก่อน แอนิเมชันแค่โชว์

  const showFrame = (text, cls = "") => {
    box.innerHTML = `<div class="roulette-frame ${cls}" id="rouletteFrame"></div>`;
    document.getElementById("rouletteFrame").textContent = text;
    return document.getElementById("rouletteFrame");
  };

  let delay = 60;
  (function step() {
    delay *= 1.15;                    // หน่วงขึ้นเรื่อย ๆ เหมือนวงล้อผ่อนแรง (~1.7 วิ)
    if (delay < 320) {
      showFrame(pool[Math.floor(Math.random() * pool.length)].label);
      SFX.tick(false);
      setTimeout(step, delay);
      return;
    }
    // เด้งผลจริง
    const pay = Math.round(sp.price * final.mult);
    const frame = showFrame("", "final");
    frame.innerHTML = `
      <div id="rouletteLabel" style="font-size:17px;"></div>
      <div class="price" style="font-size:21px; margin-top:6px;">จ่าย ${pay.toLocaleString()} TechCoin</div>
      ${final.skip ? `<div style="color:var(--bad); font-weight:700; margin-top:6px;">⏸ และผู้เล่นคนนี้ต้องข้ามตาถัดไป 1 รอบ</div>` : ""}`;
    document.getElementById("rouletteLabel").textContent = final.label;

    if (final.mult < 1)      { SFX.correct(); flash("green"); }   // รอดถูกกว่าราคาเต็ม
    else if (final.mult > 1 || final.skip) { SFX.wrong(); flash("red"); }
    logAnswer("fail_roulette", spaceId, 1, false, { roulette_label: final.label, pay });
    Session.done(routeKey());   // วงล้อหยุดแล้ว = จบเทิร์นของช่องนี้จริง ๆ
  })();
}

// ---------- หน้าอัปเกรดทรัพย์สิน (?space={id}&upgrade={level}) ----------
function renderUpgrade(id, level, resume) {
  const sp = SPACES[id];
  const name = CONFIG.upgrade_names[level];

  if (!name) {
    screen.innerHTML = `<div class="card"><h2>ระดับอัปเกรด "${level}" ไม่ถูกต้อง (ใช้ 1-3)</h2>
      <button class="btn" onclick="location.search='?space=${id}'">กลับหน้าช่อง</button></div>`;
    return;
  }

  const pool = QUESTIONS.filter(q => q.space_id === id && q.level === level);
  const infoCard = `
    <div class="card">
      ${zoneTag(sp.zone)}
      <h2>⬆ อัปเกรด: ${sp.name_th}</h2>
      <p class="content">เป้าหมาย: ระดับ <b>${name}</b> · ค่าอัปเกรด <span class="price">${sp.upgrade_cost.toLocaleString()} TechCoin</span></p>
      <p class="content">ค่าเช่าใหม่เมื่อสำเร็จ: <span class="price">${sp.rent[level].toLocaleString()} TechCoin</span></p>
    </div>`;

  if (!pool.length) {
    screen.innerHTML = infoCard + `
      <div class="card">
        <div class="result info">ยังไม่มีคำถามระดับ ${name} (L${level}) สำหรับช่องนี้ในคลัง</div>
        <button class="btn" onclick="location.search='?space=${id}'">กลับหน้าช่อง</button>
      </div>`;
    return;
  }

  // refresh กลางคัน → ใช้คำถามข้อเดิม (ไม่ใช่สุ่มใหม่) แล้วนับเวลาต่อจาก deadline เดิม
  const q = (resume && findQuestion(resume.qkey)) || pool[Math.floor(Math.random() * pool.length)];
  const sess = resume || Session.begin({ route: "upgrade", key: routeKey(), level, qkey: qKey(q) }, q.time_limit);
  screen.innerHTML = infoCard + `
    <div class="card">
      <div id="timerBox"></div>
      <p class="q" id="qText"></p>
      <div id="choices"></div>
      <div id="result"></div>
      <button class="btn ghost" onclick="Session.clear();location.search='?space=${id}'">กลับหน้าช่อง</button>
    </div>`;
  document.getElementById("qText").textContent = "Q: " + q.question_th;

  renderQuiz(q, (ok, timedOut) => {
    Session.done(routeKey());
    logAnswer("upgrade", id, level, ok);
    document.getElementById("result").innerHTML = ok
      ? `<div class="result win pop">🎉 ตอบถูก! จ่าย <b>${sp.upgrade_cost.toLocaleString()}</b> เพื่ออัปเกรดเป็น "${name}" — ค่าเช่าใหม่ <b>${sp.rent[level].toLocaleString()}</b> TechCoin</div>`
      : `<div class="result lose">ตอบผิด — อัปเกรดไม่สำเร็จ ลองใหม่ได้ในเทิร์นถัดไป</div>`;

    if (ok) { SFX.celebrate(); confetti(); }         // อัปเกรดสำเร็จ = highlight moment
    else if (!timedOut) { SFX.wrong(); flash("red"); }
  }, false, sess);
}

// ---------- หน้าช่องเหตุการณ์ ----------
function renderEvent(zone, resume) {
  // refresh กลางเกม speed → ใช้ใบเดิม ไม่ให้สุ่มใบใหม่หนีใบที่ไม่ชอบ
  const ev = (resume && EVENTS.find(e => e.event_id === resume.evId))
          || weightedPick(EVENTS.filter(e => e.zone === zone));

  if (ev.mechanic === "speed") { renderSpeedEvent(ev, zone, resume); return; }

  // ใบที่ไม่มีการจับเวลา: จดทันทีที่เปิด — กันสแกนซ้ำเพื่อรีดสุ่มใบใหม่
  Session.markDone(routeKey());
  let body = "";

  if (ev.mechanic === "choice") {
    const [bet, safe] = ev.effect.split("|");
    const [, amount, mult] = bet.split(":");
    body = `
      <button class="choice" id="betBtn">🎲 เดิมพัน ${(+amount).toLocaleString()} — ลุ้นรับ ${mult}</button>
      <button class="choice" id="safeBtn">✅ ${effectText(safe.split(":")[1] ?? safe.replace("safe:",""))}</button>
      <div id="result"></div>`;
  } else {
    body = `<div class="result info">${effectText(ev.effect)}</div>`;
  }

  screen.innerHTML = `
    <div class="card">
      ${zoneTag(zone)}
      <h2>🎰 ${ev.title_th}</h2>
      ${ev.description_th ? `<p class="content" id="evDesc" style="margin-bottom:10px;"></p>` : ""}
      ${body}
      <button class="btn ghost" onclick="Session.allowAgain(routeKey());location.search='?space=event_${zone}'">สุ่มใหม่ (ทดสอบ)</button>
      <button class="btn" onclick="renderMenu()">กลับเมนู</button>
    </div>`;

  if (ev.description_th) document.getElementById("evDesc").textContent = ev.description_th;

  if (ev.mechanic === "choice") {
    const [bet] = ev.effect.split("|");
    const [, amount, mult] = bet.split(":");
    document.getElementById("betBtn").onclick = () => {
      const win = Math.random() < 0.5;
      document.getElementById("result").innerHTML = win
        ? `<div class="result win">🎉 ชนะเดิมพัน! รับ ${(amount * parseInt(mult.slice(1))).toLocaleString()} TechCoin</div>`
        : `<div class="result lose">แพ้เดิมพัน เสีย ${(+amount).toLocaleString()} TechCoin</div>`;
    };
    document.getElementById("safeBtn").onclick = () => {
      document.getElementById("result").innerHTML =
        `<div class="result win">รับแบบชัวร์เรียบร้อย ✅</div>`;
    };
  }
}

// ---------- event แบบ speed: แข่งตอบเร็วรอบโต๊ะ ----------
// ไม่ใช่ multiplayer จริง — ทุกคนดูจอเดียวกัน แข่งตอบปากเปล่า แล้วคนถือมือถือ
// กดหมายเลขผู้เล่นที่วงตัดสินว่าตอบถูกไวสุด (state อยู่ในฟังก์ชันนี้ ใช้ครั้งเดียวจบ)
function renderSpeedEvent(ev, zone, resume) {
  // แข่งตอบเร็วด้วยปากเปล่า → ใช้ได้เฉพาะคำถามแบบตัวเลือก (ข้อ "ชี้ตำแหน่ง" อ่านออกเสียงไม่ได้)
  const pool = QUESTIONS.filter(x => !x.qtype);
  const q = (resume && findQuestion(resume.qkey)) || pool[Math.floor(Math.random() * pool.length)];
  const sess = resume || Session.begin(
    { route: "speed", key: routeKey(), evId: ev.event_id, qkey: qKey(q) }, CONFIG.speed_time_limit);

  screen.innerHTML = `
    <div class="card">
      ${zoneTag(zone)}
      <h2>⚡ ${ev.title_th}</h2>
      ${ev.description_th ? `<p class="content" id="evDesc" style="margin-bottom:8px;"></p>` : ""}
      <div class="result info" style="margin-bottom:12px;">แข่งตอบเร็ว! ทุกคนตอบพร้อมกันด้วยปากเปล่า —
        คนที่ตอบถูกและไวที่สุด${effectText(ev.effect)}</div>
      <div id="timerBox"></div>
      <p class="q" id="qText"></p>
      <div id="choices"></div>
      <p class="q" style="margin-top:12px;">ใครตอบถูกไวสุด? (วงตัดสินเอง แล้วกดหมายเลข)</p>
      <div class="speed-players" id="speedPlayers"></div>
      <div id="result"></div>
      <button class="btn ghost" onclick="Session.clear();Session.allowAgain(routeKey());location.search='?space=event_${zone}'">สุ่มใหม่ (ทดสอบ)</button>
      <button class="btn" id="speedBack">กลับเมนู</button>
    </div>`;

  if (ev.description_th) document.getElementById("evDesc").textContent = ev.description_th;
  // คำถาม/ตัวเลือกอาจมีแท็ก HTML เป็นตัวอย่างบทเรียน — ใส่แบบ text ล้วนเสมอ
  document.getElementById("qText").textContent = "Q: " + q.question_th;
  const box = document.getElementById("choices");
  q.choices.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "choice";
    b.disabled = true;  // โชว์ให้อ่านอย่างเดียว — ไม่มีการกดตอบบนจอ
    b.textContent = String.fromCharCode(65 + i) + ". " + c;
    box.appendChild(b);
  });

  const wrap = document.getElementById("speedPlayers");
  let timer = null;

  // กลับเมนูโดยไม่ reload หน้า — ต้องหยุด timer ก่อน ไม่งั้นเสียงติ๊ก/บัซเซอร์ตามไปหน้าเมนู
  document.getElementById("speedBack").onclick = () => {
    clearInterval(timer); Wake.off(); Session.clear(); renderMenu();
  };

  // จบรอบ: winner = เลขผู้เล่น หรือ null = หมดเวลา (กดย้อนหลังไม่ได้ — ปุ่มถูก disable)
  const finish = winner => {
    clearInterval(timer);
    Wake.off();
    Session.done(routeKey());
    [...wrap.children].forEach(b => b.disabled = true);
    box.children[q.answer].classList.add("correct");  // เฉลยให้วงเห็น
    if (winner) {
      SFX.correct(); flash("green");
      logAnswer("speed", ev.event_id || "event_" + zone, 0, true);
      document.getElementById("result").innerHTML =
        `<div class="result win">⚡ ผู้เล่น ${winner} ตอบไวสุด! ${effectText(ev.effect)}</div>`;
    } else {
      document.getElementById("result").innerHTML =
        `<div class="result lose">⏱ หมดเวลา — รอบนี้ไม่มีใครได้รางวัล</div>`;
    }
  };

  for (let p = 1; p <= CONFIG.speed_players; p++) {
    const b = document.createElement("button");
    b.className = "speed-player";
    b.textContent = "ผู้เล่น " + p;
    b.onclick = () => finish(p);
    wrap.appendChild(b);
  }

  // timer แบบเดียวกับ renderQuiz — นับจาก deadline สัมบูรณ์ (refresh แล้วเวลาเดินต่อ)
  const tb = document.getElementById("timerBox");
  const deadline = sess.deadlineTs || (Date.now() + CONFIG.speed_time_limit * 1000);
  const left = () => Math.ceil((deadline - Date.now() - 20) / 1000);
  const paint = t => tb.innerHTML = `<div class="timer ${t <= 5 ? "danger" : ""}">⏱ ${Math.max(0, t)} วินาที</div>`;
  const timeUp = () => { paint(0); SFX.buzzer(); flash("red"); finish(null); };

  if (left() <= 0) timeUp();     // refresh กลับมาหลังหมดเวลา = ปิดรอบทันที
  else {
    paint(left());
    Wake.on();
    timer = setInterval(() => {
      const t = left();
      if (t <= 0) { timeUp(); return; }
      paint(t);
      SFX.tick(t <= 5);
    }, 1000);
  }
}

function renderBugjam() {
  // แถวเก่าที่ไม่มี difficulty ถือเป็น easy (ข้อมูล fallback ในไฟล์นี้ก็เข้าเคสนี้)

          <small>ตอบถูก ออกจากติดบั๊กฟรี</small></button>

// สลับตำแหน่งตัวเลือกแบบสุ่ม (Fisher-Yates) + รีแมป index เฉลย — กันเด็กจำตำแหน่งเฉลยรอบก่อน
// คืน bug ก็อปใหม่ที่ choices สลับแล้ว, answer ชี้ถูก, และ time_limit ตามระดับ (จาก CONFIG)
// order แยกออกมาเพื่อเก็บลง sessionStorage ได้ — refresh แล้วตัวเลือกต้องเรียงเหมือนเดิม
function shuffleOrder(n) {
  const idx = Array.from({ length: n }, (_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return idx;
}
// เวอร์ชัน seeded — ใช้กับบอสไฟต์ที่ต้องสร้างลำดับเดิมซ้ำได้ (กู้สถานะตอน refresh)
function shuffleOrderSeeded(n, rng) {
  const idx = Array.from({ length: n }, (_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return idx;
}
function shuffledBug(bug, timeLimit, order) {
  const idx = order || shuffleOrder(bug.choices.length);
  return { ...bug, choices: idx.map(i => bug.choices[i]), answer: idx.indexOf(bug.answer), time_limit: timeLimit };
}

// โจทย์ Bug Jam หนึ่งข้อตามระดับที่เลือก — 1 เทิร์นตอบได้ครั้งเดียว (ปุ่มล็อกหลังตอบ)
// ตอบผิด/หมดเวลา = เสียค่าปรับ ไม่ให้ลองซ้ำฟรี (state ในฟังก์ชันนี้ ใช้ครั้งเดียวจบ ไม่ persist)
function renderBugQuestion(diff, resume) {
  const isHard = diff === "hard";
  const pool = BUGJAM.filter(b => (b.difficulty || "easy") === diff);
  // refresh กลางคัน → โจทย์เดิม + ตัวเลือกเรียงเดิม + เวลาที่เหลือเดิม
  const raw = (resume && pool.find(b => bugKey(b) === resume.bugKey)) || pool[Math.floor(Math.random() * pool.length)];
  const tl = isHard ? CONFIG.bugjam_time_hard : CONFIG.bugjam_time_easy;
  const order = (resume && resume.order) || shuffleOrder(raw.choices.length);
  const bug = shuffledBug(raw, tl, order);
  const sess = resume || Session.begin(
    { route: "bugjam", key: routeKey(), diff, bugKey: bugKey(raw), order }, tl);
  const fine = isHard ? CONFIG.bugjam_fine_hard : CONFIG.bugjam_fine;
  let hintUsed = !!(resume && resume.hintUsed);   // เคยกด hint ไปแล้วก็ยังนับว่ากดแล้ว

  screen.innerHTML = `
    <div class="card">
      <span class="zone-tag" style="background:var(--bad)">ติดบั๊ก (Bug Jam) · ระดับ${isHard ? "ยาก 💎" : "ง่าย"}</span>
      <h2>แก้โจทย์ Debug เพื่อออก!</h2>
      <p class="content" style="font-size:12.5px;margin-bottom:8px;">⚠️ ตอบได้ครั้งเดียว! ผิดหรือหมดเวลา = เสียค่าปรับ ${fine.toLocaleString()} หรือรอทอยรอบหน้า</p>
      <div id="timerBox"></div>
      <div class="code-box" id="bugCode"></div>
      <p class="q" id="qText"></p>
      <div id="choices"></div>
      ${bug.hint ? `
        <button class="btn ghost" id="hintBtn">💡 ดู hint${isHard
          ? ` (โบนัสจะลดเหลือ ${CONFIG.bugjam_bonus_hint})` : ""}</button>
        <div class="result info" id="hintText" style="display:none;"></div>` : ""}
      <div id="result"></div>
    </div>`;
  document.getElementById("bugCode").textContent = bug.code;
  document.getElementById("qText").textContent = "Q: " + bug.question_th;

  const hintBtn = document.getElementById("hintBtn");
  const showHint = () => {
    hintBtn.disabled = true;  // กดได้ครั้งเดียวต่อโจทย์
    const ht = document.getElementById("hintText");
    ht.textContent = "💡 " + bug.hint;
    ht.style.display = "block";
  };
  if (hintBtn) {
    hintBtn.onclick = () => { hintUsed = true; Session.patch({ hintUsed: true }); showHint(); };
    if (hintUsed) showHint();   // refresh หลังกด hint → ยังเห็น hint เดิม ปุ่มยังล็อก
  }

  renderQuiz(bug, (ok, timedOut) => {
    Session.done(routeKey());
    if (hintBtn) hintBtn.disabled = true;
    logAnswer(isHard ? "bugjam_hard" : "bugjam", bug.bug_id || "bugjam", 0, ok, { difficulty: diff, hinted: hintUsed });
    let msg;
    if (ok && isHard) {
      const bonus = hintUsed ? CONFIG.bugjam_bonus_hint : CONFIG.bugjam_bonus_hard;
      msg = `<div class="result win pop">🔓💎 Debug สำเร็จ! ออกจากติดบั๊กฟรี + โบนัส ${bonus.toLocaleString()} TechCoin</div>`;
    } else if (ok) {
      msg = `<div class="result win">🔓 Debug สำเร็จ! ออกจากติดบั๊กได้ฟรี</div>`;
    } else {
      // ตอบผิด/หมดเวลา = เสียค่าปรับ ห้ามลองซ้ำในเทิร์นนี้ (ระดับยากเสี่ยงกว่า + อดโบนัส)
      const head = timedOut ? "⏱ หมดเวลา!" : "❌ แก้ไม่สำเร็จ!";
      msg = `<div class="result lose">${head} เสียค่าปรับ <b>${fine.toLocaleString()}</b> TechCoin${isHard ? " + อดโบนัส 💎" : ""}<br>
        <span style="font-size:12.5px;">รอทอยรอบหน้าค่อยลองใหม่ — ห้ามตอบซ้ำในเทิร์นนี้</span></div>`;
    }
    document.getElementById("result").innerHTML = msg;
    document.getElementById("result").insertAdjacentHTML("beforeend",
      `<button class="btn" onclick="renderMenu()">กลับเมนู</button>`);

    if (ok) { SFX.correct(); flash("green"); }
    else if (!timedOut) { SFX.wrong(); flash("red"); }
  }, true, sess);
}

// ---------- ระบบควิซ + จับเวลา (ใช้ร่วมกันทุกหน้า) ----------
// onDone(ok, timedOut) — timedOut = true เฉพาะกรณีหมดเวลา (เสียง buzzer + แฟลชแดง
// เล่นจากในนี้แล้ว ผู้เรียกจัดการเฉพาะเสียง/เอฟเฟกต์ของการคลิกตอบ)
/* =====================================================================
   คำถามแบบ "ชี้ตำแหน่ง" — hotspot / colorwheel / linepick

   แยกเป็น 2 ชั้น: renderQuestion เป็น dispatcher / แต่ละแบบมี renderer ของตัวเอง
   ทุก renderer คืนคำตอบผ่าน onAnswer(ถูกไหม) เหมือน MCQ เป๊ะ — ไม่รู้เรื่องเงิน
   ส่วนลด หรือ flow ของเกม และคืน { lock } ให้ผู้เรียกล็อกอินพุตตอนหมดเวลา
   ===================================================================== */

    <path d="M60 230 H120 L132 242 H210 M330 180 H346 V210"/>

// ชื่อสีไทย ↔ องศาบนวงล้อ (เสี้ยว i กินมุม i*30 ถึง (i+1)*30 สี hsl(i*30))
const WHEEL_COLORS = {
  red:     { th: "สีแดง",          hue: 0   },
  orange:  { th: "สีส้ม",           hue: 30  },
  yellow:  { th: "สีเหลือง",        hue: 60  },
  lime:    { th: "สีเขียวอมเหลือง", hue: 90  },
  green:   { th: "สีเขียว",         hue: 120 },
  teal:    { th: "สีเขียวอมฟ้า",    hue: 150 },
  cyan:    { th: "สีฟ้าอมเขียว",    hue: 180 },
  azure:   { th: "สีฟ้า",           hue: 210 },
  blue:    { th: "สีน้ำเงิน",        hue: 240 },
  violet:  { th: "สีม่วง",          hue: 270 },
  magenta: { th: "สีบานเย็น",       hue: 300 },
  rose:    { th: "สีชมพูอมแดง",     hue: 330 },
};

const SVG_NS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
// คืนจำนวนเต็มเมื่อค่าเป็นตัวเลขล้วนจริง ๆ ("" → null ไม่ใช่ 0)
const intOf = v => {
  const s = String(v == null ? "" : v).trim();
  return /^-?\d+$/.test(s) ? +s : null;
};

const QTYPES = {
  hotspot: {
    valid: q => {
      const a = String(q.answer || "").trim();
      return /^\d{1,3},\d{1,3},\d{1,3}$/.test(a)
        && a.split(",").every(n => +n >= 0 && +n <= 100)
        && !!ASSETS[String(q.asset || "").trim()];
    },
    render: (q, cb) => renderHotspot(q, cb),
  },
  colorwheel: {
    valid: q => {
      const d = intOf(q.answer), t = intOf(q.payload);
      return d !== null && d >= 0 && d <= 359 && t !== null && t >= 1 && t <= 45;
    },
    render: (q, cb) => renderColorWheel(q, cb),
  },
  linepick: {
    valid: q => {
      const p = String(q.payload || ""), n = intOf(q.answer);
      return p !== "" && n !== null && n >= 1 && n <= p.split("\n").length;
    },
    render: (q, cb) => renderLinePick(q, cb),
  },
};

// เรนเดอร์ไม่ได้จริง ๆ (qtype เพี้ยน + ไม่มีตัวเลือกให้ถอย) — คัดทิ้งตั้งแต่ตอนโหลด
// จะได้ไม่ถูกสุ่มมาให้ผู้เล่นเจอข้อที่ตอบไม่ได้
function questionUsable(q) {
  const t = String(q.qtype || "").trim().toLowerCase();
  const hasChoices = Array.isArray(q.choices) && q.choices.length > 0;
  if (!t) return hasChoices;
  const spec = QTYPES[t];
  return !!((spec && spec.valid(q)) || hasChoices);
}

// dispatcher — default ต้องตกมาที่ MCQ เสมอ ห้ามจอขาว
function renderQuestion(q, onAnswer) {
  const t = String(q.qtype || "").trim().toLowerCase();
  if (t) {
    const spec = QTYPES[t];
    if (!spec)
      console.warn(`[qtype] "${t}" ไม่รู้จัก (${q.question_id}) — ถอยไปใช้ตัวเลือกแบบเดิม`);
    else if (!spec.valid(q))
      console.warn(`[qtype] ข้อมูล ${t} ของ ${q.question_id} ไม่ถูกต้อง — ถอยไปใช้ตัวเลือกแบบเดิม`);
    else
      return spec.render(q, onAnswer);
  }
  return renderMCQ(q, onAnswer);
}

// ---------- แบบเดิม: ตัวเลือก a/b/c/d ----------
function renderMCQ(q, onAnswer) {
  const box = document.getElementById("choices");
  if (!q.choices || !q.choices.length) {
    // ไม่มีทั้ง renderer และตัวเลือก — ให้ทางออกไว้ ไม่ปล่อยให้ผู้เล่นค้าง
    box.innerHTML = `<div class="result info">⚠️ ข้อนี้แสดงผลไม่ได้</div>`;
    const b = document.createElement("button");
    b.className = "btn ghost";
    b.textContent = "ข้ามข้อนี้ (นับว่าตอบผิด)";
    b.onclick = () => { b.disabled = true; onAnswer(false); };
    box.appendChild(b);
    return { lock: () => { b.disabled = true; } };
  }
  q.choices.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "choice";
    b.textContent = String.fromCharCode(65 + i) + ". " + c;
    b.onclick = () => {
      [...box.children].forEach((el, j) => {
        el.disabled = true;
        if (j === q.answer) el.classList.add("correct");
        else if (j === i) el.classList.add("wrong");
      });
      onAnswer(i === q.answer);
    };
    box.appendChild(b);
  });
  return { lock: () => [...box.children].forEach(el => el.disabled = true) };
}

// ---------- hotspot: แตะตำแหน่งบนภาพ ----------
function renderHotspot(q, onAnswer) {
  const box = document.getElementById("choices");
  const [ax, ay, ar] = String(q.answer).split(",").map(Number);

  box.innerHTML = `<div class="point-wrap" id="hsWrap"></div>
    <p class="point-hint">แตะตำแหน่งบนภาพเพื่อตอบ</p>
    <button class="btn ghost" id="hsSkip">ข้ามข้อนี้ (นับว่าตอบผิด)</button>`;
  const wrap = document.getElementById("hsWrap");
  wrap.innerHTML = ASSETS[String(q.asset).trim()];
  const svg = wrap.querySelector("svg");
  svg.removeAttribute("preserveAspectRatio");   // ต้องคงอัตราส่วน ไม่งั้นพิกัดเพี้ยน
  const skip = document.getElementById("hsSkip");
  let locked = false;

  const lock = () => { locked = true; skip.disabled = true; svg.style.cursor = "default"; };

  // เฉลย: วงกลมเส้นประ + ชื่อชิ้นส่วน — ตอบผิดแล้วยังได้เรียน
  const reveal = () => {
    const vb = svg.viewBox.baseVal;
    const cx = ax / 100 * vb.width, cy = ay / 100 * vb.height, r = ar / 100 * vb.width;
    svg.appendChild(svgEl("circle", {
      cx, cy, r, fill: "none", stroke: "#4ADE80", "stroke-width": 2.5, "stroke-dasharray": "7 5",
    }));
    const label = String(q.payload || "").trim();
    if (!label) return;
    const t = svgEl("text", {
      x: Math.min(vb.width * 0.82, Math.max(vb.width * 0.18, cx)),
      y: Math.max(vb.width * 0.05, cy - r - 6),
      "text-anchor": "middle", "font-family": "'Kanit',sans-serif",
      "font-size": Math.round(vb.width * 0.045), fill: "#4ADE80",
      stroke: "#05100C", "stroke-width": 3.5, "paint-order": "stroke",  // ขอบเข้มให้อ่านออกบนลายวงจร
    });
    t.textContent = label;   // ชื่อชิ้นส่วนมาจากข้อมูล — ใส่แบบ text ล้วนเสมอ
    svg.appendChild(t);
  };

  svg.addEventListener("click", ev => {
    if (locked) return;
    // คิดกรอบใหม่ทุกครั้งที่แตะ — หมุนจอ/ย่อขยายแล้วพิกัดยังถูก
    const rect = svg.getBoundingClientRect();
    const px = (ev.clientX - rect.left) / rect.width * 100;
    const py = (ev.clientY - rect.top) / rect.height * 100;
    const vb = svg.viewBox.baseVal;
    const dx = (px - ax) / 100 * vb.width;
    const dy = (py - ay) / 100 * vb.height;
    // รัศมีคิดเป็น % ของความกว้าง viewBox เสมอ — พื้นที่จะได้เป็นวงกลมจริง ไม่ใช่วงรี
    const hit = Math.hypot(dx, dy) <= ar / 100 * vb.width;

    lock();
    svg.appendChild(svgEl("circle", {          // จุดทองตรงที่แตะ ให้รู้ว่าระบบรับแล้ว
      cx: px / 100 * vb.width, cy: py / 100 * vb.height, r: Math.max(4, vb.width * 0.013),
      fill: "#FBBF24", stroke: "#05100C", "stroke-width": 1.5,
    }));
    if (!hit) reveal();
    onAnswer(hit);
  });

  skip.onclick = () => { if (locked) return; lock(); reveal(); onAnswer(false); };
  return { lock };
}

// ---------- colorwheel: แตะเสี้ยวสีบนวงล้อ ----------
function renderColorWheel(q, onAnswer) {
  const box = document.getElementById("choices");
  const deg = intOf(q.answer), tol = intOf(q.payload);
  const key = String(q.asset || "").replace(/^wheel:/i, "").trim().toLowerCase();
  const info = WHEEL_COLORS[key] || { th: key || "สีโจทย์", hue: null };
  const C = 150, R_OUT = 118, R_IN = 52;

  // 0° อยู่ด้านบน แล้วไล่ตามเข็มนาฬิกา
  const pt = (r, a) => {
    const t = (a - 90) * Math.PI / 180;
    return [C + r * Math.cos(t), C + r * Math.sin(t)];
  };
  const wedge = (a0, a1) => {
    const [x0, y0] = pt(R_OUT, a0), [x1, y1] = pt(R_OUT, a1);
    const [x2, y2] = pt(R_IN, a1), [x3, y3] = pt(R_IN, a0);
    return `M${x0} ${y0}A${R_OUT} ${R_OUT} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${R_IN} ${R_IN} 0 0 0 ${x3} ${y3}Z`;
  };

  let wedges = "";
  for (let i = 0; i < 12; i++)
    wedges += `<path d="${wedge(i * 30, (i + 1) * 30)}" fill="hsl(${i * 30} 78% 55%)" stroke="#05100C" stroke-width="1"/>`;
  const ring = info.hue === null ? ""   // วงแหวนทองรอบสีโจทย์ ให้เห็นว่าโจทย์อยู่ตรงไหน
    : `<path d="${wedge(info.hue, info.hue + 30)}" fill="none" stroke="#FBBF24" stroke-width="4"/>`;

  box.innerHTML = `<div class="point-wrap">
      <svg viewBox="0 0 300 300" id="cwSvg">
        ${wedges}${ring}
        <circle cx="150" cy="150" r="50" fill="#0D3327" stroke="#1F4A3A" stroke-width="1.5"/>
        <text id="cwName" x="150" y="150" text-anchor="middle" dominant-baseline="central"
              font-family="'Kanit',sans-serif" font-size="19" fill="#FBBF24"></text>
      </svg>
    </div>
    <p class="point-hint">แตะบนวงแหวนสีเพื่อตอบ (แตะตรงกลางหรือนอกวงไม่นับ)</p>`;
  document.getElementById("cwName").textContent = info.th;

  const svg = document.getElementById("cwSvg");
  let locked = false;
  svg.addEventListener("click", ev => {
    if (locked) return;
    const rect = svg.getBoundingClientRect();
    const px = (ev.clientX - rect.left) / rect.width * 100;
    const py = (ev.clientY - rect.top) / rect.height * 100;
    const dist = Math.hypot((px - 50) / 100 * 300, (py - 50) / 100 * 300);
    if (dist <= R_IN || dist >= R_OUT) return;   // แตะตรงกลาง/นอกวง = ไม่นับ ยังแตะใหม่ได้

    const ang = (Math.atan2(py - 50, px - 50) * 180 / Math.PI + 90 + 360) % 360;
    const diff = Math.abs(((ang - deg + 540) % 360) - 180);   // ระยะเชิงมุมสั้นสุด
    const hit = diff <= tol;
    locked = true;
    svg.style.cursor = "default";
    svg.appendChild(svgEl("circle", {
      cx: px / 100 * 300, cy: py / 100 * 300, r: 7,
      fill: "#FBBF24", stroke: "#05100C", "stroke-width": 2,
    }));
    if (!hit) svg.appendChild(svgEl("path", {   // เฉลย: กรอบเขียวรอบเสี้ยวที่ถูก
      d: wedge(deg - 15, deg + 15), fill: "none",
      stroke: "#4ADE80", "stroke-width": 4, "stroke-dasharray": "8 5",
    }));
    onAnswer(hit);
  });
  return { lock: () => { locked = true; } };
}

// ---------- linepick: แตะบรรทัดโค้ดที่ผิด ----------
function renderLinePick(q, onAnswer) {
  const box = document.getElementById("choices");
  const lines = String(q.payload || "").split("\n");
  const ansLine = intOf(q.answer);
  box.innerHTML = `<div class="lp-box" id="lpBox"></div>
    <p class="point-hint">แตะบรรทัดที่คิดว่าผิด</p>`;
  const wrap = document.getElementById("lpBox");
  const rows = [];
  let locked = false;

  const lock = () => { locked = true; rows.forEach(r => r.disabled = true); };

  lines.forEach((ln, i) => {
    const row = document.createElement("button");
    row.className = "lp-row";
    row.innerHTML = `<span class="lp-num"></span><span class="lp-code"></span>`;
    row.querySelector(".lp-num").textContent = i + 1;
    row.querySelector(".lp-code").textContent = ln;   // โค้ดอาจมีอักขระพิเศษ — text ล้วนเสมอ
    row.onclick = () => {
      if (locked) return;
      const ok = (i + 1) === ansLine;
      lock();
      if (ok) {
        row.classList.add("answer");
      } else {
        row.classList.add("picked");                       // บรรทัดที่แตะ = แดง
        rows[ansLine - 1] && rows[ansLine - 1].classList.add("answer");   // บรรทัดเฉลย = เขียว
      }
      onAnswer(ok);
    };
    rows.push(row);
    wrap.appendChild(row);
  });
  return { lock };
}

// sess = record จาก Session.begin (ถ้ามี) — เวลานับจาก deadlineTs สัมบูรณ์
// จึงกัน "refresh หนีเวลา" ได้: โหลดใหม่แล้วเวลาเดินต่อ ไม่ได้เริ่มนับหนึ่ง
function renderQuiz(q, onDone, timeout_fail, sess) {
  let timer = null, done = false;
  const stop = () => { clearInterval(timer); Wake.off(); };

  // คำถามทุกแบบผ่านทางเดียวกันหมด — ตัวจับเวลา/เสียง/เอฟเฟกต์อยู่ที่นี่ที่เดียว
  const view = renderQuestion(q, ok => {
    if (done) return;
    done = true;
    stop();
    onDone(ok, false);
  });

  if (q.time_limit > 0) {
    const tb = document.getElementById("timerBox");
    const deadline = (sess && sess.deadlineTs) || (Date.now() + q.time_limit * 1000);
    // -20ms กันเคส setInterval เด้งเร็วกว่ากำหนดนิดหน่อยแล้วเลขค้างซ้ำวินาที
    const left = () => Math.ceil((deadline - Date.now() - 20) / 1000);
    const paint = t => tb.innerHTML = `<div class="timer ${t <= 5 ? "danger" : ""}">⏱ ${Math.max(0, t)} วินาที</div>`;
    const timeUp = () => {
      if (done) return;
      done = true;
      stop();
      paint(0);
      view.lock();
      SFX.buzzer();
      flash("red");
      onDone(false, true);
    };

    if (left() <= 0) { timeUp(); return; }   // refresh กลับมาหลังหมดเวลา = เข้า flow หมดเวลาทันที
    paint(left());
    Wake.on();
    timer = setInterval(() => {
      const t = left();
      if (t <= 0) { timeUp(); return; }
      paint(t);
      SFX.tick(t <= 5);
    }, 1000);
  }
}

/* =====================================================================
   มินิเกม "กู้บั๊กด่วน" (Debug Rescue) — 2 คน 2 มือถือ
   ---------------------------------------------------------------------
   ไม่มี backend: ทั้งคู่พิมพ์ "รหัสร่วม 4 ตัว" เดียวกัน → seed → derive
   ปริศนา+กฎชุดเดียวกันแบบ deterministic (solver ตรวจผลเองได้)
   ===================================================================== */

// PRNG แบบ deterministic จาก string seed (mulberry32) — ต้องได้ผลเดิมทุกเครื่อง
// หมายเหตุ: weightedPick เดิมใช้ Math.random (สุ่มสด) จึงใช้ที่นี่ไม่ได้ เพราะ 2 เครื่องต้องตรงกัน
function seededRng(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  let a = h >>> 0;
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rngInt = (rng, lo, hi) => lo + Math.floor(rng() * (hi - lo + 1)); // รวม hi

// เช็คว่า layout นี้ "กฎ apply ได้จริง" — กัน edge case ที่ guide อ่านกฎแล้วหาเส้นไม่เจอ
// (เช่น v1 มีเหลืองแต่ไม่มีน้ำเงิน, v4 มีเส้นเข้าเงื่อนไขไม่ถึง 2)
function wireRuleClean(colors, vid) {
  if (vid === "v1") return !colors.includes("yellow") || colors.includes("blue");
  if (vid === "v3") {
    const hasDup = colors.some((c, i) => colors.indexOf(c) !== i);
    return hasDup || colors.includes("green");
  }
  if (vid === "v4") return colors.filter(c => c !== "red" && c !== "green").length >= 2;
  return true; // v2 แก้ได้เสมอ
}

// สร้างสถานะ wire_cut จาก seed — ทั้ง solver/guide เรียกโค้ดเดียวกัน = ผลตรงกันเป๊ะ
function buildWireCut(rng) {
  const P = CONFIG.debug_rescue.patterns.find(p => p.id === "wire_cut");
  const n = rngInt(rng, P.wire_count_range[0], P.wire_count_range[1]);
  let variant = P.rule_variants[rngInt(rng, 0, P.rule_variants.length - 1)];
  let colors;
  // ดึงสีใหม่จนกฎ apply ได้จริง (rng เดินเหมือนกันทั้ง 2 เครื่อง จึงยัง deterministic)
  for (let tries = 0; tries < 24; tries++) {
    colors = Array.from({ length: n }, () => P.wire_colors[rngInt(rng, 0, P.wire_colors.length - 1)]);
    if (wireRuleClean(colors, variant.id)) break;
    if (tries === 23) variant = P.rule_variants[1]; // v2 แก้ได้เสมอ — กันลูปไม่จบ
  }
  return { colors, variant, answer: wireAnswer(colors, variant.id) };
}

// คำนวณลำดับเส้นที่ต้องตัด (index) ตามกฎแต่ละเวอร์ชัน — fallback ให้แก้ได้เสมอ
function wireAnswer(colors, vid) {
  const firstOf = c => colors.indexOf(c);
  if (vid === "v1") {
    if (colors.includes("yellow")) { const b = firstOf("blue"); return [b >= 0 ? b : 0]; }
    return [0];
  }
  if (vid === "v2") {
    const reds = colors.filter(c => c === "red").length;
    return [reds % 2 === 0 ? colors.length - 1 : Math.max(0, colors.length - 2)];
  }
  if (vid === "v3") {
    const dupColor = colors.find((c, i) => colors.indexOf(c) !== i && colors.indexOf(c) === colors.lastIndexOf(c) - (colors.filter(x => x === c).length - 1))
      || colors.find(c => colors.filter(x => x === c).length >= 2);
    if (dupColor) return [colors.indexOf(dupColor)];
    const g = firstOf("green"); return [g >= 0 ? g : 0];
  }
  if (vid === "v4") {
    const idxs = colors.map((c, i) => ({ c, i })).filter(o => o.c !== "red" && o.c !== "green").map(o => o.i);
    return idxs.length ? idxs.slice(0, 2) : [0];
  }
  return [0];
}

// timer ร่วม (เริ่มนับเมื่อกด "เริ่ม" บนเครื่องตัวเอง — ไม่ sync เป๊ะข้ามเครื่อง ตามสเปค)
// onEnd(false) เมื่อหมดเวลา, คืนฟังก์ชัน stop ให้หยุดเมื่อชนะ/ออกจากหน้า
function rescueTimer(seconds, boxId, onEnd) {
  let t = seconds;
  const tb = document.getElementById(boxId);
  const paint = () => tb.innerHTML = `<div class="timer ${t <= 5 ? "danger" : ""}">⏱ ${t} วินาที</div>`;
  paint();
  Wake.on();   // กันจอดับระหว่างลุ้น (มินิเกมนี้มือไม่ได้แตะจอนาน ๆ)
  const iv = setInterval(() => {
    t--; paint();
    if (t <= 0) { clearInterval(iv); Wake.off(); SFX.buzzer(); flash("red"); onEnd(false); }
    else SFX.tick(t <= 5);
  }, 1000);
  return {
    stop: () => { clearInterval(iv); Wake.off(); },
    cut: pct => { t = Math.max(1, Math.round(t * (1 - pct))); paint(); }, // ตัดเวลาเมื่อขอ hint
  };
}

// หน้า solver (ผู้กด) — เห็นปริศนา ตรวจผลเอง
function renderRescueSolver(code) {
  const P = CONFIG.debug_rescue.patterns.find(p => p.id === "wire_cut");
  const state = buildWireCut(seededRng(code));
  let step = 0, done = false, timer = null, hinted = false;

  screen.innerHTML = `
    <div class="card">
      <span class="zone-tag" style="background:var(--bad)">🖥 ผู้กด · รหัส ${code}</span>
      <h2>${P.name} — ตัดให้ถูก!</h2>
      <p class="content">ฟังผู้อ่านคู่มือบอก แล้วกด "ตัด" ตามลำดับ</p>
      <div id="rTimer"></div>
      <div id="wires" style="margin:12px 0;"></div>
      <button class="btn ghost" id="rHint">💡 ขอ hint (เสียเวลา ${Math.round(CONFIG.debug_rescue.hint_time_cut*100)}%)</button>
      <div id="rHintBox"></div>
      <div id="rResult"></div>
    </div>`;

  const wrap = document.getElementById("wires");
  state.colors.forEach((c, i) => {
    const row = document.createElement("div");
    row.className = "wire-row";
    row.innerHTML = `<span class="wire-idx">${i + 1}</span>
      <div class="wire-bar" style="background:${WIRE_HEX[c]}"></div>
      <button class="wire-cut-btn">✂ ตัด</button>`;
    row.querySelector("button").onclick = () => cut(i, row);
    wrap.appendChild(row);
  });

  const finish = ok => {
    if (done) return;
    done = true; timer.stop();
    wrap.querySelectorAll("button").forEach(b => b.disabled = true);
    document.getElementById("rHint").disabled = true;
    const r = CONFIG.debug_rescue.reward, pen = CONFIG.debug_rescue.penalty;
    if (ok) { SFX.celebrate(); confetti();
      document.getElementById("rResult").innerHTML = `<div class="result win pop">🎉 กู้ระบบสำเร็จ! ทั้งคู่รับ ${r.toLocaleString()} TechCoin</div>`;
    } else { SFX.wrong(); flash("red");
      document.getElementById("rResult").innerHTML = `<div class="result lose">💀 ระบบล่ม — ทั้งคู่เสีย ${pen.toLocaleString()} TechCoin</div>`;
    }
    logAnswer("debug_rescue", "debug_rescue", 0, ok, { pattern: "wire_cut", variant: state.variant.id, hinted });
    const back = document.createElement("button");
    back.className = "btn"; back.textContent = "กลับเมนู";
    back.onclick = renderMenu; document.getElementById("rResult").appendChild(back);
  };

  function cut(i, row) {
    if (done || row.classList.contains("cut")) return;
    row.classList.add("cut");
    row.querySelector("button").disabled = true;
    if (i === state.answer[step]) { SFX.correct(); step++; if (step >= state.answer.length) finish(true); }
    else finish(false);  // ตัดผิดเส้น = ล่มทันที
  }

  document.getElementById("rHint").onclick = () => {
    hinted = true;
    document.getElementById("rHint").disabled = true;
    timer.cut(CONFIG.debug_rescue.hint_time_cut);
    document.getElementById("rHintBox").innerHTML =
      `<div class="result info" style="margin-top:8px;">💡 กฎรอบนี้: ${state.variant.guide_text}</div>`;
  };

  timer = rescueTimer(P.time_limit, "rTimer", finish);
}

// seed ผูกกับ "รอบ + จำนวนคน + เลขผู้เล่น" — คนละ slot = คนละชุดคำถาม (กันลอก)
// slot เดียวกัน = ได้ชุดเดิมเป๊ะ (จำเป็นตอน refresh กลางเกม)
const meltdownSeed = (round, count, slot) => `meltdown-${round}-${count}-${slot}`;
const meltdownTarget = count => Math.ceil(count * CONFIG.cooling_boss.hp_per_player);

// คลังคำถามบอส: คละทุกวิชา (ต่างจากช่องทรัพย์สินที่ผูกวิชาตามช่อง) เอาเฉพาะระดับที่ยากพอ
// สับด้วย seeded RNG ทีละรอบ — ไม่ซ้ำภายในรอบเดียว คลังหมดแล้ววนใหม่โดยสับลำดับใหม่
function meltdownDeck(seedStr) {
  const lv = CONFIG.cooling_boss.question_levels;
  // เฉพาะแบบตัวเลือก — บอสไฟต์เป็นการรัวตอบ ไม่เหมาะกับข้อที่ต้องแตะตำแหน่ง
  let pool = QUESTIONS.filter(q => lv.includes(q.level) && !q.qtype);
  if (!pool.length) pool = QUESTIONS.filter(q => !q.qtype);   // กันเคสข้อมูลสำรองที่ไม่มีระดับเหล่านี้
  const rng = seededRng(seedStr);
  const deck = [];
  while (deck.length < 120 && pool.length)
    shuffleOrderSeeded(pool.length, rng).forEach(i => deck.push(pool[i]));
  return deck;
}

// คำถามข้อที่ idx — ตัวเลือกสับด้วย seed ที่ผูกกับ idx จึงคำนวณกลับมาได้ตอน refresh
const meltdownQuestion = (deck, idx, seedStr) => {
  const q = deck[idx % deck.length];
  return shuffledBug(q, 0, shuffleOrderSeeded(q.choices.length, seededRng(seedStr + "#" + idx)));
};
