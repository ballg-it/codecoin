<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeCoin — QR System</title>
<!-- PWA: path ทุกอันเป็น relative เพราะ deploy บน GitHub Pages แบบ subpath (/codecoin/) -->
<meta name="theme-color" content="#0B2B22">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --board:#0B2B22;      /* พื้น PCB */
    --panel:#0D3327;      /* กล่องเนื้อหา */
    --line:#1F4A3A;       /* เส้นขอบ */
    --gold:#FBBF24;       /* สีทอง (เหตุการณ์/ปุ่มหลัก) */
    --text:#E2E8F0;
    --muted:#94A3B8;
    --ok:#4ADE80;
    --bad:#F87171;
    /* สีประจำโซน */
    --coding:#4ADE80; --design:#FB923C; --office:#38BDF8; --hardware:#F472B6;

    /* ---------- Surface/ink tokens (Stage V1) ----------
       #05100C เดิมทำงาน 2 หน้าที่ปนกัน (พื้นเข้มสุด vs ตัวอักษรบนพื้นสว่าง) — แยกชื่อไว้
       ค่าเท่ากันตอนนี้ แต่วันหลังจะปรับพื้นเข้ม (--surface-deep) โดยไม่พังตัวอักษรบนปุ่มทอง (--ink-on-bright) */
    --surface-deep:#05100C;
    --ink-on-bright:#05100C;
    --panel-2:#0B241B;
    --ink-code:#A7F3D0;
    --bg-win:#0F3B2A;
    --bg-lose:#3B1414;
    --bg-warn:#3A2A0A;
    --ink-warn:#FDE68A;
    --bg-active:#14200E;
    --chrome:#111827;

    /* ---------- Motion tokens (Stage 1) ----------
       ประกาศที่เดียวจบ — ทุก animation ในเกมต้องอ้างค่าจากตรงนี้ ห้ามใส่ตัวเลขดิบ
       งบเวลา: animation ที่ข้ามไม่ได้ ต่อการสแกน 1 ครั้ง รวมกันต้อง ≤ 1.2 วินาที */
    --dur-press: 120ms;   /* T1 กดปุ่ม */
    --dur-enter: 180ms;   /* T1 เข้าหน้าใหม่ */
    --dur-state: 300ms;   /* T2 เฉลยถูก/ผิด, เงินเปลี่ยน */
    --dur-cheer: 600ms;   /* T3 อัปเกรดสำเร็จ, บอสตาย */
    --ease-out: cubic-bezier(.22,1,.36,1);
    --ease-io:  cubic-bezier(.65,0,.35,1);
    --ease-pop: cubic-bezier(.34,1.56,.64,1); /* เด้งเกิน — ใช้เฉพาะจังหวะรางวัล */
  }
  /* ค่าตั้งต้นเมื่อ "ยังไม่เคยกดปุ่มในเว็บ" — เดินตามการตั้งค่าของเครื่อง
     ย่อทุก duration ให้เหลือแค่พอรู้ว่าเปลี่ยนสถานะ */
  @media (prefers-reduced-motion: reduce) {
    :root { --dur-press:1ms; --dur-enter:1ms; --dur-state:120ms; --dur-cheer:120ms; }
  }
  /* ---------- ปุ่มในเว็บชนะมีเดียควีรี ----------
     JS เขียน data-motion ที่ <html> ตั้งแต่ตอนบูต (on = เคลื่อนไหวเต็ม / off = ลดการเคลื่อนไหว)
     attribute selector มี specificity (0,1,1) สูงกว่า :root (0,1,0) จึงทับค่าในมีเดียควีรีได้
     โดยไม่ต้องใช้ !important — เด็กที่เปิด reduce-motion ไว้ในเครื่องจึงกดเปิดกลับเองได้จริง */
  html[data-motion="on"] {
    --dur-press:120ms; --dur-enter:180ms; --dur-state:300ms; --dur-cheer:600ms;
  }
  html[data-motion="off"] {
    --dur-press:1ms; --dur-enter:1ms; --dur-state:120ms; --dur-cheer:120ms;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--board); color:var(--text);
    font-family:'Sarabun',sans-serif; min-height:100vh;
    display:flex; justify-content:center; padding:20px 14px 76px; /* เผื่อพื้นที่ล่างให้ปุ่ม mute ไม่บังปุ่มอื่น */
    background-image:
      linear-gradient(#0F4C3A 1px, transparent 1px),
      linear-gradient(90deg, #0F4C3A 1px, transparent 1px);
    background-size:28px 28px;
  }
  .app { width:100%; max-width:430px; }
  /* perspective ต้องอยู่ที่ "บรรพบุรุษ" ของ element ที่จะ rotateY ไม่ใช่ตัวมันเอง (Stage 4 — การ์ดพลิก)
     ไม่มีผลอะไรกับ element อื่นที่ไม่มี 3D transform เลย ใส่ไว้ล่วงหน้าที่นี่ปลอดภัย */
  #screen { perspective:900px; }

  /* ---------- ส่วนหัวแบบชิป ---------- */
  header {
    background:var(--chrome); border:2px solid var(--gold); border-radius:14px;
    padding:14px 18px; text-align:center; position:relative; margin-bottom:18px;
  }
  header::before, header::after {
    content:""; position:absolute; top:-8px; left:20%; width:60%; height:8px;
    background:repeating-linear-gradient(90deg, var(--gold) 0 4px, transparent 4px 18px);
  }
  header::after { top:auto; bottom:-8px; }
  header h1 { font-family:'Kanit',sans-serif; font-size:24px; color:var(--gold); letter-spacing:1px; }
  header p { font-size:12px; color:#86EFAC; }

  .zone-tag {
    display:inline-block; font-size:12px; font-weight:700; padding:3px 12px;
    border-radius:20px; margin-bottom:10px; color:var(--ink-on-bright);
  }
  .card {
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:18px 16px; margin-bottom:14px;
  }
  h2 { font-family:'Kanit',sans-serif; font-size:20px; margin-bottom:10px; }
  .content { font-size:14.5px; line-height:1.8; color:#CBD5E1; }
  .price { color:var(--gold); font-weight:700; }

  .q { font-weight:700; font-size:15px; margin:6px 0 12px; }
  .choice {
    display:block; width:100%; text-align:left; background:var(--panel-2);
    border:1px solid var(--line); border-radius:10px; color:var(--text);
    padding:12px 14px; font-size:14px; font-family:inherit; margin-bottom:9px; cursor:pointer;
  }
  .choice:hover { border-color:var(--gold); }
  .choice.correct { border-color:var(--ok); background:var(--bg-win); }
  .choice.wrong { border-color:var(--bad); background:var(--bg-lose); }

  .timer { text-align:center; font-family:'Kanit',sans-serif; font-size:18px; color:var(--gold); margin-bottom:10px; }
  .timer.danger { color:var(--bad); }

  /* ---------- วงแหวนนาฬิกา (Stage 2) ----------
     ตัวจับเวลาแสดงผลจริง ไม่ใช่ของประดับ — สร้าง/คุมด้วย WAAPI ตรง ๆ ใน renderQuiz()
     ห้ามผ่าน MOTION.run()/MOTION.d() เด็ดขาด (เหตุผลอยู่ที่จุดสร้าง animation ใน JS) */
  .clock-wrap { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:10px; }
  .clock-wrap .timer { margin-bottom:0; }
  .clock-ring { width:34px; height:34px; flex:0 0 auto; transform:rotate(-90deg); }
  .clock-ring-track { fill:none; stroke:var(--line); stroke-width:3; }
  .clock-ring-fill { fill:none; stroke:var(--gold); stroke-width:3; stroke-linecap:round; }
  .clock-wrap.danger .clock-ring-fill { stroke:var(--bad); }

  /* ---------- จังหวะเฉลย (Stage 3) ----------
     ทุกตัวที่นี่ appended โดย playAnswerFx()/floatBadge() เข้าไปใน element ที่ renderer สร้างไว้
     ไม่ใช่ตัว renderer เองที่สร้าง — position:relative ถูกเซ็ตแบบ inline เฉพาะ element ที่ยังเป็น
     static เท่านั้น (กันพังโครงที่ตั้งใจ position ไว้แล้ว เช่น svg wrap) */
  .fx-check { position:absolute; top:-7px; right:-7px; width:20px; height:20px; pointer-events:none; z-index:2; }
  .fx-check svg { width:100%; height:100%; overflow:visible; }
  .fx-check path { fill:none; stroke:var(--ok); stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
  .fx-correct-glow {
    position:absolute; inset:0; border-radius:inherit; background:rgba(74,222,128,.18);
    pointer-events:none; opacity:0; z-index:1;
  }
  .fx-badge {
    position:absolute; top:-2px; right:6px; font-family:'Kanit',sans-serif; font-size:12.5px;
    font-weight:700; pointer-events:none; z-index:3; text-shadow:0 1px 3px rgba(0,0,0,.6);
  }
  .fx-badge.up { color:var(--ok); }
  .fx-badge.down { color:var(--bad); }
  .money-num { font-variant-numeric: tabular-nums; }   /* กันตัวเลขกระตุกความกว้างตอนนับ */

  /* ---------- กดปุ่มตัวเลือก (Stage 2) ----------
     #choices คือ id เดียวที่ renderer ทั้ง 4 แบบ (MCQ/hotspot/colorwheel/linepick) ใช้ร่วมกัน
     ทำ press feedback ที่นี่ที่เดียวจึงครอบคลุมทุกแบบคำถามโดยไม่ต้องแก้ renderer เลยสักจุด */
  #choices button:active { transform:scale(.97); transition:transform var(--dur-press) var(--ease-out); }

  .result { text-align:center; border-radius:12px; padding:14px; font-size:15px; margin-top:6px; }
  .result.win { background:var(--bg-win); border:1px solid var(--ok); color:var(--ok); }
  .result.lose { background:var(--bg-lose); border:1px solid var(--bad); color:var(--bad); }
  .result.info { background:var(--bg-active); border:1px solid var(--gold); color:var(--ink-warn); }

  .btn {
    display:block; width:100%; border:none; border-radius:12px; padding:13px;
    font-family:'Kanit',sans-serif; font-size:16px; cursor:pointer; margin-top:10px;
    background:var(--gold); color:var(--ink-on-bright);
  }
  .btn.ghost { background:transparent; border:1px solid var(--gold); color:var(--gold); }

  .code-box {
    position:relative;   /* ให้ ::after (เรืองขอบตอนเฉลย) วางอิงกรอบนี้ได้ */
    background:var(--surface-deep); border:1px solid var(--line); border-radius:10px;
    font-family:monospace; font-size:13px; color:var(--ink-code); padding:12px; white-space:pre; overflow-x:auto; margin-bottom:12px;
  }
  /* ---------- Bug Jam เฉลย (Stage 4) — pulse ทั้งกล่อง ห้ามแตะ text node ข้างใน ----------
     animate เฉพาะ transform (scale) + opacity (เรืองขอบผ่าน ::after) เท่านั้น ตามกฎ
     ห้าม box-shadow/border-color เปลี่ยนสีตรง ๆ เพราะไม่ใช่ transform/opacity */
  .code-box.fx-reveal { animation:codeBoxPulse var(--dur-cheer) var(--ease-out); }
  .code-box.fx-reveal::after {
    content:""; position:absolute; inset:-2px; border-radius:inherit;
    border:2px solid var(--gold); opacity:0; pointer-events:none;
    animation:codeBoxGlow var(--dur-cheer) var(--ease-out);
  }
  @keyframes codeBoxPulse { 0%{transform:scale(1)} 40%{transform:scale(1.01)} 100%{transform:scale(1)} }
  @keyframes codeBoxGlow  { 0%{opacity:0} 40%{opacity:1} 100%{opacity:0} }
  .menu-item {
    display:flex; justify-content:space-between; align-items:center;
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
    border-left:4px solid var(--zc, var(--line));
    padding:11px 14px; margin-bottom:8px; cursor:pointer; font-size:14px;
  }
  .menu-item:hover { border-color:var(--gold); border-left-color:var(--zc, var(--gold)); }
  .menu-item small { color:var(--muted); font-size:11px; }
  .menu-zone { margin-top:16px; }
  .menu-zone-head {
    display:flex; align-items:center; gap:10px; margin-bottom:8px;
    font-family:'Kanit',sans-serif; font-size:13.5px; letter-spacing:.5px; color:var(--zc);
  }
  .menu-zone-head::after { content:""; flex:1; height:1px; background:var(--line); }
  .footer-note { text-align:center; font-size:11px; color:var(--muted); margin-top:16px; }

  .data-warn {
    background:var(--bg-warn); border:1px solid var(--gold); border-radius:10px;
    font-size:12.5px; color:var(--ink-warn); padding:9px 12px; margin-bottom:14px; text-align:center;
  }
  .upgrade-links { display:flex; gap:8px; }
  .upgrade-links .btn { font-size:14px; padding:10px 6px; }

  /* ---------- ปุ่มเลือกโหมดเดิมพัน (หน้าซื้อทรัพย์สิน) ---------- */
  .bet-row { display:flex; gap:8px; margin-bottom:12px; }
  .bet-btn {
    flex:1; background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
    color:var(--muted); padding:9px 6px; text-align:center;
    font-family:'Kanit',sans-serif; font-size:14px; cursor:pointer;
  }
  .bet-btn small { display:block; font-family:'Sarabun',sans-serif; font-size:10.5px; margin-top:2px; color:var(--muted); }
  .bet-btn.active { border-color:var(--gold); color:var(--gold); background:var(--bg-active); }
  .bet-btn.active small { color:var(--ink-warn); }
  .bet-btn:disabled { opacity:.55; cursor:default; }

  /* ---------- modal ยืนยันโหมดมั่นใจ + countdown ---------- */
  .confirm-overlay {
    position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center;
    background:rgba(5,16,12,.82); padding:20px; animation:fxFade2 .2s ease-out;
  }
  @keyframes fxFade2 { from { opacity:0; } to { opacity:1; } }
  .confirm-modal {
    width:100%; max-width:340px; background:var(--panel); border:2px solid var(--gold);
    border-radius:16px; padding:20px 18px; text-align:center;
    box-shadow:0 12px 40px rgba(0,0,0,.5);
  }
  .confirm-modal .cd-num {
    display:inline-block; min-width:26px; font-family:'Kanit',sans-serif; font-weight:800;
  }
  .confirm-modal .btn { margin-top:12px; }

  /* ---------- กรอบวงล้อสุ่มผลแก้บั๊ก (เลนมั่นใจ+ผิด) ----------
     duration อ้าง token แทนตัวเลขดิบ (Stage 4) — ให้ reduced-motion ย่ออัตโนมัติแบบเดียวกับที่อื่น */
  .roulette-frame {
    background:var(--surface-deep); border:1px solid var(--line); border-radius:10px;
    padding:13px 12px; margin-top:10px; text-align:center;
    font-family:'Kanit',sans-serif; font-size:15px; color:var(--ink-code);
    animation:roulettePulse var(--dur-press) ease-out;
  }
  .roulette-frame.final {
    border-color:var(--gold); color:var(--ink-warn);
    animation:rouletteLand var(--dur-cheer) cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes roulettePulse { from { transform:scale(.97); opacity:.65; } to { transform:scale(1); opacity:1; } }
  @keyframes rouletteLand  { 0% { transform:scale(.9); } 60% { transform:scale(1.05); } 100% { transform:scale(1); } }

  /* ---------- วงล้อ Fail Roulette แบบหมุนจริง (Stage 4) ----------
     #rouletteWheelG คือกลุ่มที่หมุน (rAF ควบคุม transform ตรง ๆ) — ใช้ transform-box:fill-box
     ให้หมุนรอบจุดกึ่งกลางภาพจริง ไม่ใช่มุม (0,0) ของ viewBox ตามค่าเริ่มต้นของ SVG */
  .roulette-wheel-wrap { position:relative; width:168px; height:168px; margin:6px auto 4px; }
  .roulette-wheel-svg { width:100%; height:100%; display:block; }
  #rouletteWheelG { transform-box:fill-box; transform-origin:50% 50%; }
  .roulette-pointer {
    position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    width:0; height:0; border-left:9px solid transparent; border-right:9px solid transparent;
    border-top:14px solid var(--gold); z-index:2; filter:none;
  }

  /* ---------- การ์ดพลิก (Stage 4 — เฉพาะ event mechanic simple/choice/chain ห้ามใช้กับ speed) ----------
     perspective อยู่ที่ #screen (บรรพบุรุษ) ไม่ใช่ตัวการ์ดเอง — 3D rotateY ถึงจะดูมีมิติจริง */
  .card-cover {
    position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:5;
    background:
      repeating-linear-gradient(45deg, #0B2B22 0 6px, var(--bg-win) 6px 12px);
    border:1px solid var(--gold); backface-visibility:hidden;
  }

  /* ---------- มินิเกมกู้บั๊กด่วน (Debug Rescue) ---------- */
  .rescue-code {
    font-family:'Kanit',sans-serif; font-size:34px; letter-spacing:8px; color:var(--gold);
    text-align:center; background:var(--surface-deep); border:1px solid var(--gold); border-radius:10px;
    padding:12px; margin:10px 0;
  }
  .rescue-input {
    width:100%; text-align:center; text-transform:uppercase; letter-spacing:8px;
    font-family:'Kanit',sans-serif; font-size:26px; background:var(--surface-deep); color:var(--text);
    border:1px solid var(--line); border-radius:10px; padding:11px; margin-bottom:10px;
  }
  .role-pick { display:flex; gap:8px; }
  .role-pick .btn { margin-top:0; }
  .wire-row {
    display:flex; align-items:center; gap:10px; margin-bottom:3px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:2px 12px;
  }
  .wire-bar { flex:1; height:16px; border-radius:8px; }
  .wire-idx { font-family:monospace; font-size:12px; color:var(--muted); width:20px; }
  .wire-row.cut { opacity:.4; }
  .wire-row.cut .wire-bar { background:#333 !important; position:relative; }
  .wire-cut-btn {
    background:transparent; border:1px solid var(--bad); color:var(--bad); border-radius:8px;
    font-family:'Kanit',sans-serif; font-size:13px; padding:12px 12px; cursor:pointer;
  }
  .wire-cut-btn:disabled { opacity:.4; cursor:default; }
  .rescue-guide {
    background:var(--bg-active); border:1px solid var(--gold); border-radius:12px;
    padding:16px; font-size:16px; line-height:1.7; color:var(--ink-warn);
  }

  /* ---------- ปุ่มเลือกผู้ชนะ (event แบบ speed) ---------- */
  .speed-players { display:flex; gap:8px; margin:4px 0 6px; }
  .speed-player {
    flex:1; background:var(--panel-2); border:1px solid var(--gold); border-radius:10px;
    color:var(--gold); padding:12px 4px; text-align:center; cursor:pointer;
    font-family:'Kanit',sans-serif; font-size:14px;
  }
  .speed-player:hover { background:var(--bg-active); }
  .speed-player:disabled { opacity:.5; cursor:default; }

  /* ---------- คำถามแบบ "ชี้ตำแหน่ง" (hotspot / colorwheel / linepick) ---------- */
  .point-wrap {
    background:var(--surface-deep); border:1px solid var(--line); border-radius:12px;
    padding:8px; margin-bottom:10px; touch-action:manipulation;
  }
  /* ห้าม preserveAspectRatio="none" — การคำนวณพิกัดอิงอัตราส่วนที่คงที่ */
  .point-wrap svg { width:100%; height:auto; display:block; cursor:crosshair; }
  .point-hint { text-align:center; font-size:12px; color:var(--muted); margin-bottom:8px; }

  /* linepick — โจทย์วัดเรื่องย่อหน้า ช่องว่างห้ามหาย */
  .lp-box { border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:10px; }
  .lp-row {
    display:flex; align-items:stretch; width:100%; text-align:left; cursor:pointer;
    background:var(--surface-deep); border:none; border-bottom:1px solid #10281F; padding:0; color:var(--ink-code);
  }
  .lp-row:last-child { border-bottom:none; }
  .lp-row:hover { background:var(--panel-2); }
  .lp-num {
    flex:0 0 32px; padding:9px 0; text-align:center; font-family:monospace; font-size:12px;
    color:var(--muted); background:var(--panel-2); border-right:1px solid #10281F; user-select:none;
  }
  .lp-code {
    flex:1; min-width:0; padding:9px 10px; font-family:monospace; font-size:13px;
    white-space:pre; overflow-x:auto;   /* เลื่อนเฉพาะบรรทัดที่ยาว ไม่ลากทั้งหน้า */
  }
  .lp-row.picked { background:var(--bg-lose); color:var(--bad); }
  .lp-row.picked .lp-num { background:#4A1A1A; color:var(--bad); }
  .lp-row.answer { background:var(--bg-win); color:var(--ok); }
  .lp-row.answer .lp-num { background:#14472F; color:var(--ok); }
  .lp-row:disabled { cursor:default; }

  /* ---------- บอสไฟต์ Server Meltdown (?space=cooling) ---------- */
  .hp-wrap { background:var(--surface-deep); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px; }
  .hp-row { display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; color:var(--muted); margin-bottom:7px; }
  .hp-row b { color:var(--gold); font-family:'Kanit',sans-serif; font-size:17px; }
  .hp-bar { height:12px; background:var(--panel-2); border-radius:8px; overflow:hidden; }

     .hp-row แยกกันคนละ element อยู่แล้วตั้งแต่แรก (นอก .hp-fill เสมอ) ไม่ถูก scale ไปด้วยแน่นอน */
  .hp-fill {
    height:100%; width:100%; transform:scaleX(0); transform-origin:left;
    background:linear-gradient(90deg,#4ADE80,var(--gold));
    transition:transform var(--dur-state) var(--ease-out);
  }
  .shout {
    text-align:center; font-size:12.5px; color:var(--ink-warn); background:var(--bg-warn);
    border:1px solid var(--gold); border-radius:20px; padding:6px 10px; margin-bottom:11px;
  }

  .hit-fx {
    position:fixed; inset:0; z-index:65; display:flex; align-items:center; justify-content:center;
    pointer-events:none; font-family:'Kanit',sans-serif; font-size:46px; color:var(--gold);
    text-shadow:0 4px 20px rgba(0,0,0,.7); animation:hitPop .5s ease-out forwards;
  }

    0% { transform:scale(.5); opacity:0; } 22% { transform:scale(1.14); opacity:1; }
    100% { transform:scale(1.4); opacity:0; }
  }
  .lockout {
    text-align:center; background:var(--bg-lose); border:1px solid var(--bad); border-radius:12px;
    padding:22px 14px; color:var(--bad); font-family:'Kanit',sans-serif; font-size:19px;
  }
  .pick-row { display:flex; flex-wrap:wrap; gap:10px; margin:4px 0 12px; }
  .pick {
    flex:1 0 17%; background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
    color:var(--text); font-family:'Kanit',sans-serif; font-size:14.5px; padding:10px 0;
    text-align:center; cursor:pointer;
  }
  .pick.on { border-color:var(--gold); background:var(--bg-active); color:var(--gold); }
  .big-num { font-family:'Kanit',sans-serif; font-size:56px; color:var(--gold); text-align:center; line-height:1.15; }

     วางชิดขวาเหนือ mute (bottom 66 = 14 + สูงปุ่ม 44 + ช่องไฟ 8) เลี่ยงป้ายออฟไลน์ที่อยู่ซ้าย */
  .player-btn {
    position:fixed; right:14px; bottom:66px; z-index:70;
    background:var(--chrome); border:1px solid var(--line); border-radius:20px;
    color:var(--muted); font-family:'Kanit',sans-serif; font-size:11.5px;

  .pl-modal { position:fixed; inset:0; z-index:80; background:rgba(3,12,9,.86);
    display:flex; align-items:center; justify-content:center; padding:18px; }
  .pl-card { background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:16px; width:100%; max-width:380px; }

  /* ---------- ปุ่มลอยมุมขวาล่าง: mute + ลดการเคลื่อนไหว ----------
     ปุ่มลดการเคลื่อนไหวอยู่ "ซ้ายของ mute" (right 66 = 14 + กว้างปุ่ม 44 + ช่องไฟ 8)
     ไม่วางซ้อนขึ้นข้างบน เพราะ .player-btn จองที่ bottom:66px ไว้แล้ว */
  .mute-btn, .motion-btn {
    position:fixed; right:14px; bottom:14px; z-index:70;
    width:44px; height:44px; border-radius:50%; cursor:pointer;
    background:var(--chrome); border:1.5px solid var(--gold); color:var(--gold);
    font-size:19px; line-height:1; opacity:.92;
  }
  .motion-btn { right:66px; }
  .mute-btn.off, .motion-btn.off { border-color:var(--line); color:var(--muted); }

  /* ---------- ป้ายบอกสถานะออฟไลน์ (มุมซ้ายล่าง — ไม่ชนปุ่ม mute) ---------- */
  .net-badge {
    position:fixed; left:14px; bottom:14px; z-index:70; display:none;
    background:var(--bg-warn); border:1px solid var(--gold); border-radius:20px;
    color:var(--ink-warn); font-size:12px; padding:6px 12px; pointer-events:none;
  }
  .net-badge.show { display:block; }

  /* ---------- เอฟเฟกต์กะพริบเต็มจอ (โปร่งใส ไม่รับคลิก ไม่แตะ layout) ---------- */
  .fx-flash { position:fixed; inset:0; pointer-events:none; z-index:50; opacity:0; }
  .fx-flash.green { background:#4ADE80; animation:fxFade .35s ease-out; }
  .fx-flash.red   { background:#F87171; animation:fxFade .35s ease-out; }
  .fx-flash.gold  { background:#FBBF24; animation:fxFadeStrong .55s ease-out; }
  @keyframes fxFade       { 0% { opacity:.22; } 100% { opacity:0; } }
  @keyframes fxFadeStrong { 0% { opacity:.38; } 100% { opacity:0; } }

  /* กล่องผลลัพธ์เด้งรับ highlight moment (โหมดมั่นใจ) */
  .result.pop { animation:resultPop .45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes resultPop { 0% { transform:scale(.9); } 60% { transform:scale(1.06); } 100% { transform:scale(1); } }

  /* ---------- confetti (transform ล้วน — GPU, ไม่กระตุก) ---------- */
  .confetti {
    position:fixed; top:-16px; width:8px; height:14px; z-index:60;
    pointer-events:none; border-radius:2px;
    animation:confettiFall linear forwards;
  }
  @keyframes confettiFall { to { transform:translateY(112vh) rotate(720deg); } }
</style>

/* =====================================================================
   ⚙️ ส่วนที่ 2.5: ระบบการเคลื่อนไหว (Motion) — สวิตช์กลางของ animation ทั้งเกม
   ---------------------------------------------------------------------
   วางไว้ตรงนี้เพราะ const ไม่ถูก hoist — ทุกส่วนที่เรียกใช้อยู่ใต้บรรทัดนี้ทั้งหมด

   กติกาที่ทุกคนที่แก้ต่อต้องรู้:
   - animate ได้เฉพาะ transform / opacity (ยกเว้น stroke-dashoffset ที่วงแหวนนาฬิกา
     และเครื่องหมายถูก) ห้ามแตะ width/height/top/left/margin/box-shadow/filter
   - ห้าม await ผลของ animation ในเส้นทางตอบคำถาม — MOTION.run() จึงคืน Animation
     object เปล่า ๆ ไว้ผูก onfinish เท่านั้น ไม่คืน promise โดยตั้งใจ
   - animation ใดยาวเกิน 400ms ต้องห่อด้วย skippable() ให้แตะข้ามได้
   ===================================================================== */

// การตั้งค่าระดับระบบปฏิบัติการ (เครื่องเก่าไม่มี matchMedia = ถือว่าไม่ลด)
function prefersReduce() {
  try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; }
}
// ค่าที่ผู้ใช้กดเองในเว็บ — localStorage ทุกจุดต้องกลืน error (โหมดส่วนตัว/พื้นที่เต็ม ห้ามทำเกมพัง)
function motionPref() { try { return localStorage.getItem("cc_motion"); } catch (e) { return null; } }
function setMotionPref(v) { try { localStorage.setItem("cc_motion", v); } catch (e) {} }

/* 3 สถานะ ไม่ใช่ 2: 'on' = ผู้ใช้สั่งเปิด / 'off' = ผู้ใช้สั่งปิด / null = ยังไม่เคยกด ให้เดินตามเครื่อง
   ปุ่มในเว็บจึงชนะการตั้งค่าเครื่องได้ทั้งสองทาง — เด็กที่เปิด reduce-motion ไว้ (หรือครูเปิดให้)
   ต้องกดกลับมาดูอนิเมชันเองได้ ไม่ใช่ค้างที่โหมดลดตลอดคาบโดยแก้ในเว็บไม่ได้
   ห้ามเขียนค่า null ลง localStorage — ต้องเป็น 'on'/'off' ชัดเจนเสมอ */
function motionReduced() {
  const p = motionPref();   // 'on' | 'off' | null
  return p ? p === "off" : prefersReduce();
}

/* เบราว์เซอร์ที่ไม่มี WAAPI — run() ต้องคืนตัวนี้ ห้ามคืน null เด็ดขาด
   เพราะ Stage 3-4 ผูก a.onfinish ต่อกันเป็นลูกโซ่ ถ้าได้ null จะ TypeError → จอขาวกลางคาบสอน
   พฤติกรรม: ถือว่า "จบไปแล้ว" — assign onfinish เมื่อไรก็เรียก callback ทันที ลำดับงานจึงเดินต่อครบ */
function animShim() {
  let cb = null;
  const fire = f => { if (typeof f === "function") { try { f(); } catch (e) {} } };
  return {
    playState: "finished", currentTime: 0, oncancel: null,
    get onfinish() { return cb; },
    set onfinish(f) { cb = f; fire(f); },
    // รองรับทั้งสองหน้าตา API — ฝั่งที่ผูกด้วย addEventListener จะได้ไม่ต้องเขียนโค้ดแยกเคส
    addEventListener(type, f) { if (type === "finish") fire(f); },
    removeEventListener() {},
    finish() {}, cancel() {},
  };
}

const MOTION = {
  reduced: motionReduced(),
  // ย่อเวลาเมื่ออยู่โหมดลดการเคลื่อนไหว — ไม่ตัดเป็น 0 เพราะยังต้องเห็นว่า "สถานะเปลี่ยนแล้ว"
  d(ms) { return this.reduced ? Math.min(ms, 120) : ms; },
  // สะพานไป CSS: <html data-motion="on|off"> คือตัวที่ทับ token ในมีเดียควีรี
  apply() {
    try { document.documentElement.dataset.motion = this.reduced ? "off" : "on"; } catch (e) {}
  },
  /* helper กลาง: animate แล้วเก็บกวาด will-change ให้เอง
     will-change ที่ค้างไว้ = เลเยอร์ GPU ค้างทั้งหน้า กินแรมมือถือราคาประหยัดฟรี ๆ
     จึงล้างทั้งตอน finish และตอน cancel (หมดเวลา/ออกจากหน้ากลางคัน) */
  run(el, frames, opt) {
    if (!el || !el.animate) return animShim();   // ไม่รองรับ WAAPI = ข้ามอนิเมชัน แต่ลำดับงานต้องเดินต่อ
    el.style.willChange = "transform, opacity";
    const a = el.animate(frames, { ...opt, duration: this.d(opt.duration) });
    /* ใช้ addEventListener ไม่ใช่ a.onfinish= โดยตั้งใจ:
       ช่อง onfinish/oncancel เป็นของ "ผู้เรียก" (Stage 3-4 ผูกลำดับงานต่อกันตรงนั้น)
       ถ้าตัวล้าง will-change ไปนั่งช่องเดียวกัน มันจะถูกเขียนทับหายเงียบ ๆ แล้วเลเยอร์ GPU
       จะค้างทั้งหน้าโดยไม่มี error อะไรฟ้องเลย */
    const clean = () => { el.style.willChange = ""; };
    a.addEventListener("finish", clean, { once: true });
    a.addEventListener("cancel", clean, { once: true });
    return a;
  },
};
MOTION.apply();   // ต้องเซ็ตตั้งแต่บูต ก่อนหน้าแรกวาด ไม่งั้นเฟรมแรกใช้ค่าจากมีเดียควีรีผิดตัว

/* ยังไม่เคยกดปุ่มในเว็บ (pref = null) แล้วผู้ใช้ไปสลับค่าในเครื่องกลางคัน — ต้องตามให้ทัน
   จำเป็นเพราะ data-motion ทับมีเดียควีรีถาวรแล้ว ถ้าไม่ตามค่าจะค้างของเก่าทั้งหน้า */
try {
  matchMedia("(prefers-reduced-motion: reduce)").addEventListener("change", () => {
    if (motionPref()) return;   // ผู้ใช้เลือกเองไว้แล้ว = ไม่ต้องยุ่ง
    MOTION.reduced = prefersReduce();
    MOTION.apply();
    if (typeof paintMotionBtn === "function") paintMotionBtn();
  });
} catch (e) {}

/* แตะที่ไหนบนจอก็ได้ = กระโดดไปสถานะจบทันที (ใช้กับ animation ที่ยาวเกิน 400ms)
   ผูก pointerdown ครั้งเดียวแล้วถอดทิ้งเสมอ ไม่ว่าจะจบเพราะถูกแตะหรือจบเอง —
   ถ้าลืมถอด การแตะครั้งถัดไปจะไปสั่ง finish() ให้ animation ที่ตายไปแล้ว
   หมายเหตุ: ต่อ onfinish/oncancel ของเดิมไว้เสมอ เพราะ MOTION.run ใช้ช่องนั้นล้าง will-change */
function skippable(anim) {
  if (!anim) return anim;
  // จบไปแล้ว = ไม่มีอะไรให้ข้าม (เคสจริงคือ shim ของเบราว์เซอร์ที่ไม่มี WAAPI)
  // ถ้าไม่กันไว้ การต่อ onfinish ทับจะไปกระตุ้น callback เดิมซ้ำอีกรอบ = งานปลายทางทำสองครั้ง
  if (anim.playState === "finished") return anim;
  const prevFinish = anim.onfinish, prevCancel = anim.oncancel;
  const off = () => document.removeEventListener("pointerdown", onDown);
  function onDown() { try { anim.finish(); } catch (e) {} }
  document.addEventListener("pointerdown", onDown, { once: true, passive: true });
  anim.onfinish = e => { off(); if (prevFinish) prevFinish.call(anim, e); };
  anim.oncancel = e => { off(); if (prevCancel) prevCancel.call(anim, e); };
  return anim;
}

// อ่านค่า easing จาก token จริงใน :root — WAAPI ไม่รู้จัก var() ต้องส่งเป็นสตริง cubic-bezier ดิบ
function easeVar(name) {
  try { return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "ease"; }
  catch (e) { return "ease"; }
}

// เหมือน easeVar() แต่สำหรับสี — ใช้ตอนวาด SVG ด้วย attribute ตรง ๆ (setAttribute ไม่รู้จัก var() แน่นอนทุกเบราว์เซอร์
// ต่างจาก inline style ที่ resolve var() ได้เอง) จึงต้องอ่านค่าจริงจาก :root มาเป็นสตริง hex ก่อนใส่ attribute
function colorVar(name) {
  try { return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#000"; }
  catch (e) { return "#000"; }
}

/* ---------- Stage V2b FIX-1b: ซ่อน header เฉพาะหน้าจับเวลาที่ยังล้น ≤700 ไม่ได้ ----------
   ใช้จริง 2 หน้า: event speed (FIX-1b) + debug_rescue solver (FIX-3b) — ไม่ใช่การซ่อน global ทุกหน้า
   bugjam ก็เป็นหน้าจับเวลาที่ headroom ไม่ถึงเกณฑ์เหมือนกัน แต่ V2b ตัดสินไม่แก้ (นอกสโคป ดู DESIGN_AUDIT.md)
   เรียก true ที่ต้นฟังก์ชันของ 2 หน้านั้น แล้วคืนค่า false ที่ renderMenu()/dispatch()
   ซึ่งเป็นจุดที่ทุกเส้นทางออกจากหน้าเหล่านี้ไหลผ่านเสมอ (ปุ่ม "กลับเมนู" ทุกปุ่มเรียก renderMenu()) */
function setHeaderHidden(hidden) {
  try {
    const h = document.querySelector("header");
    if (h) h.style.display = hidden ? "none" : "";
  } catch (e) {}
}

// id เฉพาะของ animation ขาเข้า — ต้องคานี้เดียวกันทั้งฝั่งสร้าง (enterScreen) และฝั่งยกเลิก
// (cancelScreenEnter) เพื่อกรองเฉพาะตัวเอง ไม่แตะ animation อื่นที่ยิงบน #screen เหมือนกัน
// เช่นจอสั่นบอสไฟต์ / roulette ใน Stage 4 — ห้ามใช้ getAnimations() ทั้งชุดแบบไม่กรอง
const SCREEN_ENTER_ID = "screen-enter";

/* ---------- renderToken (Stage 3) ----------
   เลข "รุ่นของหน้าปัจจุบัน" — +1 ทุกครั้งที่ enterScreen() ทำงาน (คือทุกครั้งที่เข้าหน้าใหม่แบบ
   ไม่มีนาฬิกา ดู #screen bug ของ Stage 2: animation ที่เขียนทับ node ซึ่งถูกใช้ id ซ้ำข้ามหน้า
   ทำให้จอทั้งบอสไฟต์ว่างเปล่ามาแล้ว) rAF loop / WAAPI onfinish chain ใด ๆ ที่แตะ DOM ผ่าน
   document.getElementById(...) (ซึ่ง id อย่าง #result #choices #timerBox ถูกใช้ซ้ำทุกหน้า)
   ต้องจับค่า token ไว้ตอนเริ่ม แล้วเทียบกับ renderToken ปัจจุบันก่อนแตะ DOM ทุกเฟรม/ทุก callback
   ไม่ตรง = หน้าเปลี่ยนไปแล้ว ต้อง return ทันที ห้ามเขียนทับ node ของหน้าใหม่ */
let renderToken = 0;

/* #screen เป็น element ถาวรที่ไม่เคยถูกทำลาย (เปลี่ยนแค่ innerHTML ข้างในไปเรื่อย ๆ) — animation
   ที่ยิงไว้บน #screen เองจึงมีสิทธิ์ "ค้างข้ามหน้า" ได้ ถ้าเรนเดอร์หน้าถัดไปเร็วกว่า 180ms
   (เช่นกดปุ่มโหมดแล้วเข้าคำถามทันที) ต้องเรียกตัวนี้ก่อนวาดหน้าที่มีนาฬิกาเริ่มทันทีเสมอ
   ไม่งั้นคำถามจะ "โผล่พร้อม fade ค้าง" จากหน้าก่อน ซึ่งผิดกฎ 0ms */
function cancelScreenEnter() {
  if (!screen.getAnimations) return;
  screen.getAnimations().forEach(a => { if (a.id === SCREEN_ENTER_ID) { try { a.cancel(); } catch (e) {} } });
}

/* ---------- เข้าหน้าใหม่ (Stage 2) ----------
   translateY(12px)+opacity 180ms ขาเข้าอย่างเดียว — เรียกเฉพาะหน้าที่ "ไม่มีนาฬิกาเริ่มเดินทันที"
   ห้ามเรียกจากหน้าคำถาม/หน้าที่ผสมนาฬิกามาด้วย (renderUpgrade, startQuiz, renderSpeedEvent,
   renderBugQuestion, renderRescueSolver/Guide, renderCoolingPlay) — คำถาม+ตัวเลือกต้องโผล่ทันที
   0ms เพราะนาฬิกาเริ่มเดินไปแล้วตั้งแต่ก่อนเฟรมแรกวาด ห้ามเสียเวลาไปกับ entrance animation
   ไม่ใส่ fill:'forwards'/'both' โดยตั้งใจ — ต้องคืนค่า opacity/transform ปกติทันทีที่ถูก cancel
   ไม่งั้น #screen จะค้างจอเปล่า (opacity:0) ถ้าโดนยกเลิกกลางคัน */
function enterScreen() {
  if (!screen.firstElementChild) return;
  renderToken++;   // ประกาศว่านี่คือหน้าใหม่ — ทำให้ rAF/onfinish ที่ค้างจากหน้าก่อนรู้ตัวว่าต้องหยุด
  cancelScreenEnter();   // กันซ้อนกับ animation ค้างจากการเรียก enterScreen() ถี่ ๆ ก่อนหน้านี้
  MOTION.run(screen, [
    { transform: "translateY(12px)", opacity: 0 },
    { transform: "translateY(0)", opacity: 1 },
  ], { id: SCREEN_ENTER_ID, duration: 180, easing: easeVar("--ease-out") });
}

/* ---------- พลิกการ์ดเหตุการณ์ (Stage 4) ----------
   ใช้แทน enterScreen() เฉพาะการ์ดเหตุการณ์ mechanic simple/choice/chain เท่านั้น
   ห้ามใช้กับ speed (จับเวลา 15 วิ ต้องโผล่ 0ms) — renderEvent() คัดกรองก่อนเรียกแล้ว
   เนื้อการ์ดจริงเรนเดอร์ไว้ก่อนแล้วทั้งหมด (ปุ่ม/handler ผูกครบ) ฟังก์ชันนี้แค่ซ่อนไว้ชั่วคราว
   ด้วย rotateY แล้วพลิกเผยออกมา — ไม่แตะเนื้อหาข้างในเลยสักบรรทัด
   ลำดับ: cover (มองเห็น) rotateY 0→-90° 220ms → ลบทิ้งตอน onfinish →
          การ์ดจริง (ซ่อนอยู่ที่ 90°) rotateY 90°→0° 260ms เริ่มหลัง delay 220ms (พอดีกับคิวคิวคอฟเวอร์) */
function playEventCardFlip(cardEl) {
  if (!cardEl) return;
  renderToken++;   // นับเป็นหน้าใหม่เหมือน enterScreen() — invalidate rAF/onfinish ค้างจากหน้าก่อน
  const myToken = renderToken;
  if (getComputedStyle(cardEl).position === "static") cardEl.style.position = "relative";
  cardEl.style.transform = "rotateY(90deg)";   // ซ่อนตัวเองตั้งแต่เฟรมแรก ก่อน animation จะเริ่มทำงานจริง

  const cover = document.createElement("div");
  cover.className = "card-cover";   // pointer-events:none มาจาก CSS อยู่แล้ว — กดทะลุได้เสมอ
  cardEl.appendChild(cover);

  const coverAnim = MOTION.run(cover,
    [{ transform: "rotateY(0deg)" }, { transform: "rotateY(-90deg)" }],
    { duration: 220, easing: easeVar("--ease-io") });
  coverAnim.addEventListener("finish", () => { if (myToken === renderToken) cover.remove(); });

  MOTION.run(cardEl,
    [{ transform: "rotateY(90deg)" }, { transform: "rotateY(0deg)" }],
    { duration: 260, delay: MOTION.d(220), fill: "forwards", easing: easeVar("--ease-out") });
}

/* =====================================================================
   ส่วนที่ 3: ตัวระบบ (ปกติไม่ต้องแก้ส่วนนี้)
   ===================================================================== */
let SPACES, QUESTIONS, EVENTS, BUGJAM;

const screen = document.getElementById("screen");
const params = new URLSearchParams(location.search);
const param = params.get("space");
const upgradeParam = params.get("upgrade");

// ---------- โหลดข้อมูลจาก data.json → ถ้าพลาดใช้ FALLBACK ----------
async function loadData() {
  let source = FALLBACK, usedFallback = true;
  try {
    const res = await fetch(CONFIG.data_url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const d = await res.json();
    if (d.spaces && d.questions && d.events && d.bugjam) { source = d; usedFallback = false; }
    else throw new Error("โครงสร้างข้อมูลไม่ครบ");
  } catch (e) {
    console.warn("โหลดฐานข้อมูลไม่สำเร็จ ใช้ข้อมูลสำรอง:", e.message);
  }

  SPACES = source.spaces;
  // ข้ามแถวร่าง (question_th ขึ้นต้นด้วย DRAFT) และข้อที่เรนเดอร์ไม่ได้จริง ๆ
  QUESTIONS = source.questions.filter(q =>
    !String(q.question_th).startsWith("DRAFT") && questionUsable(q));
  EVENTS = source.events;
  BUGJAM = source.bugjam.filter(b => !String(b.question_th).startsWith("DRAFT"));

  if (usedFallback)
    document.getElementById("dataStatus").innerHTML =
      `<div class="data-warn">⚠️ โหลดฐานข้อมูลไม่สำเร็จ — กำลังใช้ข้อมูลสำรองในเครื่อง</div>`;

  route();
}

/* ---------- (optional) ส่งสถิติการตอบไป Google Sheet ผ่าน Apps Script ----------
   ทุกแถวเข้าคิวใน localStorage ก่อนเสมอ แล้วค่อยพยายามยิง — เน็ตโรงเรียนหลุดกลางคาบ
   แล้วกลับมา แถวที่ค้างจะถูกส่งตามเองทีหลัง (ยิงซ้ำตอน online / กลับมาเปิดแท็บ / โหลดหน้าใหม่)

   ทำไมเลิกใช้ navigator.sendBeacon: beacon คืน false เฉย ๆ เมื่อคิวไม่สำเร็จ ไม่ throw
   โค้ดเดิมจึงไม่เคยรู้ว่าส่งออกจริงไหม (fallback fetch ไม่เคยทำงานสักครั้ง) — ระบบคิว
   ต้องรู้ผลลัพธ์จริงถึงจะตัดแถวออกจากคิวได้ถูกต้อง

   ⚠️ Content-Type ต้องเป็น text/plain เท่านั้น — ปลายทางเป็น Apps Script ซึ่งไม่รองรับ
   CORS preflight ถ้าใส่ application/json เบราว์เซอร์จะยิง OPTIONS ก่อน โดนตอบ 405
   แล้ว log หายทั้งหมดโดยเกมไม่ error เลย (ฝั่ง Apps Script อ่านเองจาก e.postData.contents
   แล้ว JSON.parse — body เป็น array ของแถว ส่งทีละไม่เกิน 50)

   ทุก storage ใช้ localStorage ไม่ใช่ sessionStorage: สแกน QR แต่ละครั้งเบราว์เซอร์มักเปิด
   แท็บใหม่ ถ้าใช้ sessionStorage ทุกแถวจะได้ session ไม่ซ้ำกัน จับกลุ่มรายคาบไม่ได้เลย     */
const Logger = (() => {
  const QK = "cc_log_queue", SK = "cc_session", PK = "cc_player";
  const MAX_QUEUE = 500;                    // เกินนี้ทิ้งแถวเก่าสุด (กัน localStorage เต็ม)
  const BATCH = 50;                         // ยิงทีละกี่แถว (keepalive จำกัด body ~64KB)
  const SESSION_GAP_MS = 3 * 60 * 60 * 1000;  // ห่างเกิน 3 ชม. = คนละคาบ ออก id ใหม่
  let flushing = false;                     // flag กันยิงซ้อน

  // ทุกอย่างที่แตะ localStorage ต้องกลืน error ให้หมด — โหมดส่วนตัว/พื้นที่เต็ม ห้ามทำเกมพัง
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };

  const readQueue = () => {
    try { const a = JSON.parse(lsGet(QK) || "[]"); return Array.isArray(a) ? a : []; }
    catch (e) { return []; }   // คิวพัง (JSON เสีย) = เริ่มนับใหม่ ดีกว่าค้างถาวร
  };
  const writeQueue = rows => lsSet(QK, JSON.stringify(rows.slice(-MAX_QUEUE)));

  const two = n => String(n).padStart(2, "0");
  const rand4 = () => Math.random().toString(36).slice(2, 6).padEnd(4, "0");
  const stamp = d => `${d.getFullYear()}${two(d.getMonth() + 1)}${two(d.getDate())}${two(d.getHours())}${two(d.getMinutes())}`;

  const enabled = () => !!(CONFIG.log_url && CONFIG.log_enabled);

  // id ประจำคาบ: YYYYMMDDHHmm-xxxx — ต่ออายุทุกครั้งที่ log, ขาดช่วงเกิน 3 ชม. ค่อยขึ้นตัวใหม่
  const session = () => {
    const now = Date.now();
    let rec = null;
    try { rec = JSON.parse(lsGet(SK) || "null"); } catch (e) { rec = null; }
    if (!rec || !rec.id || !rec.last || now - rec.last > SESSION_GAP_MS)
      rec = { id: stamp(new Date(now)) + "-" + rand4(), last: now };
    rec.last = now;
    lsSet(SK, JSON.stringify(rec));
    return rec.id;
  };

  // เลขผู้เล่น — UI ให้กรอกยังไม่มีในเวอร์ชันนี้ ไม่มีค่า = null (รับได้ทั้งเลขดิบและ JSON)
  const player = () => {
    const raw = lsGet(PK);
    if (raw === null || raw === "") return null;
    try { const v = JSON.parse(raw); return v === "" ? null : v; } catch (e) { return raw; }
  };

  // ยิงคิวออกทีละชุด — ok เท่านั้นถึงตัดแถวออก ไม่ ok/reject = คงไว้ทั้งคิว รอรอบหน้า
  const flush = async () => {
    if (flushing || !enabled()) return;
    if (navigator.onLine === false) return;   // ออฟไลน์ชัด ๆ ไม่ต้องเสียเวลายิง
    if (!readQueue().length) return;
    flushing = true;
    try {
      for (let guard = 0; guard < 20; guard++) {   // guard กันวนไม่รู้จบถ้าเขียนคิวกลับไม่ได้
        const cur = readQueue();
        if (!cur.length) break;
        const batch = cur.slice(0, BATCH);
        const res = await fetch(CONFIG.log_url, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(batch),
          keepalive: true,
        });
        if (!res || !res.ok) break;
        // อ่านคิวใหม่อีกรอบก่อนตัด — ระหว่างรอ fetch อาจมีแถวใหม่เข้ามา ห้ามตัดทิ้ง
        // เทียบด้วย row_id ไม่ใช่ตำแหน่ง เพราะการตัดแถวเก่าตอนคิวเต็มทำให้ index เลื่อนได้
        const sent = new Set(batch.map(r => r && r.row_id));
        const left = readQueue().filter(r => !(r && sent.has(r.row_id)));
        if (!writeQueue(left)) break;   // เขียนกลับไม่ได้ = หยุด ไม่งั้นจะยิงชุดเดิมซ้ำ
        if (!left.length) break;
      }
    } catch (e) {
      /* เน็ตหลุด/CORS/timeout — เงียบไว้ แถวยังอยู่ในคิวครบ */
    } finally {
      flushing = false;
    }
  };

  const push = row => {
    const q = readQueue();
    q.push(row);
    writeQueue(q);   // writeQueue ตัดหัวให้เองเมื่อเกิน MAX_QUEUE
  };

  // ยิงคิวค้างเมื่อ: เน็ตกลับมา / กลับมาเปิดแท็บนี้ / โหลดหน้าใหม่
  try {
    addEventListener("online", () => { flush(); });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") flush();
    });
  } catch (e) {}

  return { enabled, session, player, push, flush,
           newRowId: () => Date.now().toString(36) + rand4() };
})();

function logAnswer(kind, id, level, correct, extra) {
  if (!CONFIG.log_url || !CONFIG.log_enabled) return;
  try {
    Logger.push({
      kind, space_id: id, level, correct,
      ts: new Date().toISOString(),
      session: Logger.session(),
      player: Logger.player(),
      // consume-once เสมอ แม้จุดเรียกจะ override เป็น null (fail_roulette) — กันค่าค้างไปติดใบถัดไป
      elapsed_ms: (typeof Session === "undefined") ? null : Session.takeElapsed(),
      ...extra,
      row_id: Logger.newRowId(),   // กันแถวซ้ำตอนยิงซ้ำ + ใช้ตัดแถวออกจากคิวให้ตรงตัว
    });
  } catch (e) { return; }   // จดคิวไม่ได้ก็ช่างมัน เกมต้องเล่นต่อได้
  Logger.flush();           // async ล้วน ไม่มี await — ไม่หน่วงจังหวะเกม
}

Logger.flush();   // เปิดหน้ามาก็เก็บกวาดแถวที่ค้างจากคาบก่อน/ตอนเน็ตหลุดก่อน

/* =====================================================================
   ส่วนที่ 3.5: ความทนต่อเหตุไม่คาดฝัน (refresh / เน็ตล่ม / จอดับ / สแกนซ้ำ)
   ---------------------------------------------------------------------
   ทุกอย่างในบล็อกนี้ degrade ได้เอง — เบราว์เซอร์ไหนไม่รองรับก็เล่นได้ปกติ
   ===================================================================== */

// รหัสประจำหน้าปัจจุบัน — ใช้แยกว่า cc_active/cc_done เป็นของช่องไหน
// (หน้าอัปเกรดนับเป็นคนละหน้ากับหน้าซื้อ แม้ ?space= จะเดียวกัน)
const routeKey = () => (param || "menu") + (upgradeParam ? "|u" + upgradeParam : "");

// กุญแจอ้างอิงคำถาม/โจทย์แบบทนข้อมูลเปลี่ยน (ข้อมูลสำรองในไฟล์นี้ไม่มี question_id)
const qKey = q => q.question_id || `${q.space_id}#${q.level}#${String(q.question_th).slice(0, 60)}`;
const bugKey = b => b.bug_id || String(b.question_th).slice(0, 60);
const findQuestion = key => QUESTIONS.find(q => qKey(q) === key);

/* ชุด field วิเคราะห์ผลการเรียนรู้ที่แนบไปกับ log ทุกใบที่มี "ตัวคำถาม" อยู่ในมือ
   info = ค่าที่ผู้เล่นแตะ ส่งมาจากตัวเรนเดอร์คำถาม (null ได้ เช่นตอนหมดเวลา = ไม่ได้แตะอะไร)
   ชื่อ field ของ picked แยกตาม qtype ตั้งใจให้ไม่ปนกัน — index ของ MCQ กับพิกัดบนภาพ
   เอามาหาค่าเฉลี่ยร่วมกันไม่ได้ ถ้าใช้ชื่อเดียวกันจะเผลอรวมกันตอนทำ pivot            */
function answerMeta(q, timedOut, info) {
  const m = {
    question_id: q ? qKey(q) : null,
    qtype: (info && info.qtype) || String((q && q.qtype) || "").trim().toLowerCase() || "mcq",
    timed_out: !!timedOut,
  };
  if (info) for (const k in info) if (k !== "qtype") m[k] = info[k];
  return m;
}

/* ---------- สถานะข้ามการ refresh (sessionStorage — ปิดแท็บแล้วหายเอง) ----------
   cc_active = คำถามที่กำลังจับเวลาอยู่ (มี deadline สัมบูรณ์ → refresh แล้วเวลาเดินต่อ)
   cc_done   = ช่องที่เพิ่งเล่นจบ (กันเผลอสแกนซ้ำในเทิร์นเดียว)                     */
const Session = (() => {
  const AK = "cc_active", DK = "cc_done";
  const RESCAN_MS = 90000;   // สแกนช่องเดิมซ้ำภายในกี่มิลลิวินาที = ขึ้นหน้าเตือน
  const MAX_ELAPSED_MS = 10 * 60 * 1000;   // เกินนี้ = จับคู่ผิด record/นาฬิกาเครื่องเพี้ยน → ทิ้ง
  let lastStartedAt = 0;     // startedAt ของ record ที่ done() เพิ่งลบ — ให้ logAnswer หยิบไปคิด elapsed_ms
  const read = k => { try { return JSON.parse(sessionStorage.getItem(k) || "null"); } catch (e) { return null; } };
  const write = (k, v) => { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  return {
    // เริ่มจับเวลา: เก็บ deadline เป็น timestamp จริง ไม่ใช่จำนวนวินาทีที่เหลือ
    begin(rec, seconds) {
      const now = Date.now();
      const full = { ...rec, startedAt: now, deadlineTs: seconds > 0 ? now + seconds * 1000 : 0 };
      write(AK, full);
      return full;
    },
    active(key) {
      const a = read(AK);
      return a && a.key === key ? a : null;
    },
    patch(o) { const a = read(AK); if (a) write(AK, { ...a, ...o }); },
    clear() { try { sessionStorage.removeItem(AK); } catch (e) {} },
    // จบ flow ของหน้านี้: เลิกจับเวลา + จดเวลาไว้กันสแกนซ้ำ
    // จำ startedAt ไว้ก่อนลบ เพราะ 6 ใน 9 จุดเรียก logAnswer อยู่ "หลัง" บรรทัดนี้
    done(key) {
      const a = read(AK);
      lastStartedAt = (a && a.startedAt) || 0;
      /* ⛔ ข้อบังคับสำหรับคนที่จะแก้โค้ดนี้ต่อ — อ่านก่อนย้าย/แทรกโค้ดตรงจุดเรียก:
         จุดเรียกทุกจุดต้องเรียก logAnswer() **ต่อทันทีใน tick เดียวกันกับ done()**
         ห้ามมี await / setTimeout / รอ animation / รอ transition คั่นกลางเด็ดขาด
         ถ้าคั่น elapsed_ms ของแถวนั้นจะกลายเป็น null เงียบ ๆ ไม่มี error ไม่มี warning
         และจะรู้ตัวอีกทีตอนเปิดชีตดูข้อมูลหลังเก็บจริงไปแล้วทั้งคาบ

         ทำไมต้องล้างใน tick ถัดไป (ไม่ใช่ปล่อยให้ค้างจนกว่าจะมีคนอ่าน):
         done() ที่ไม่มี logAnswer ตามมามีจริงหลายทาง — ผู้เล่นกดออกกลางคัน / refresh /
         ปิดแท็บ ถ้าไม่ล้าง ค่าเก่าจะไปติดกับ log ใบถัดไปที่คนละข้อคนละเวลา ได้ตัวเลขที่ดู
         สมเหตุสมผลแต่ผิดคนผิดข้อ ซึ่งจับไม่ได้ตอนวิเคราะห์ — อันตรายกว่า null            */
      setTimeout(() => { lastStartedAt = 0; }, 0);
      this.clear(); this.markDone(key);
    },
    /* เวลาที่ใช้ตอบ (ms) สำหรับ logAnswer — **consume-once** อ่านแล้วเคลียร์ทิ้งทันที
       ทำไมต้อง consume-once: Session.done() ที่ไม่มี logAnswer ตามมามีจริง (กดออกกลางคัน /
       refresh / ปิดแท็บ) ถ้าไม่เคลียร์ ค่าเก่าจะไปติดกับ log ใบถัดไปที่คนละข้อคนละเวลา
       ได้ตัวเลขที่ดูสมเหตุสมผลแต่ผิดคนผิดข้อ — จับไม่ได้ตอนวิเคราะห์ อันตรายกว่า null
       อ่านจาก record ที่ยัง active ได้ด้วย เพราะจุดเรียกฝั่ง buy log ก่อน done()          */
    takeElapsed() {
      const a = read(AK);
      const started = (a && a.startedAt) || lastStartedAt;
      lastStartedAt = 0;                       // เคลียร์เสมอ ไม่ว่าจะได้ค่าหรือไม่
      if (!started) return null;
      const ms = Date.now() - started;
      return (ms < 0 || ms > MAX_ELAPSED_MS) ? null : ms;
    },
    markDone(key) { const d = read(DK) || {}; d[key] = Date.now(); write(DK, d); },
    // คืนจำนวนวินาทีที่ยังเหลือของช่วงกันสแกนซ้ำ (0 = เข้าได้เลย)
    doneRecently(key) {
      const t = (read(DK) || {})[key];
      if (!t) return 0;
      const left = RESCAN_MS - (Date.now() - t);
      return left > 0 ? Math.ceil(left / 1000) : 0;
    },
    allowAgain(key) { const d = read(DK) || {}; delete d[key]; write(DK, d); },
    reset() { try { sessionStorage.clear(); } catch (e) {} },
  };
})();

/* ---------- เลขผู้เล่นประจำเครื่อง (1-4) — ตัวที่ logAnswer เอาไปใส่ field player ----------
   ใช้ localStorage ไม่ใช่ sessionStorage: สแกน QR แต่ละครั้งเบราว์เซอร์มักเปิดแท็บใหม่
   ถ้าใช้ sessionStorage เลขจะหายทุกครั้งที่สแกน = ต้องถามใหม่ทุกช่อง

   ไม่มีหน้าแรกที่ทุกคนต้องผ่าน (สแกน QR เข้า ?space=xxx ตรง ๆ เสมอ) UI จึงต้องมี 2 ทาง:
     1) กล่องถามคร่อมหน้าแรกที่เปิด ไม่ว่าจะเปิดหน้าไหน — ถามครั้งเดียวจบ
     2) ปุ่มเล็กมุมจอที่อยู่ทุกหน้า — เด็กกดผิด/สลับที่นั่ง/ยืมเครื่องเพื่อน เกิดขึ้นจริงในห้อง
   ทั้งสองทางข้ามได้เสมอ ไม่มีเลขก็เล่นได้ครบทุกอย่าง (field player เป็น null)          */
const Player = (() => {
  const PK = "cc_player", AK2 = "cc_player_asked";
  const MAX = 4;        // จำนวนปุ่มในกล่องเลือก — ขนาดโต๊ะปกติ (ตรงกับ CONFIG.speed_players)
  // เก็บได้ถึง 6 เพราะบอสไฟต์เปิดโต๊ะได้ถึง CONFIG.cooling_boss.max_players (6)
  // ถ้าจำกัดที่ 4 แล้วเด็กเลือก slot 5 ในบอสไฟต์ cc_player จะค้างค่าเก่า → แถวเดียวกันจะมี
  // player:3 คู่กับ player_slot:5 ซึ่งขัดกันเองและจับไม่ได้ตอนวิเคราะห์
  const MAX_STORE = 6;
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

  const get = () => {
    const n = parseInt(lsGet(PK), 10);
    return (n >= 1 && n <= MAX_STORE) ? n : null;
  };
  const paintBtn = () => {
    const b = document.getElementById("playerBtn");
    if (!b) return;
    const n = get();
    b.textContent = n ? `👤 ผู้เล่น ${n}` : "ตั้งเลข";
    b.classList.toggle("set", !!n);
  };
  const set = n => { lsSet(PK, String(n)); lsSet(AK2, "1"); paintBtn(); };
  const skip = () => lsSet(AK2, "1");            // เคยถามแล้ว — อย่าถามซ้ำทุกหน้า จะรำคาญกลางเกม
  const shouldAsk = () => get() === null && lsGet(AK2) !== "1";

  // แถวปุ่มเลข ใช้ร่วมกันทั้งกล่องถามครั้งแรกและกล่องแก้ทีหลัง
  const chipsHtml = () => {
    let s = "";
    const cur = get();
    for (let i = 1; i <= MAX; i++)
      s += `<button class="pick${cur === i ? " on" : ""}" data-plnum="${i}">${i}</button>`;
    return s;
  };
  // หมายเหตุเลขซ้ำเป็น "ข้อความเตือน" เท่านั้น — เว็บไม่มี backend เช็คข้ามเครื่องไม่ได้จริง
  const NOTE = `<p class="content" style="font-size:12px;color:var(--muted);margin-top:2px;">
      ⚠️ เลขต้องไม่ซ้ำกับเพื่อนในโต๊ะ (ตกลงกันเองก่อนเริ่มเล่น)</p>`;

  const bind = (root, onPicked) => root.querySelectorAll("[data-plnum]").forEach(b =>
    b.onclick = () => { set(+b.dataset.plnum); SFX.tick(false); onPicked(+b.dataset.plnum); });

  return {
    get, set, skip, shouldAsk, paintBtn, chipsHtml, NOTE, bind, MAX, MAX_STORE,
  };
})();

/* ---------- Wake Lock — กันจอดับระหว่างจับเวลา (ไม่รองรับก็ไม่พัง) ---------- */
const Wake = (() => {
  let lock = null, want = false;
  const acquire = () => {
    if (!want || lock || !navigator.wakeLock) return;
    navigator.wakeLock.request("screen")
      .then(l => {
        // จบเวลาไปแล้วระหว่างรอ promise — ปล่อยทิ้งทันที ไม่งั้นจอค้างสว่างทั้งที่เลิกใช้แล้ว
        if (!want) { try { l.release(); } catch (e) {} return; }
        lock = l;
        l.addEventListener("release", () => { lock = null; });
      })
      .catch(() => {});   // ไม่รองรับ / ไม่ใช่ https / แท็บไม่ active — ปล่อยผ่าน
  };
  // สลับแอปแล้วกลับมา ระบบจะปล่อย lock ให้เอง ต้องขอใหม่
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") acquire();
  });
  return {
    on() { want = true; acquire(); },
    off() { want = false; if (lock) { try { lock.release(); } catch (e) {} lock = null; } },
  };
})();

/* =====================================================================
   ระบบเสียง (Web Audio ล้วน — ไม่มีไฟล์เสียง/CDN, รันบน GitHub Pages ได้)
   - AudioContext ถูกสร้าง/ปลดล็อกจาก user gesture แรกเท่านั้น (กัน autoplay block)
   - เสียงติ๊กจาก timer จะเงียบไปเองจนกว่าผู้เล่นแตะจอครั้งแรก
   ===================================================================== */
const SFX = (() => {
  let ctx = null, muted = false, warmed = false;
  const AC = window.AudioContext || window.webkitAudioContext;

  // ปลุก AudioContext จาก user gesture — สร้าง + resume + เล่น buffer เงียบให้ฮาร์ดแวร์ตื่น
  // ผูกหลาย event และคอยลองจนกว่าจะ running จริง (มือถือ resume เป็น async ครั้งเดียวมักไม่พอ)
  const UNLOCK_EVENTS = ["pointerdown", "touchstart", "touchend", "click", "keydown"];
  function unlock() {
    try {
      if (!ctx && AC) ctx = new AC();
      if (!ctx) return;
      if (ctx.state !== "running") ctx.resume().catch(() => {});
      if (!warmed) {  // silent buffer — เคล็ดปลุกเสียง iOS ให้พร้อมก่อนโน้ตจริง
        const b = ctx.createBuffer(1, 1, 22050);
        const s = ctx.createBufferSource();
        s.buffer = b; s.connect(ctx.destination); s.start(0);
        warmed = true;
      }
      if (ctx.state === "running")  // ปลุกสำเร็จแล้ว เลิกดักฟัง
        UNLOCK_EVENTS.forEach(ev => document.removeEventListener(ev, unlock));
    } catch (e) {}
  }
  UNLOCK_EVENTS.forEach(ev => document.addEventListener(ev, unlock, { passive: true }));

  // เล่นโน้ตเดียว: envelope ขึ้นเร็ว-จางลง กันเสียงคลิกป๊อก
  function tone(freq, dur, { type = "sine", vol = 0.15, when = 0 } = {}) {
    if (muted || !ctx) return;                       // ก่อนแตะจอครั้งแรก — เงียบ (กัน autoplay)
    if (ctx.state !== "running") { try { ctx.resume().catch(() => {}); } catch (e) {} }  // เร่งปลุก แล้ว schedule ต่อ
    try {                                            // โน้ตที่ schedule ตอน suspend จะดังเองเมื่อ resume
      const t0 = ctx.currentTime + when;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0 + dur + 0.05);
    } catch (e) {}
  }

  return {
    toggleMuted() { muted = !muted; return muted; },
    // นับถอยหลัง — โหมด danger (เหลือ ≤5 วิ) สูงและดังขึ้น
    tick(danger) {
      danger ? tone(1500, 0.07, { type: "square", vol: 0.14 })
             : tone(950, 0.045, { type: "square", vol: 0.05 });
    },
    correct()   { tone(1318.5, 0.14, { vol: 0.16 }); tone(1760, 0.22, { when: 0.09, vol: 0.14 }); },          // ติ๊ง 2 โน้ตสูง
    fanfare()   { [523.25, 659.25, 783.99].forEach((f, i) => tone(f, 0.16, { type: "triangle", when: i * 0.11, vol: 0.2 }));
                  tone(1046.5, 0.4, { type: "triangle", when: 0.33, vol: 0.22 }); },                          // C-E-G-C เรียงขึ้น
    wrong()     { tone(233, 0.22, { vol: 0.09 }); tone(196, 0.3, { when: 0.12, vol: 0.07 }); },               // โทนต่ำ นุ่ม
    buzzer()    { tone(155, 0.35, { type: "sawtooth", vol: 0.11 }); tone(110, 0.3, { when: 0.05, type: "sawtooth", vol: 0.08 }); },
    celebrate() { [659.25, 783.99, 987.77, 1318.5].forEach((f, i) => tone(f, 0.15, { type: "triangle", when: i * 0.09, vol: 0.2 }));
                  tone(1567.98, 0.45, { type: "triangle", when: 0.38, vol: 0.2 }); },
  };
})();

function confetti() {
  const colors = ["#FBBF24", "#4ADE80", "#FB923C", colorVar("--office"), "#F472B6", "#FFFFFF"];
  // เครื่องแรงน้อย (มือถือราคาประหยัด ≤4 core) ลดจำนวนลง กันเฟรมตกตอน CPU ไม่พอ
  const N = (navigator.hardwareConcurrency || 4) <= 4 ? 40 : 110;
  for (let i = 0; i < N; i++) {
    const p = document.createElement("div");
    p.className = "confetti";
    p.style.left = Math.random() * 100 + "vw";
    p.style.background = colors[i % colors.length];
    p.style.transform = `rotate(${Math.random() * 360}deg)`;
    p.style.animationDuration = 1.6 + Math.random() * 1.3 + "s";
    p.style.animationDelay = Math.random() * 0.35 + "s";
    p.addEventListener("animationend", () => p.remove());
    document.body.appendChild(p);
  }
}

  if (effect.startsWith("-")) return `จ่าย ${(+effect.slice(1)).toLocaleString()} TechCoin 💸`;

  return effect;
}

// สุ่มแบบมีน้ำหนัก (weighted random)
function weightedPick(list) {
  const total = list.reduce((s, e) => s + e.weight, 0);
  let r = Math.random() * total;
  for (const e of list) { r -= e.weight; if (r <= 0) return e; }
  return list[list.length - 1];
}

// ---------- หน้าช่องทรัพย์สิน ----------

function renderSpace(id, resume) {

  const setContent = () => document.getElementById("spContent").textContent =
    sp.content_th.startsWith("📘") ? sp.content_th : "📘 " + sp.content_th;

  // ---- 1) หน้าเลือกโหมด (ยังไม่โชว์คำถาม) ----
  function renderModeSelect(toast) {
    const modeCard = l1pool.length ? `
      <div class="card" style="padding:12px 16px;margin-bottom:6px;">
