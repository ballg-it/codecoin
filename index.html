        <div class="bet-row">
          <button class="bet-btn active" id="modeNormal">ตอบปกติ
            <small>ถูก ลด ${CONFIG.discount_percent}% · ผิด ราคาเต็ม</small></button>
          <button class="bet-btn" id="modeConfident">ตอบมั่นใจ 💎
            <small>คำถามยากขึ้น · ถูก ลด ${conf.discount_percent}% · ผิด สุ่มผลแก้บั๊ก 🎰</small></button>
        </div>
        ${toast ? `<div class="result info" style="margin-top:4px;">${toast}</div>` : ""}
      </div>`
      : `<div class="card"><div class="result info">ยังไม่มีคำถามสำหรับช่องนี้ — ซื้อได้ในราคาเต็ม</div></div>`;

    screen.innerHTML = headerCard + modeCard + upgradeBtns;
    enterScreen();
    setContent();
    if (!l1pool.length) return;
    document.getElementById("modeNormal").onclick = () =>
      startQuiz("normal", l1pool[Math.floor(Math.random() * l1pool.length)], 1);
    document.getElementById("modeConfident").onclick = confirmConfident;
  }

  // ---- 2) modal ยืนยันโหมดมั่นใจ + countdown (หมดเวลา/ยกเลิก = กลับเลือกโหมด ไม่เสียสิทธิ์) ----
  function confirmConfident() {
    let remain = conf.confirm_seconds, iv = null;
    const overlay = document.createElement("div");
    overlay.className = "confirm-overlay";
    overlay.innerHTML = `
      <div class="confirm-modal">
        <div style="font-family:'Kanit',sans-serif;font-size:20px;color:var(--gold);margin-bottom:8px;">มั่นใจจริงเหรอ? 💎</div>
        <p class="content">คำถามจะ<b>ยากขึ้น</b> · ตอบถูกลด ${conf.discount_percent}% · <b style="color:var(--bad)">ตอบผิดต้องสุ่มผลแก้บั๊ก 🎰</b></p>
        <button class="btn" id="confirmYes">ยืนยัน (<span class="cd-num" id="cdNum">${remain}</span> วิ)</button>
        <button class="btn ghost" id="confirmNo">ยกเลิก</button>
      </div>`;
    document.body.appendChild(overlay);
    const close = () => { clearInterval(iv); overlay.remove(); };
    SFX.tick(true);
    iv = setInterval(() => {
      remain--;
      if (remain > 0) { document.getElementById("cdNum").textContent = remain; SFX.tick(true); }
      else { close(); SFX.buzzer(); flash("red"); renderModeSelect("⏱ หมดเวลายืนยัน — เลือกโหมดใหม่ได้"); }
    }, 1000);
    document.getElementById("confirmYes").onclick = () => { close(); startConfident(); };
    document.getElementById("confirmNo").onclick = () => { close(); renderModeSelect(); };
  }

  // ---- 3) เข้าคำถามโหมดมั่นใจ: ดึง L4 (fallback L1 ถ้าไม่มี) ----
  function startConfident() {
    if (l4pool.length)
      startQuiz("confident", l4pool[Math.floor(Math.random() * l4pool.length)], conf.question_level);
    else
      startQuiz("confident", l1pool[Math.floor(Math.random() * l1pool.length)], 1,
        "⚠️ ยังไม่มีคำถามมั่นใจสำหรับช่องนี้ — ใช้คำถามปกติแทน");
  }

  // ---- หน้าหมุนวงล้อแบบยืนแยก (ใช้ตอน refresh หนีวงล้อ — โหลดกลับมาเจอวงล้อรออยู่) ----
  function renderRouletteStage() {
    screen.innerHTML = headerCard + `
      <div class="card">
        <div class="result lose">💥 มั่นใจแต่พลาด — ระบบพัง! ต้องสุ่มผลแก้บั๊ก</div>
        <button class="btn" id="spinBtn">🎰 หมุนแก้บั๊ก</button>
        <div id="rouletteBox"></div>
      </div>`;
    setContent();

    /* Stage 4 ข้อ A: refresh กลางหมุน (หรือกลางลุ้นก่อนหมุน) ต้องเด้งไปผลเดิมทันที
       ไม่หมุนใหม่ ไม่สุ่มใหม่ — รู้ได้จาก resume.rouletteFinalIdx ที่ spinFailRoulette()
       persist ไว้ "ก่อน" เริ่มอนิเมชันเสมอ ห้าม log ซ้ำที่นี่ เพราะ log ไปแล้วตอนกดปุ่มครั้งแรก */
    if (resume && resume.rouletteFinalIdx !== undefined) {
      const final = CONFIG.fail_roulette[resume.rouletteFinalIdx];
      if (final) {
        cancelScreenEnter();   // ผลตัดสินไปแล้ว ต้องโผล่ทันที ไม่มี entrance fade มาถ่วงเวลา
        playRouletteReveal(sp, id, final, resume.roulettePay, false);   // fresh=false = ข้ามหมุนเสมอ
        return;
      }
      // final หาไม่เจอ (CONFIG เปลี่ยนหลัง deploy กลางคาบ) — ปล่อยให้กดหมุนใหม่ ดีกว่าค้างจอ
    }
    enterScreen();
    document.getElementById("spinBtn").onclick = () => spinFailRoulette(sp, id);
  }

  // ---- การ์ดคำถาม (ใช้ทั้ง 2 โหมด) time_limit มาจากตัวคำถามเอง (L4 = 25 วิ) ----
  function startQuiz(mode, q, level, toast, sess) {
    // จดสถานะไว้ก่อนเริ่มจับเวลา — refresh แล้วกลับมาได้ข้อเดิม เวลาที่เหลือเท่าเดิม
    sess = sess || Session.begin({ route: "space", key: routeKey(), mode, level, qkey: qKey(q) }, q.time_limit);
    cancelScreenEnter();   // คำถามต้องโผล่ 0ms — กัน fade ค้างจากหน้าเลือกโหมดก่อนหน้า
    screen.innerHTML = `
      <div class="card">
        ${zoneTag(sp.zone)}
        <h2>${sp.name_th}</h2>
        <p style="font-size:14px;">ราคา <span class="price">${sp.price.toLocaleString()} TechCoin</span> · โหมด <b>${mode === "confident" ? "มั่นใจ 💎" : "ปกติ"}</b></p>
      </div>
      <div class="card">
        ${toast ? `<div class="result info" style="margin-bottom:10px;">${toast}</div>` : ""}
        <div id="timerBox"></div>
        <p class="q" id="qText"></p>
        <div id="choices"></div>
        <div id="result"></div>
      </div>`;
    document.getElementById("qText").textContent = "Q: " + q.question_th;

    renderQuiz(q, (ok, timedOut, info, chosenEl) => {
      logAnswer(mode === "confident" ? "buy_confident" : "buy", id, level, ok,
        { question_level: level, ...answerMeta(q, timedOut, info) });
      playAnswerFx(ok, chosenEl);   // ต้องอยู่ต่อจาก logAnswer() เท่านั้น — fire-and-forget ล้วน

      if (ok && mode === "confident") { SFX.fanfare(); flash("gold"); }
      else if (ok) { SFX.correct(); flash("green"); }
      else if (!timedOut) { SFX.wrong(); flash("red"); }

      // เลน มั่นใจ+ผิด — ไม่รู้ยอดทันที ต้องหมุนวงล้อสุ่มผลแก้บั๊ก (คงพฤติกรรม REV 1.6)
      if (!ok && mode === "confident") {
        // ยังไม่เคลียร์ cc_active — เทิร์นยังไม่จบจนกว่าจะหมุนวงล้อ (กัน refresh หนีค่าปรับ)
        Session.patch({ phase: "roulette" });
        document.getElementById("result").innerHTML = `
          <div class="result lose">💥 มั่นใจแต่พลาด — ระบบพัง! ต้องสุ่มผลแก้บั๊ก</div>
          <button class="btn" id="spinBtn">🎰 หมุนแก้บั๊ก</button>
          <div id="rouletteBox"></div>`;
        document.getElementById("spinBtn").onclick = () => spinFailRoulette(sp, id);
        return;
      }

      Session.done(routeKey());   // จบ flow ของช่องนี้
      const payNum = payPrice(mode, ok);
      let msg;
      if (ok) msg = mode === "confident"
        ? `<div class="result win pop">🔥🎉 มั่นใจแล้วถูกจริง! ซื้อได้ในราคา <b><span id="payNum" class="money-num">${sp.price.toLocaleString()}</span></b> (ลด ${conf.discount_percent}%)</div>`
        : `<div class="result win">🎉 ตอบถูก! ซื้อได้ในราคา <b><span id="payNum" class="money-num">${sp.price.toLocaleString()}</span></b> (ลด ${CONFIG.discount_percent}%)</div>`;
      else msg = `<div class="result lose">ตอบผิด — ซื้อได้ในราคาเต็ม ${sp.price.toLocaleString()} TechCoin</div>`;
      document.getElementById("result").innerHTML = msg;

      // ตัวเลขนับ + ป้ายส่วนลดลอย — เฉพาะตอนตอบถูก (ตอบผิด/หมดเวลาราคาคงที่ ไม่มีอะไรให้นับ)
      if (ok) {
        const numEl = document.getElementById("payNum");
        animateMoneyCount(numEl, sp.price, payNum);
        const saved = sp.price - payNum;
        if (saved > 0) floatBadge(numEl, "-" + saved.toLocaleString(), true);
      }
    }, false, sess);
  }

  // กู้สถานะเดิมถ้ามี (refresh กลางคัน) ไม่งั้นเริ่มที่หน้าเลือกโหมดตามปกติ
  if (resume) {
    if (resume.phase === "roulette") { renderRouletteStage(); return; }
    const q = findQuestion(resume.qkey);
    if (q) { startQuiz(resume.mode, q, resume.level, undefined, resume); return; }
    Session.clear();   // คำถามหายจากคลัง (ข้อมูลเปลี่ยน) — เริ่มใหม่ดีกว่าค้าง
  }
  renderModeSelect();
}

// ---------- วงล้อสุ่มผลแก้บั๊ก (เฉพาะเลน มั่นใจ! + ตอบผิด) ----------
// Stage 4 ข้อ A — กฎเหล็ก: "ผลต้องเกิดก่อน animation เสมอ" ห้ามให้ animation เป็นตัวกำหนดผล
// ลำดับบังคับ: 1) สุ่มผล 2) persist ลง session 3) log 4) คำนวณมุมเป้า 5) เริ่มหมุน (แค่ของประดับ)
function spinFailRoulette(sp, spaceId) {
  const pool = CONFIG.fail_roulette;
  const final = weightedPick(pool);              // 1) สุ่มผล — ล็อกแล้ว จบตรงนี้ ห้ามสุ่มซ้ำที่ไหนอีก
  const finalIdx = pool.indexOf(final);
  const pay = Math.round(sp.price * final.mult);

  // 2) persist ก่อน animation เริ่มเสมอ — refresh กลางหมุนจะได้เจอผลเดิมเป๊ะผ่าน resume.rouletteFinalIdx
  Session.patch({ phase: "roulette", rouletteFinalIdx: finalIdx, roulettePay: pay });
  // 3) log ทันที — ไม่รอให้หมุนจบก่อนแบบเดิม (elapsed_ms=null ตั้งใจ: นี่ไม่ใช่การตอบคำถาม
  // เป็นผลพวงจากตอบผิดไปแล้ว เวลาที่วัดได้จะปนเวลาหมุน+อ่านผล ดูเหมือนใช้ได้แต่ใช้ไม่ได้)
  logAnswer("fail_roulette", spaceId, 1, false,
    { roulette_label: final.label, pay, question_id: null, elapsed_ms: null });

  playRouletteReveal(sp, spaceId, final, pay, true);   // 4-5) คำนวณมุม + เริ่มหมุน (fresh=true)
}

// สี wedge ตามความหนักเบาของผล — เขียว=ดีกว่าราคาเต็ม, ทอง=เท่าราคาเต็ม, แดง=แย่กว่า/โดน skip
function rouletteColor(entry) {
  if (entry.mult < 1) return "#4ADE80";
  if (entry.mult > 1 || entry.skip) return "#F87171";
  return "#FBBF24";
}
// เรขาคณิต wedge เดียวกับที่ renderColorWheel ใช้ (มุม 0° = 12 นาฬิกา ไล่ตามเข็ม)
function rouletteWedgePath(cx, cy, rOut, rIn, a0, a1) {
  const pt = (r, a) => { const t = (a - 90) * Math.PI / 180; return [cx + r * Math.cos(t), cy + r * Math.sin(t)]; };
  const [x0, y0] = pt(rOut, a0), [x1, y1] = pt(rOut, a1);
  const [x2, y2] = pt(rIn, a1), [x3, y3] = pt(rIn, a0);
  const large = (a1 - a0) > 180 ? 1 : 0;
  return `M${x0} ${y0}A${rOut} ${rOut} 0 ${large} 1 ${x1} ${y1}L${x2} ${y2}A${rIn} ${rIn} 0 ${large} 0 ${x3} ${y3}Z`;
}
// วาดวงล้อครั้งเดียว (static markup) — เฟรมต่อไปแค่หมุน transform บน #rouletteWheelG เท่านั้น
// ห้ามวาด wedge ใหม่ทุกเฟรม ไม่งั้น CPU throttle 4x จะตกต่ำกว่า 50fps แน่นอน
function buildRouletteWheelSvg(pool) {
  const C = 84, R_OUT = 80, R_IN = 20, seg = 360 / pool.length;
  let wedges = "";
  pool.forEach((entry, i) => {
    const a0 = i * seg, a1 = a0 + seg;
    wedges += `<path d="${rouletteWedgePath(C, C, R_OUT, R_IN, a0, a1)}" fill="${rouletteColor(entry)}" fill-opacity=".82" stroke="${colorVar("--surface-deep")}" stroke-width="1.5"/>`;
  });
  return `<svg viewBox="0 0 ${C * 2} ${C * 2}" class="roulette-wheel-svg" aria-hidden="true">
    <g id="rouletteWheelG">${wedges}<circle cx="${C}" cy="${C}" r="${R_IN}" fill="#0D3327" stroke="#1F4A3A" stroke-width="2"/></g>
  </svg>`;
}

function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }

// rAF หมุนวงล้อจริง — ของประดับล้วน (ผลตัดสินไปแล้วตั้งแต่ spinFailRoulette) ต้องเช็ค renderToken
// ทุกเฟรมก่อนแตะ DOM และหยุดทำงาน (ไม่คำนวณ/ไม่มีเสียง) เมื่อ document.hidden ตามสเปค
function spinRouletteWheel(pool, finalIdx, wheelG, myToken, onDone) {
  if (!wheelG || !wheelG.animate) { onDone(); return; }   // ไม่รองรับ WAAPI = ข้ามไปโชว์ผลเลย ไม่พัง
  const seg = 360 / pool.length;
  const mid = finalIdx * seg + seg / 2;
  const baseTurns = 3 + Math.floor(Math.random() * 2);      // ≥3 รอบเต็มเสมอ ตามสเปค
  const target = baseTurns * 360 + ((360 - mid) % 360);      // มุมเป้าที่คำนวณไว้ล่วงหน้า (ไม่สุ่มระหว่างหมุน)
  const dur = 2200;
  let start = null, lastSeg = -1, done = false, raf = null;

  const paint = deg => { wheelG.style.transform = `rotate(${deg}deg)`; };

  const bounce = () => {
    if (myToken !== renderToken) return;
    const a = wheelG.animate(
      [{ transform: `rotate(${target}deg)` }, { transform: `rotate(${target + 4}deg)` }, { transform: `rotate(${target}deg)` }],
      { duration: MOTION.d(180), easing: easeVar("--ease-pop") }
    );
    a.onfinish = () => { if (myToken === renderToken) onDone(); };
  };

  const finishNow = () => {
    if (done) return;
    done = true;
    if (raf) cancelAnimationFrame(raf);
    document.removeEventListener("pointerdown", onTap);
    paint(target);
    bounce();
  };

  function step(ts) {
    if (myToken !== renderToken) return;   // เปลี่ยนหน้าไปแล้ว — หยุดทันที ห้ามแตะ DOM ต่อ
    if (document.hidden) { raf = requestAnimationFrame(step); return; }   // แท็บถูกซ่อน — พักรอเฉย ๆ
    if (start === null) start = ts;
    const p = Math.min(1, (ts - start) / dur);
    const deg = target * easeOutQuart(p);
    paint(deg);
    const curSeg = Math.floor((((deg % 360) + 360) % 360) / seg);
    if (curSeg !== lastSeg) { lastSeg = curSeg; SFX.tick(false); }   // tick ตามช่องที่ข้ามจริง
    if (p >= 1) { finishNow(); return; }
    raf = requestAnimationFrame(step);
  }
  raf = requestAnimationFrame(step);

  // แตะข้ามได้ "หลัง 1.0 วิ" เท่านั้น (ไม่ใช่ทันทีแบบ skippable() ทั่วไปที่ใช้ที่อื่น)
  const skipAt = Date.now() + 1000;
  function onTap() { if (!done && Date.now() >= skipAt) finishNow(); }
  document.addEventListener("pointerdown", onTap, { passive: true });
}

// เรียกทั้งตอนหมุนสด (fresh=true) และตอน resume/reduced-motion (fresh=false → เด้งผลทันที ข้ามหมุนเสมอ)
function playRouletteReveal(sp, spaceId, final, pay, fresh) {
  const btn = document.getElementById("spinBtn");
  if (btn) btn.disabled = true;
  const box = document.getElementById("rouletteBox");
  const pool = CONFIG.fail_roulette;
  const finalIdx = pool.indexOf(final);
  const myToken = renderToken;

  const wheelMarkup = `
    <div class="roulette-wheel-wrap"><div class="roulette-pointer"></div>${buildRouletteWheelSvg(pool)}</div>`;

  const showFinal = () => {
    if (myToken !== renderToken) return;   // เผื่อ onDone มาจากอนิเมชันที่ยังไม่ทันถูกยกเลิก
    box.innerHTML = wheelMarkup + `
      <div class="roulette-frame final" id="rouletteFrame">
        <div id="rouletteLabel" style="font-size:17px;"></div>
        <div class="price" style="font-size:21px; margin-top:6px;">จ่าย ${pay.toLocaleString()} TechCoin</div>
        ${final.skip ? `<div style="color:var(--bad); font-weight:700; margin-top:6px;">⏸ และผู้เล่นคนนี้ต้องข้ามตาถัดไป 1 รอบ</div>` : ""}
      </div>`;
    document.getElementById("rouletteLabel").textContent = final.label;
    // วางวงล้อนิ่ง ๆ ให้ตรงกับผลจริงเลย (resume/reduced-motion ไม่ได้หมุนมาก่อน)
    const wheelG = document.getElementById("rouletteWheelG");
    const seg = 360 / pool.length, mid = finalIdx * seg + seg / 2;
    if (wheelG) wheelG.style.transform = `rotate(${(360 - mid) % 360}deg)`;

    if (final.mult < 1) { SFX.correct(); flash("green"); }               // รอดถูกกว่าราคาเต็ม
    else if (final.mult > 1 || final.skip) { SFX.wrong(); flash("red"); }
    Session.done(routeKey());   // อนิเมชันจบ (หรือถูกข้าม) แล้ว = ปิดเทิร์นของช่องนี้จริง ๆ ตอนนี้
  };

  // resume กลางหมุน หรือ reduced-motion = ข้ามการหมุนไปเลย แสดงผลทันที ตามสเปค
  if (!fresh || MOTION.reduced) { showFinal(); return; }

  box.innerHTML = wheelMarkup + `<div class="roulette-frame" id="rouletteFrame">กำลังหมุน...</div>`;
  spinRouletteWheel(pool, finalIdx, document.getElementById("rouletteWheelG"), myToken, showFinal);
}

// ---------- หน้าอัปเกรดทรัพย์สิน (?space={id}&upgrade={level}) ----------
function renderUpgrade(id, level, resume) {
  const sp = SPACES[id];
  const name = CONFIG.upgrade_names[level];

  if (!name) {
    screen.innerHTML = `<div class="card"><h2>ระดับอัปเกรด "${level}" ไม่ถูกต้อง (ใช้ 1-3)</h2>
      <button class="btn" onclick="location.search='?space=${id}'">กลับหน้าช่อง</button></div>`;
    enterScreen();
    return;
  }

  const pool = QUESTIONS.filter(q => q.space_id === id && q.level === level);
  const infoCard = `
    <div class="card">
      ${zoneTag(sp.zone)}
      <h2>⬆ อัปเกรด: ${sp.name_th}</h2>
      <p class="content">เป้าหมาย: ระดับ <b>${name}</b> · ค่าอัปเกรด <span class="price">${sp.upgrade_cost.toLocaleString()} TechCoin</span></p>
      <p class="content">ค่าเช่าใหม่เมื่อสำเร็จ: <span class="price">${sp.rent[level].toLocaleString()} TechCoin</span></p>
    </div>`;

  if (!pool.length) {
    screen.innerHTML = infoCard + `
      <div class="card">
        <div class="result info">ยังไม่มีคำถามระดับ ${name} (L${level}) สำหรับช่องนี้ในคลัง</div>
        <button class="btn" onclick="location.search='?space=${id}'">กลับหน้าช่อง</button>
      </div>`;
    enterScreen();
    return;
  }

  // refresh กลางคัน → ใช้คำถามข้อเดิม (ไม่ใช่สุ่มใหม่) แล้วนับเวลาต่อจาก deadline เดิม
  const q = (resume && findQuestion(resume.qkey)) || pool[Math.floor(Math.random() * pool.length)];
  const sess = resume || Session.begin({ route: "upgrade", key: routeKey(), level, qkey: qKey(q) }, q.time_limit);
  cancelScreenEnter();   // คำถามต้องโผล่ 0ms — กัน fade ค้างจากกล่องตั้งเลขผู้เล่นที่อาจเพิ่งปิดไป
  screen.innerHTML = infoCard + `
    <div class="card">
      <div id="timerBox"></div>
      <p class="q" id="qText"></p>
      <div id="choices"></div>
      <div id="result"></div>
      <button class="btn ghost" onclick="Session.clear();location.search='?space=${id}'">กลับหน้าช่อง</button>
    </div>`;
  document.getElementById("qText").textContent = "Q: " + q.question_th;

  renderQuiz(q, (ok, timedOut, info, chosenEl) => {
    Session.done(routeKey());
    logAnswer("upgrade", id, level, ok, answerMeta(q, timedOut, info));
    playAnswerFx(ok, chosenEl);   // ต้องอยู่ต่อจาก logAnswer() เท่านั้น
    document.getElementById("result").innerHTML = ok
      ? `<div class="result win pop">🎉 ตอบถูก! จ่าย <b>${sp.upgrade_cost.toLocaleString()}</b> เพื่ออัปเกรดเป็น "${name}" — ค่าเช่าใหม่ <b>${sp.rent[level].toLocaleString()}</b> TechCoin</div>`
      : `<div class="result lose">ตอบผิด — อัปเกรดไม่สำเร็จ ลองใหม่ได้ในเทิร์นถัดไป</div>`;

    if (ok) { SFX.celebrate(); confetti(); }         // อัปเกรดสำเร็จ = highlight moment
    else if (!timedOut) { SFX.wrong(); flash("red"); }
  }, false, sess);
}

// ---------- หน้าช่องเหตุการณ์ ----------
function renderEvent(zone, resume) {
  // refresh กลางเกม speed → ใช้ใบเดิม ไม่ให้สุ่มใบใหม่หนีใบที่ไม่ชอบ
  const ev = (resume && EVENTS.find(e => e.event_id === resume.evId))
          || weightedPick(EVENTS.filter(e => e.zone === zone));

  if (ev.mechanic === "speed") { renderSpeedEvent(ev, zone, resume); return; }

  // ใบที่ไม่มีการจับเวลา: จดทันทีที่เปิด — กันสแกนซ้ำเพื่อรีดสุ่มใบใหม่
  Session.markDone(routeKey());
  let body = "";

  if (ev.mechanic === "choice") {
    const [bet, safe] = ev.effect.split("|");
    const [, amount, mult] = bet.split(":");
    body = `
      <button class="choice" id="betBtn">🎲 เดิมพัน ${(+amount).toLocaleString()} — ลุ้นรับ ${mult}</button>
      <button class="choice" id="safeBtn">✅ ${effectText(safe.split(":")[1] ?? safe.replace("safe:",""))}</button>
      <div id="result"></div>`;
  } else {
    body = `<div class="result info">${effectText(ev.effect)}</div>`;
  }

  screen.innerHTML = `
    <div class="card">
      ${zoneTag(zone)}
      <h2>🎰 ${ev.title_th}</h2>
      ${ev.description_th ? `<p class="content" id="evDesc" style="margin-bottom:10px;"></p>` : ""}
      ${body}
      <button class="btn ghost" onclick="Session.allowAgain(routeKey());location.search='?space=event_${zone}'">สุ่มใหม่ (ทดสอบ)</button>
      <button class="btn" onclick="renderMenu()">กลับเมนู</button>
    </div>`;
  // การ์ดเหตุการณ์ (simple/choice/chain เท่านั้น — speed คืนไปแล้วด้านบน) ใช้ "พลิกการ์ด" แทน
  // enterScreen() ทั่วไป — ต้อง cancelScreenEnter() เองเพราะไม่ได้เรียก enterScreen() ที่นี่
  cancelScreenEnter();
  playEventCardFlip(screen.querySelector(".card"));

  if (ev.description_th) document.getElementById("evDesc").textContent = ev.description_th;

  if (ev.mechanic === "choice") {
    const [bet] = ev.effect.split("|");
    const [, amount, mult] = bet.split(":");
    document.getElementById("betBtn").onclick = () => {
      const win = Math.random() < 0.5;
      document.getElementById("result").innerHTML = win
        ? `<div class="result win">🎉 ชนะเดิมพัน! รับ ${(amount * parseInt(mult.slice(1))).toLocaleString()} TechCoin</div>`
        : `<div class="result lose">แพ้เดิมพัน เสีย ${(+amount).toLocaleString()} TechCoin</div>`;
    };
    document.getElementById("safeBtn").onclick = () => {
      document.getElementById("result").innerHTML =
        `<div class="result win">รับแบบชัวร์เรียบร้อย ✅</div>`;
    };
  }
}

// ---------- event แบบ speed: แข่งตอบเร็วรอบโต๊ะ ----------
// ไม่ใช่ multiplayer จริง — ทุกคนดูจอเดียวกัน แข่งตอบปากเปล่า แล้วคนถือมือถือ
// กดหมายเลขผู้เล่นที่วงตัดสินว่าตอบถูกไวสุด (state อยู่ในฟังก์ชันนี้ ใช้ครั้งเดียวจบ)
function renderSpeedEvent(ev, zone, resume) {
  setHeaderHidden(true);   // Stage V2b FIX-1b: หน้าจับเวลา ยังล้น ≤700 ไม่ได้แม้บีบ margin สุดแล้ว
  // แข่งตอบเร็วด้วยปากเปล่า → ใช้ได้เฉพาะคำถามแบบตัวเลือก (ข้อ "ชี้ตำแหน่ง" อ่านออกเสียงไม่ได้)
  const pool = QUESTIONS.filter(x => !x.qtype);
  const q = (resume && findQuestion(resume.qkey)) || pool[Math.floor(Math.random() * pool.length)];
  const sess = resume || Session.begin(
    { route: "speed", key: routeKey(), evId: ev.event_id, qkey: qKey(q) }, CONFIG.speed_time_limit);

  cancelScreenEnter();   // คำถามต้องโผล่ 0ms — กัน fade ค้างจากหน้าก่อนเข้าเทิร์นนี้
  // Stage V2 FIX-1: บีบ margin/padding เฉพาะเทมเพลตนี้ (?space=event_* mechanic=speed เท่านั้น)
  // ให้ปุ่มตัวสุดท้ายเข้าใกล้ 640px มากที่สุดบนจอ 360×640 โดยไม่แตะขนาดปุ่ม/นาฬิกา/ฟอนต์
  screen.innerHTML = `
    <div class="card">
      ${zoneTag(zone).replace('style="background', 'style="margin-bottom:1px;background')}
      <h2 style="margin-bottom:1px;">⚡ ${ev.title_th}</h2>
      ${ev.description_th ? `<p class="content" id="evDesc" style="margin-bottom:1px;"></p>` : ""}
      <div class="result info" style="margin:0 0 1px;padding:2px 14px;">แข่งตอบเร็ว! ทุกคนตอบพร้อมกันด้วยปากเปล่า —
        คนที่ตอบถูกและไวที่สุด${effectText(ev.effect)}</div>
      <div id="timerBox"></div>
      <p class="q" id="qText" style="margin:0 0 1px;"></p>
      <div id="choices"></div>
      <p class="q" style="margin:1px 0 1px;">ใครตอบถูกไวสุด? (วงตัดสินเอง แล้วกดหมายเลข)</p>
      <div class="speed-players" id="speedPlayers" style="display:grid;grid-template-columns:repeat(2,1fr);gap:4px 0;margin:0 -3px 1px;"></div>
      <div id="result"></div>
      <button class="btn ghost" style="margin-top:3px;" onclick="Session.clear();Session.allowAgain(routeKey());location.search='?space=event_${zone}'">สุ่มใหม่ (ทดสอบ)</button>
      <button class="btn" id="speedBack" style="margin-top:3px;">กลับเมนู</button>
    </div>`;

  if (ev.description_th) document.getElementById("evDesc").textContent = ev.description_th;
  // คำถาม/ตัวเลือกอาจมีแท็ก HTML เป็นตัวอย่างบทเรียน — ใส่แบบ text ล้วนเสมอ
  document.getElementById("qText").textContent = "Q: " + q.question_th;
  const box = document.getElementById("choices");
  q.choices.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "choice";
    b.disabled = true;  // โชว์ให้อ่านอย่างเดียว — ไม่มีการกดตอบบนจอ
    b.textContent = String.fromCharCode(65 + i) + ". " + c;
    box.appendChild(b);
  });

  const wrap = document.getElementById("speedPlayers");
  let timer = null;

  // กลับเมนูโดยไม่ reload หน้า — ต้องหยุด timer ก่อน ไม่งั้นเสียงติ๊ก/บัซเซอร์ตามไปหน้าเมนู
  document.getElementById("speedBack").onclick = () => {
    clearInterval(timer); Wake.off(); Session.clear(); renderMenu();
  };

  // จบรอบ: winner = เลขผู้เล่น หรือ null = หมดเวลา (กดย้อนหลังไม่ได้ — ปุ่มถูก disable)
  const finish = winner => {
    clearInterval(timer);
    Wake.off();
    Session.done(routeKey());
    [...wrap.children].forEach(b => b.disabled = true);
    box.children[q.answer].classList.add("correct");  // เฉลยให้วงเห็น
    // ไม่มี picked — วงตอบด้วยปากเปล่า บนจอกดแค่ "ใครไวสุด" (ตัวเลือกถูก disable ไว้)
    // winner = เลขผู้เล่นที่วงตัดสิน ไม่ใช่คนกดมือถือ จึงเป็นคนละความหมายกับ field player
    if (winner) {
      SFX.correct(); flash("green");
      logAnswer("speed", ev.event_id || "event_" + zone, 0, true,
        { winner, ...answerMeta(q, false, null) });
      document.getElementById("result").innerHTML =
        `<div class="result win">⚡ ผู้เล่น ${winner} ตอบไวสุด! ${effectText(ev.effect)}</div>`;
    } else {
      // ทั้งวงตอบไม่ได้ = ข้อยากที่สุด ข้อมูลมีค่าที่สุด — เดิมกิ่งนี้ไม่ log อะไรเลย
      logAnswer("speed", ev.event_id || "event_" + zone, 0, false,
        { winner: null, ...answerMeta(q, true, null) });
      document.getElementById("result").innerHTML =
        `<div class="result lose">⏱ หมดเวลา — รอบนี้ไม่มีใครได้รางวัล</div>`;
    }
  };

  for (let p = 1; p <= CONFIG.speed_players; p++) {
    const b = document.createElement("button");
    b.className = "speed-player";
    b.textContent = "ผู้เล่น " + p;
    b.onclick = () => finish(p);
    wrap.appendChild(b);
  }

  // timer แบบเดียวกับ renderQuiz — นับจาก deadline สัมบูรณ์ (refresh แล้วเวลาเดินต่อ)
  const tb = document.getElementById("timerBox");
  const deadline = sess.deadlineTs || (Date.now() + CONFIG.speed_time_limit * 1000);
  const left = () => Math.ceil((deadline - Date.now() - 20) / 1000);
  const paint = t => tb.innerHTML = `<div class="timer ${t <= 5 ? "danger" : ""}">⏱ ${Math.max(0, t)} วินาที</div>`;
  const timeUp = () => { paint(0); SFX.buzzer(); flash("red"); finish(null); };

  if (left() <= 0) timeUp();     // refresh กลับมาหลังหมดเวลา = ปิดรอบทันที
  else {
    paint(left());
    Wake.on();
    timer = setInterval(() => {
      const t = left();
      if (t <= 0) { timeUp(); return; }
      paint(t);
      SFX.tick(t <= 5);
    }, 1000);
  }
}

// ---------- หน้าติดบั๊ก: เลือกระดับก่อน แล้วค่อยสุ่มโจทย์ ----------
function renderBugjam() {
  // แถวเก่าที่ไม่มี difficulty ถือเป็น easy (ข้อมูล fallback ในไฟล์นี้ก็เข้าเคสนี้)
  const hardPool = BUGJAM.filter(b => b.difficulty === "hard");

  screen.innerHTML = `
    <div class="card">
      <span class="zone-tag" style="background:var(--bad)">ติดบั๊ก (Bug Jam)</span>
      <h2>แก้โจทย์ Debug เพื่อออก!</h2>
      <p class="content" style="margin-bottom:10px;">เลือกระดับโจทย์:</p>
      <div class="bet-row">
        <button class="bet-btn active" id="diffEasy">ง่าย
          <small>ตอบถูก ออกจากติดบั๊กฟรี</small></button>
        <button class="bet-btn" id="diffHard" ${hardPool.length ? "" : "disabled"}>ยาก 💎
          <small>${hardPool.length
            ? `ตอบถูก ออกฟรี + โบนัส ${CONFIG.bugjam_bonus_hard} TechCoin`
            : "ยังไม่มีโจทย์ระดับนี้"}</small></button>
      </div>
    </div>`;
  enterScreen();

  document.getElementById("diffEasy").onclick = () => renderBugQuestion("easy");
  if (hardPool.length)
    document.getElementById("diffHard").onclick = () => renderBugQuestion("hard");

// สลับตำแหน่งตัวเลือกแบบสุ่ม (Fisher-Yates) + รีแมป index เฉลย — กันเด็กจำตำแหน่งเฉลยรอบก่อน
// คืน bug ก็อปใหม่ที่ choices สลับแล้ว, answer ชี้ถูก, และ time_limit ตามระดับ (จาก CONFIG)
// order แยกออกมาเพื่อเก็บลง sessionStorage ได้ — refresh แล้วตัวเลือกต้องเรียงเหมือนเดิม
function shuffleOrder(n) {
  const idx = Array.from({ length: n }, (_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return idx;
}
// เวอร์ชัน seeded — ใช้กับบอสไฟต์ที่ต้องสร้างลำดับเดิมซ้ำได้ (กู้สถานะตอน refresh)
function shuffleOrderSeeded(n, rng) {
  const idx = Array.from({ length: n }, (_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return idx;
}
function shuffledBug(bug, timeLimit, order) {
  const idx = order || shuffleOrder(bug.choices.length);
  return { ...bug, choices: idx.map(i => bug.choices[i]), answer: idx.indexOf(bug.answer), time_limit: timeLimit };
}

// โจทย์ Bug Jam หนึ่งข้อตามระดับที่เลือก — 1 เทิร์นตอบได้ครั้งเดียว (ปุ่มล็อกหลังตอบ)
// ตอบผิด/หมดเวลา = เสียค่าปรับ ไม่ให้ลองซ้ำฟรี (state ในฟังก์ชันนี้ ใช้ครั้งเดียวจบ ไม่ persist)
function renderBugQuestion(diff, resume) {
  const isHard = diff === "hard";
  const pool = BUGJAM.filter(b => (b.difficulty || "easy") === diff);
  // refresh กลางคัน → โจทย์เดิม + ตัวเลือกเรียงเดิม + เวลาที่เหลือเดิม
  const raw = (resume && pool.find(b => bugKey(b) === resume.bugKey)) || pool[Math.floor(Math.random() * pool.length)];
  const tl = isHard ? CONFIG.bugjam_time_hard : CONFIG.bugjam_time_easy;
  const order = (resume && resume.order) || shuffleOrder(raw.choices.length);
  const bug = shuffledBug(raw, tl, order);
  const sess = resume || Session.begin(
    { route: "bugjam", key: routeKey(), diff, bugKey: bugKey(raw), order }, tl);
  const fine = isHard ? CONFIG.bugjam_fine_hard : CONFIG.bugjam_fine;
  let hintUsed = !!(resume && resume.hintUsed);   // เคยกด hint ไปแล้วก็ยังนับว่ากดแล้ว

  cancelScreenEnter();   // คำถามต้องโผล่ 0ms — กัน fade ค้างจากหน้าเลือกระดับก่อนหน้า
  // Stage V2 FIX-2: บีบ margin/padding เฉพาะเทมเพลตนี้ (?space=bugjam เท่านั้น) + code-box จำกัด
  // max-height ให้เลื่อนเนื้อโค้ดในกล่องได้เอง (โจทย์ยาว 3 บรรทัด) แทนดันหน้าล้น — ไม่แตะขนาดปุ่ม/นาฬิกา/ฟอนต์
  screen.innerHTML = `
    <div class="card">
      <span class="zone-tag" style="margin-bottom:4px;background:var(--bad)">ติดบั๊ก (Bug Jam) · ระดับ${isHard ? "ยาก 💎" : "ง่าย"}</span>
      <h2 style="margin-bottom:4px;">แก้โจทย์ Debug เพื่อออก!</h2>
      <p class="content" style="font-size:12.5px;margin-bottom:4px;">⚠️ ตอบได้ครั้งเดียว! ผิดหรือหมดเวลา = เสียค่าปรับ ${fine.toLocaleString()} หรือรอทอยรอบหน้า</p>
      <div id="timerBox"></div>
      <div class="code-box" id="bugCode" style="max-height:58px;overflow-y:auto;padding:6px 10px;margin-top:-6px;margin-bottom:6px;"></div>
      <p class="q" id="qText" style="margin:3px 0 6px;"></p>
      <div id="choices"></div>
      ${bug.hint ? `
        <button class="btn ghost" id="hintBtn">💡 ดู hint${isHard
          ? ` (โบนัสจะลดเหลือ ${CONFIG.bugjam_bonus_hint})` : ""}</button>
        <div class="result info" id="hintText" style="display:none;"></div>` : ""}
      <div id="result"></div>
    </div>`;
  document.getElementById("bugCode").textContent = bug.code;
  document.getElementById("qText").textContent = "Q: " + bug.question_th;

  const hintBtn = document.getElementById("hintBtn");
  const showHint = () => {
    hintBtn.disabled = true;  // กดได้ครั้งเดียวต่อโจทย์
    const ht = document.getElementById("hintText");
    ht.textContent = "💡 " + bug.hint;
    ht.style.display = "block";
  };
  if (hintBtn) {
    hintBtn.onclick = () => { hintUsed = true; Session.patch({ hintUsed: true }); showHint(); };
    if (hintUsed) showHint();   // refresh หลังกด hint → ยังเห็น hint เดิม ปุ่มยังล็อก
  }

  renderQuiz(bug, (ok, timedOut, info, chosenEl) => {
    Session.done(routeKey());
    if (hintBtn) hintBtn.disabled = true;
    // question_id ใช้ bugKey(raw) — ต้องเป็นตัวก่อนสลับตัวเลือก ถึงจะเป็นข้อเดียวกันทุกเครื่อง
    logAnswer(isHard ? "bugjam_hard" : "bugjam", bug.bug_id || "bugjam", 0, ok,
      { difficulty: diff, hinted: hintUsed, ...answerMeta(bug, timedOut, info), question_id: bugKey(raw) });
    playAnswerFx(ok, chosenEl);   // ต้องอยู่ต่อจาก logAnswer() เท่านั้น
    // เฉลย Bug Jam (Stage 4) — pulse ทั้งกล่องด้วย CSS class เดียว ไม่แตะ text node ของโค้ดเลย
    document.getElementById("bugCode").classList.add("fx-reveal");
    let msg;
    if (ok && isHard) {
      const bonus = hintUsed ? CONFIG.bugjam_bonus_hint : CONFIG.bugjam_bonus_hard;
      msg = `<div class="result win pop">🔓💎 Debug สำเร็จ! ออกจากติดบั๊กฟรี + โบนัส ${bonus.toLocaleString()} TechCoin</div>`;
    } else if (ok) {
      msg = `<div class="result win">🔓 Debug สำเร็จ! ออกจากติดบั๊กได้ฟรี</div>`;
    } else {
      // ตอบผิด/หมดเวลา = เสียค่าปรับ ห้ามลองซ้ำในเทิร์นนี้ (ระดับยากเสี่ยงกว่า + อดโบนัส)
      const head = timedOut ? "⏱ หมดเวลา!" : "❌ แก้ไม่สำเร็จ!";
      msg = `<div class="result lose">${head} เสียค่าปรับ <b>${fine.toLocaleString()}</b> TechCoin${isHard ? " + อดโบนัส 💎" : ""}<br>
        <span style="font-size:12.5px;">รอทอยรอบหน้าค่อยลองใหม่ — ห้ามตอบซ้ำในเทิร์นนี้</span></div>`;
    }
    document.getElementById("result").innerHTML = msg;
    document.getElementById("result").insertAdjacentHTML("beforeend",
      `<button class="btn" onclick="renderMenu()">กลับเมนู</button>`);

    if (ok) { SFX.correct(); flash("green"); }
    else if (!timedOut) { SFX.wrong(); flash("red"); }
  }, true, sess);
}

// ---------- ระบบควิซ + จับเวลา (ใช้ร่วมกันทุกหน้า) ----------
// onDone(ok, timedOut) — timedOut = true เฉพาะกรณีหมดเวลา (เสียง buzzer + แฟลชแดง

// ชื่อสีไทย ↔ องศาบนวงล้อ (เสี้ยว i กินมุม i*30 ถึง (i+1)*30 สี hsl(i*30))
const WHEEL_COLORS = {
  red:     { th: "สีแดง",          hue: 0   },
  orange:  { th: "สีส้ม",           hue: 30  },
  yellow:  { th: "สีเหลือง",        hue: 60  },
  lime:    { th: "สีเขียวอมเหลือง", hue: 90  },
  green:   { th: "สีเขียว",         hue: 120 },
  teal:    { th: "สีเขียวอมฟ้า",    hue: 150 },
  cyan:    { th: "สีฟ้าอมเขียว",    hue: 180 },
  azure:   { th: "สีฟ้า",           hue: 210 },
  blue:    { th: "สีน้ำเงิน",        hue: 240 },
  violet:  { th: "สีม่วง",          hue: 270 },
  magenta: { th: "สีบานเย็น",       hue: 300 },
  rose:    { th: "สีชมพูอมแดง",     hue: 330 },
};

const SVG_NS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
// คืนจำนวนเต็มเมื่อค่าเป็นตัวเลขล้วนจริง ๆ ("" → null ไม่ใช่ 0)
const intOf = v => {
  const s = String(v == null ? "" : v).trim();
  return /^-?\d+$/.test(s) ? +s : null;
};

const QTYPES = {
  hotspot: {
    valid: q => {
      const a = String(q.answer || "").trim();
      return /^\d{1,3},\d{1,3},\d{1,3}$/.test(a)
        && a.split(",").every(n => +n >= 0 && +n <= 100)
        && !!ASSETS[String(q.asset || "").trim()];
    },
    render: (q, cb) => renderHotspot(q, cb),
  },
  colorwheel: {
    valid: q => {
      const d = intOf(q.answer), t = intOf(q.payload);
      return d !== null && d >= 0 && d <= 359 && t !== null && t >= 1 && t <= 45;
    },
    render: (q, cb) => renderColorWheel(q, cb),
  },
  linepick: {
    valid: q => {
      const p = String(q.payload || ""), n = intOf(q.answer);
      return p !== "" && n !== null && n >= 1 && n <= p.split("\n").length;
    },
    render: (q, cb) => renderLinePick(q, cb),
  },
};

// เรนเดอร์ไม่ได้จริง ๆ (qtype เพี้ยน + ไม่มีตัวเลือกให้ถอย) — คัดทิ้งตั้งแต่ตอนโหลด
// จะได้ไม่ถูกสุ่มมาให้ผู้เล่นเจอข้อที่ตอบไม่ได้
function questionUsable(q) {
  const t = String(q.qtype || "").trim().toLowerCase();
  const hasChoices = Array.isArray(q.choices) && q.choices.length > 0;
  if (!t) return hasChoices;
  const spec = QTYPES[t];
  return !!((spec && spec.valid(q)) || hasChoices);
}

// dispatcher — default ต้องตกมาที่ MCQ เสมอ ห้ามจอขาว
function renderQuestion(q, onAnswer) {
  const t = String(q.qtype || "").trim().toLowerCase();
  if (t) {
    const spec = QTYPES[t];
    if (!spec)
      console.warn(`[qtype] "${t}" ไม่รู้จัก (${q.question_id}) — ถอยไปใช้ตัวเลือกแบบเดิม`);
    else if (!spec.valid(q))
      console.warn(`[qtype] ข้อมูล ${t} ของ ${q.question_id} ไม่ถูกต้อง — ถอยไปใช้ตัวเลือกแบบเดิม`);
    else
      return spec.render(q, onAnswer);
  }
  return renderMCQ(q, onAnswer);
}

// ---------- แบบเดิม: ตัวเลือก a/b/c/d ----------
function renderMCQ(q, onAnswer) {
  const box = document.getElementById("choices");
  if (!q.choices || !q.choices.length) {
    // ไม่มีทั้ง renderer และตัวเลือก — ให้ทางออกไว้ ไม่ปล่อยให้ผู้เล่นค้าง
    box.innerHTML = `<div class="result info">⚠️ ข้อนี้แสดงผลไม่ได้</div>`;
    const b = document.createElement("button");
    b.className = "btn ghost";
    b.textContent = "ข้ามข้อนี้ (นับว่าตอบผิด)";
    b.onclick = () => { b.disabled = true; onAnswer(false, { qtype: "mcq", picked: null, skipped: true }); };
    box.appendChild(b);
    return { lock: () => { b.disabled = true; } };
  }
  q.choices.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "choice";
    b.textContent = String.fromCharCode(65 + i) + ". " + c;
    b.onclick = () => {
      [...box.children].forEach((el, j) => {
        el.disabled = true;
        if (j === q.answer) el.classList.add("correct");
        else if (j === i) el.classList.add("wrong");
      });
      // picked = ตำแหน่งบนจอเครื่องนี้ ซึ่งสลับที่รายเครื่อง (bugjam/บอสไฟต์) จึงต้องมี
      // picked_label คู่กันเสมอ — ตัวที่เอาไปนับ distractor ยอดฮิตข้ามเครื่องได้จริงคือ label
      onAnswer(i === q.answer, {
        qtype: "mcq", picked: i,
        picked_label: String(c).slice(0, 80),
      });
    };
    box.appendChild(b);
  });
  return { lock: () => [...box.children].forEach(el => el.disabled = true) };
}

// ---------- hotspot: แตะตำแหน่งบนภาพ ----------
function renderHotspot(q, onAnswer) {
  const box = document.getElementById("choices");
  const [ax, ay, ar] = String(q.answer).split(",").map(Number);

  box.innerHTML = `<div class="point-wrap" id="hsWrap"></div>
    <p class="point-hint">แตะตำแหน่งบนภาพเพื่อตอบ</p>
    <button class="btn ghost" id="hsSkip">ข้ามข้อนี้ (นับว่าตอบผิด)</button>`;
  const wrap = document.getElementById("hsWrap");
  wrap.innerHTML = ASSETS[String(q.asset).trim()];
  const svg = wrap.querySelector("svg");
  svg.removeAttribute("preserveAspectRatio");   // ต้องคงอัตราส่วน ไม่งั้นพิกัดเพี้ยน
  const skip = document.getElementById("hsSkip");
  let locked = false;

  const lock = () => { locked = true; skip.disabled = true; svg.style.cursor = "default"; };

  // เฉลย: วงกลมเส้นประ + ชื่อชิ้นส่วน — ตอบผิดแล้วยังได้เรียน
  const reveal = () => {
    const vb = svg.viewBox.baseVal;
    const cx = ax / 100 * vb.width, cy = ay / 100 * vb.height, r = ar / 100 * vb.width;
    svg.appendChild(svgEl("circle", {
      cx, cy, r, fill: "none", stroke: "#4ADE80", "stroke-width": 2.5, "stroke-dasharray": "7 5",
    }));
    const label = String(q.payload || "").trim();
    if (!label) return;
    const t = svgEl("text", {
      x: Math.min(vb.width * 0.82, Math.max(vb.width * 0.18, cx)),
      y: Math.max(vb.width * 0.05, cy - r - 6),
      "text-anchor": "middle", "font-family": "'Kanit',sans-serif",
      "font-size": Math.round(vb.width * 0.045), fill: "#4ADE80",
      stroke: colorVar("--surface-deep"), "stroke-width": 3.5, "paint-order": "stroke",  // ขอบเข้มให้อ่านออกบนลายวงจร
    });
    t.textContent = label;   // ชื่อชิ้นส่วนมาจากข้อมูล — ใส่แบบ text ล้วนเสมอ
    svg.appendChild(t);
  };

  svg.addEventListener("click", ev => {
    if (locked) return;
    // คิดกรอบใหม่ทุกครั้งที่แตะ — หมุนจอ/ย่อขยายแล้วพิกัดยังถูก
    const rect = svg.getBoundingClientRect();
    const px = (ev.clientX - rect.left) / rect.width * 100;
    const py = (ev.clientY - rect.top) / rect.height * 100;
    const vb = svg.viewBox.baseVal;
    const dx = (px - ax) / 100 * vb.width;
    const dy = (py - ay) / 100 * vb.height;
    // รัศมีคิดเป็น % ของความกว้าง viewBox เสมอ — พื้นที่จะได้เป็นวงกลมจริง ไม่ใช่วงรี
    const hit = Math.hypot(dx, dy) <= ar / 100 * vb.width;

    lock();
    svg.appendChild(svgEl("circle", {          // จุดทองตรงที่แตะ ให้รู้ว่าระบบรับแล้ว
      cx: px / 100 * vb.width, cy: py / 100 * vb.height, r: Math.max(4, vb.width * 0.013),
      fill: "#FBBF24", stroke: colorVar("--surface-deep"), "stroke-width": 1.5,
    }));
    if (!hit) reveal();
    onAnswer(hit, {           // พิกัดเป็น % ของภาพ → เอาไป plot heatmap ว่าเด็กแตะผิดตรงไหนบ่อย
      qtype: "hotspot",
      picked_xy: `${Math.round(px * 10) / 10},${Math.round(py * 10) / 10}`,
    });
  });

  skip.onclick = () => {
    if (locked) return;
    lock(); reveal();
    onAnswer(false, { qtype: "hotspot", picked_xy: null, skipped: true });
  };
  return { lock };
}

// ---------- colorwheel: แตะเสี้ยวสีบนวงล้อ ----------
function renderColorWheel(q, onAnswer) {
  const box = document.getElementById("choices");
  const deg = intOf(q.answer), tol = intOf(q.payload);
  const key = String(q.asset || "").replace(/^wheel:/i, "").trim().toLowerCase();
  const info = WHEEL_COLORS[key] || { th: key || "สีโจทย์", hue: null };
  const C = 150, R_OUT = 118, R_IN = 52;

  // 0° อยู่ด้านบน แล้วไล่ตามเข็มนาฬิกา
  const pt = (r, a) => {
    const t = (a - 90) * Math.PI / 180;
    return [C + r * Math.cos(t), C + r * Math.sin(t)];
  };
  const wedge = (a0, a1) => {
    const [x0, y0] = pt(R_OUT, a0), [x1, y1] = pt(R_OUT, a1);
    const [x2, y2] = pt(R_IN, a1), [x3, y3] = pt(R_IN, a0);
    return `M${x0} ${y0}A${R_OUT} ${R_OUT} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${R_IN} ${R_IN} 0 0 0 ${x3} ${y3}Z`;
  };

  let wedges = "";
  for (let i = 0; i < 12; i++)
    wedges += `<path d="${wedge(i * 30, (i + 1) * 30)}" fill="hsl(${i * 30} 78% 55%)" stroke="${colorVar("--surface-deep")}" stroke-width="1"/>`;
  const ring = info.hue === null ? ""   // วงแหวนทองรอบสีโจทย์ ให้เห็นว่าโจทย์อยู่ตรงไหน
    : `<path d="${wedge(info.hue, info.hue + 30)}" fill="none" stroke="#FBBF24" stroke-width="4"/>`;

  box.innerHTML = `<div class="point-wrap">
      <svg viewBox="0 0 300 300" id="cwSvg">
        ${wedges}${ring}
        <circle cx="150" cy="150" r="50" fill="#0D3327" stroke="#1F4A3A" stroke-width="1.5"/>
        <text id="cwName" x="150" y="150" text-anchor="middle" dominant-baseline="central"
              font-family="'Kanit',sans-serif" font-size="19" fill="#FBBF24"></text>
      </svg>
    </div>
    <p class="point-hint">แตะบนวงแหวนสีเพื่อตอบ (แตะตรงกลางหรือนอกวงไม่นับ)</p>`;
  document.getElementById("cwName").textContent = info.th;

  const svg = document.getElementById("cwSvg");
  let locked = false;
  svg.addEventListener("click", ev => {
    if (locked) return;
    const rect = svg.getBoundingClientRect();
    const px = (ev.clientX - rect.left) / rect.width * 100;
    const py = (ev.clientY - rect.top) / rect.height * 100;
    const dist = Math.hypot((px - 50) / 100 * 300, (py - 50) / 100 * 300);
    if (dist <= R_IN || dist >= R_OUT) return;   // แตะตรงกลาง/นอกวง = ไม่นับ ยังแตะใหม่ได้

    const ang = (Math.atan2(py - 50, px - 50) * 180 / Math.PI + 90 + 360) % 360;
    const diff = Math.abs(((ang - deg + 540) % 360) - 180);   // ระยะเชิงมุมสั้นสุด
    const hit = diff <= tol;
    locked = true;
    svg.style.cursor = "default";
    svg.appendChild(svgEl("circle", {
      cx: px / 100 * 300, cy: py / 100 * 300, r: 7,
      fill: "#FBBF24", stroke: colorVar("--surface-deep"), "stroke-width": 2,
    }));
    if (!hit) svg.appendChild(svgEl("path", {   // เฉลย: กรอบเขียวรอบเสี้ยวที่ถูก
      d: wedge(deg - 15, deg + 15), fill: "none",
      stroke: "#4ADE80", "stroke-width": 4, "stroke-dasharray": "8 5",
    }));
    // องศาที่แตะ (0-359) — เทียบกับ q.answer แล้วรู้ว่าพลาดไปทางไหน กี่องศา
    onAnswer(hit, { qtype: "colorwheel", picked_deg: Math.round(ang) });
  });
  return { lock: () => { locked = true; } };
}

// ---------- linepick: แตะบรรทัดโค้ดที่ผิด ----------
function renderLinePick(q, onAnswer) {
  const box = document.getElementById("choices");
  const lines = String(q.payload || "").split("\n");
  const ansLine = intOf(q.answer);
  box.innerHTML = `<div class="lp-box" id="lpBox"></div>
    <p class="point-hint">แตะบรรทัดที่คิดว่าผิด</p>`;
  const wrap = document.getElementById("lpBox");
  const rows = [];
  let locked = false;

  const lock = () => { locked = true; rows.forEach(r => r.disabled = true); };

  lines.forEach((ln, i) => {
    const row = document.createElement("button");
    row.className = "lp-row";
    row.innerHTML = `<span class="lp-num"></span><span class="lp-code"></span>`;
    row.querySelector(".lp-num").textContent = i + 1;
    row.querySelector(".lp-code").textContent = ln;   // โค้ดอาจมีอักขระพิเศษ — text ล้วนเสมอ
    row.onclick = () => {
      if (locked) return;
      const ok = (i + 1) === ansLine;
      lock();
      if (ok) {
        row.classList.add("answer");
      } else {
        row.classList.add("picked");                       // บรรทัดที่แตะ = แดง
        rows[ansLine - 1] && rows[ansLine - 1].classList.add("answer");   // บรรทัดเฉลย = เขียว
      }
      onAnswer(ok, { qtype: "linepick", picked_line: i + 1 });   // เลขบรรทัดฐาน 1 ตรงกับที่โชว์บนจอ
    };
    rows.push(row);
    wrap.appendChild(row);
  });
  return { lock };
}

// sess = record จาก Session.begin (ถ้ามี) — เวลานับจาก deadlineTs สัมบูรณ์
// จึงกัน "refresh หนีเวลา" ได้: โหลดใหม่แล้วเวลาเดินต่อ ไม่ได้เริ่มนับหนึ่ง
function renderQuiz(q, onDone, timeout_fail, sess) {
  let timer = null, done = false, ringAnim = null;
  // ต้อง .cancel() วงแหวนทุกครั้งก่อนเข้าเส้นทาง log — ไม่งั้นมันเดินต่อเป็น animation ค้าง
  // อยู่บน element ที่ไม่มีใครมองแล้ว (หน้าเปลี่ยนไปแล้วแต่ WAAPI ยังทำงานอยู่เบื้องหลัง)
  const stopRing = () => { if (ringAnim) { try { ringAnim.cancel(); } catch (e) {} ringAnim = null; } };
  const stop = () => { clearInterval(timer); Wake.off(); stopRing(); };

  /* จับ element ที่ผู้เล่น "แตะจริง" แบบไม่ต้องรู้จักโครงสร้างภายในของ renderer แต่ละแบบ (Stage 3)
     capture:true = ทำงานตอน capturing phase ซึ่งมาก่อน onclick ของปุ่มเสมอ (onclick เป็น target/
     bubbling phase) การันตีว่า chosenEl ถูกจับไว้แล้วก่อน onAnswer() ในทุก qtype:
     MCQ→.choice, linepick→.lp-row, hotspot/colorwheel→svg — ครอบคลุมฟรีโดยไม่แตะ renderer เลย */
  let chosenEl = null;
  const choicesBox = document.getElementById("choices");
  if (choicesBox) {
    choicesBox.addEventListener("click", e => {
      chosenEl = e.target.closest("button, .lp-row, svg") || e.target;
    }, { capture: true });
  }

  // คำถามทุกแบบผ่านทางเดียวกันหมด — ตัวจับเวลา/เสียง/เอฟเฟกต์อยู่ที่นี่ที่เดียว
  // info = ค่าที่ผู้เล่นแตะ (ตัวเลือก/พิกัด/บรรทัด) ส่งต่อให้จุดเรียกเอาไปเข้า log
  const view = renderQuestion(q, (ok, info) => {
    if (done) return;
    done = true;
    stop();
    onDone(ok, false, info, chosenEl);
  });

  if (q.time_limit > 0) {
    const tb = document.getElementById("timerBox");
    const totalMs = q.time_limit * 1000;
    const deadline = (sess && sess.deadlineTs) || (Date.now() + totalMs);
    const startedAt = deadline - totalMs;   // จุดเริ่มจริง (ทั้งเริ่มใหม่และ resume คำนวณด้วยสูตรเดียวกัน)
    // -20ms กันเคส setInterval เด้งเร็วกว่ากำหนดนิดหน่อยแล้วเลขค้างซ้ำวินาที
    const left = () => Math.ceil((deadline - Date.now() - 20) / 1000);

    const RING_R = 15.5, RING_C = Math.round(2 * Math.PI * RING_R * 100) / 100;
    tb.innerHTML = `
      <div class="clock-wrap" id="clockWrap">
        <svg viewBox="0 0 36 36" class="clock-ring" id="clockRingSvg" aria-hidden="true">
          <circle class="clock-ring-track" cx="18" cy="18" r="${RING_R}"></circle>
          <circle class="clock-ring-fill" id="clockRingFill" cx="18" cy="18" r="${RING_R}" stroke-dasharray="${RING_C}"></circle>
        </svg>
        <div class="timer" id="timerNum"></div>
      </div>`;
    const wrapEl = document.getElementById("clockWrap");
    const ringSvgEl = document.getElementById("clockRingSvg");
    const ringEl = document.getElementById("clockRingFill");
    const numEl = document.getElementById("timerNum");
    // paint() อัปเดตแค่ตัวเลข/สี ไม่แตะ innerHTML ของ tb ทั้งก้อนอีกต่อไป — ถ้าเขียนทับทุกวินาที
    // เหมือนเดิม จะฆ่า <svg> ที่ ringAnim กำลังคุมอยู่ทิ้งทุกวินาทีจนวงแหวนไม่ขยับ
    const paint = t => {
      numEl.textContent = `⏱ ${Math.max(0, t)} วินาที`;
      const danger = t <= 5;
      numEl.classList.toggle("danger", danger);
      wrapEl.classList.toggle("danger", danger);
    };

    /* วงแหวนคือนาฬิกาจริง ไม่ใช่ของประดับ — ห้ามผ่าน MOTION.run()/MOTION.d() เด็ดขาด
       MOTION.d() ย่อทุก duration เหลือ ≤120ms ตอน reduced-motion แต่ time_limit จริงยาวกว่า
       นั้นมาก (15-45 วิ) ถ้าย่อไปด้วย วงแหวนจะวิ่งครบรอบใน 120ms ทั้งที่ตัวเลขวินาทียังนับต่อ
       อีกหลายสิบวิ — นาฬิกาสองตัวไม่ตรงกัน จึงเรียก el.animate() ตรง ๆ ด้วย duration จริงเสมอ
       ทุกโหมด (reduced หรือไม่ก็ตาม) — สิ่งเดียวที่ปิดตอน reduced คือ pulse ประดับด้านล่าง */
    if (ringEl && ringEl.animate) {
      ringAnim = ringEl.animate(
        [{ strokeDashoffset: 0 }, { strokeDashoffset: RING_C }],
        { duration: totalMs, easing: "linear", fill: "forwards" }
      );
      // resume กลางคำถาม (refresh) → เซ็ต currentTime ตรงตามเวลาที่ผ่านไปจริง ไม่ใช่เริ่มนับหนึ่ง
      ringAnim.currentTime = Math.max(0, Math.min(totalMs, Date.now() - startedAt));
    }

    const timeUp = () => {
      if (done) return;
      done = true;
      stop();   // .cancel() วงแหวน + เคลียร์ interval/wake lock ก่อนเข้าเส้นทาง log เสมอ
      paint(0);
      view.lock();
      SFX.buzzer();
      flash("red");
      onDone(false, true, null, null);   // หมดเวลา = ไม่ได้แตะอะไรเลย ไม่มี picked/chosenEl
    };

    if (left() <= 0) { timeUp(); return; }   // refresh กลับมาหลังหมดเวลา = เข้า flow หมดเวลาทันที
    paint(left());
    Wake.on();
    timer = setInterval(() => {
      const t = left();
      if (t <= 0) { timeUp(); return; }
      paint(t);
      SFX.tick(t <= 5);
      // จังหวะเต้นเตือน 5 วิสุดท้าย — ของประดับล้วน (ไม่ใช่ตัวจับเวลา) ปิดทั้งหมดตอนลดการเคลื่อนไหว
      // ไม่ใช่แค่ย่อเวลาแบบวงแหวนหลัก เพราะนี่ไม่ใช่ข้อมูลที่ต้องถูกต้อง แค่ของประดับเสริมความรู้สึก
      if (t <= 5 && !MOTION.reduced) {
        MOTION.run(ringSvgEl, [
          { transform: "rotate(-90deg) scale(1)" },
          { transform: "rotate(-90deg) scale(1.05)" },
          { transform: "rotate(-90deg) scale(1)" },
        ], { duration: 260, easing: easeVar("--ease-pop") });
      }
    }, 1000);
  }
}

/* =====================================================================
   Stage 3 — จังหวะเฉลย (ทำผ่าน delegation เท่านั้น — ไม่แตะ renderer ทั้ง 4 แบบเลย)
   ---------------------------------------------------------------------
   เรียก playAnswerFx() จากจุดที่มี logAnswer() ทุกจุด **ต่อจาก logAnswer() เท่านั้น**
   ห้ามอยู่ระหว่าง Session.done() กับ logAnswer() เด็ดขาด (กฎเหล็กข้อ 8 / บรรทัด 718-728)
   ทุกอย่างในนี้ fire-and-forget ผ่าน WAAPI ล้วน — ไม่มี await/setTimeout/.finished เลยสักจุด
   ===================================================================== */

// ---------- ✓ วาดเครื่องหมายถูก (stroke-dashoffset — ข้อยกเว้นเดียวกับวงแหวนนาฬิกา) ----------
function drawCheckmark(anchorEl, myToken) {
  if (!anchorEl || !anchorEl.getBoundingClientRect) return;
  const wrap = document.createElement("div");
  wrap.className = "fx-check";
  wrap.innerHTML = `<svg viewBox="0 0 24 24"><path d="M4 12.5 L10 18 L20 6" /></svg>`;
  const cs = getComputedStyle(anchorEl);
  if (cs.position === "static") anchorEl.style.position = "relative";
  anchorEl.appendChild(wrap);
  const path = wrap.querySelector("path");
  if (!path.getTotalLength) return;   // เบราว์เซอร์เก่ามาก — ข้ามไปเงียบ ๆ ไม่พัง
  const len = path.getTotalLength();
  path.style.strokeDasharray = String(len);
  if (!path.animate) return;
  const a = path.animate(
    [{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
    { duration: MOTION.d(240), delay: 20, fill: "forwards", easing: easeVar("--ease-out") }
  );
  a.onfinish = () => { if (myToken !== renderToken) return; };   // เผื่ออนาคตต่อยอด — ตอนนี้แค่จบเฉย ๆ
}

// ---------- จังหวะเลือกตอบ: เด้ง/สั่น + เฉลยข้อถูก (เฉพาะ renderer ที่มี marker ให้หาแบบ generic) ----------
// chosenEl มาจาก capture listener ใน renderQuiz — ครอบคลุมทุก qtype โดยไม่ต้องรู้จัก renderer
function playAnswerFx(correct, chosenEl) {
  const myToken = renderToken;   // จับ token ตอนเริ่ม — ใช้เทียบใน onfinish ทุกอันข้างล่าง
  if (!chosenEl) return;         // หมดเวลา = ไม่ได้แตะอะไร ไม่มี element ให้ทำ fx

  if (correct) {
    MOTION.run(chosenEl, [
      { transform: "scale(1)" }, { transform: "scale(1.04)" }, { transform: "scale(1)" },
    ], { duration: 260, easing: easeVar("--ease-pop") });
    drawCheckmark(chosenEl, myToken);
  } else {
    MOTION.run(chosenEl, [
      { transform: "translateX(0)" }, { transform: "translateX(-5px)" },
      { transform: "translateX(5px)" }, { transform: "translateX(-5px)" }, { transform: "translateX(0)" },
    ], { duration: 280, easing: easeVar("--ease-io") });
  }

  // เฉลยข้อถูก: fade เขียวเข้ามาหน่วง 180ms — เฉพาะ renderer ที่มี marker แบบ class ให้หา
  // (MCQ ใช้ .correct, linepick ใช้ .answer) hotspot/colorwheel เฉลยด้วยการวาด SVG อยู่แล้วในตัว
  // renderer เอง (reveal()) จึงไม่มี node ให้หาแบบ generic ตรงนี้ — ข้ามไปเงียบ ๆ ไม่ใช่บั๊ก
  const correctEl = document.querySelector("#choices .correct, #choices .answer");
  if (correctEl && correctEl.animate) {
    if (getComputedStyle(correctEl).position === "static") correctEl.style.position = "relative";
    const glow = document.createElement("div");
    glow.className = "fx-correct-glow";
    correctEl.appendChild(glow);
    glow.animate([{ opacity: 0 }, { opacity: 1 }], {
      duration: MOTION.d(300), delay: MOTION.reduced ? 0 : 180, fill: "forwards", easing: easeVar("--ease-out"),
    });
  }
}

// ---------- ตัวเลขเงินนับขึ้น/ลง (rAF, 400ms) — ต้องเช็ค renderToken ทุกเฟรมก่อนแตะ DOM ----------
// numEl ต้องเป็น reference ที่จับไว้ตอนเริ่ม ห้าม getElementById ซ้ำในลูป (กัน id ถูกใช้ซ้ำข้ามหน้า)
function animateMoneyCount(numEl, from, to) {
  if (!numEl) return;
  const myToken = renderToken;
  const dur = MOTION.d(400);
  if (from === to || dur <= 0 || !window.requestAnimationFrame) {
    numEl.textContent = to.toLocaleString();
    return;
  }
  const t0 = performance.now();
  const ease = t => 1 - Math.pow(1 - t, 3);   // เทียบเคียง --ease-out แบบไม่ต้องพึ่ง cubic-bezier ใน rAF
  function step(now) {
    if (myToken !== renderToken) return;      // หน้าเปลี่ยนไปแล้ว — หยุดทันที ห้ามแตะ DOM ต่อ
    const p = Math.min(1, (now - t0) / dur);
    numEl.textContent = Math.round(from + (to - from) * ease(p)).toLocaleString();
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// ---------- ป้าย +/- ลอยขึ้นแล้วจาง (WAAPI, 600ms) ----------
function floatBadge(anchorEl, text, positive) {
  if (!anchorEl || !anchorEl.getBoundingClientRect) return;
  const myToken = renderToken;
  const badge = document.createElement("div");
  badge.className = "fx-badge " + (positive ? "up" : "down");
  badge.textContent = text;
  const cs = getComputedStyle(anchorEl);
  if (cs.position === "static") anchorEl.style.position = "relative";
  anchorEl.appendChild(badge);
  if (!badge.animate) { badge.remove(); return; }
  const a = badge.animate(
    [{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(-14px)", opacity: 0 }],
    { duration: MOTION.d(600), easing: easeVar("--ease-out"), fill: "forwards" }
  );
  a.onfinish = () => { if (myToken !== renderToken) return; badge.remove(); };
}

// ---------- เมนูทดสอบ (แสดงเมื่อเปิดโดยไม่มี ?space=) ----------

      ${items}
    </div>`;
  enterScreen();
}

/* =====================================================================
   มินิเกม "กู้บั๊กด่วน" (Debug Rescue) — 2 คน 2 มือถือ
   ---------------------------------------------------------------------
   ไม่มี backend: ทั้งคู่พิมพ์ "รหัสร่วม 4 ตัว" เดียวกัน → seed → derive
   ปริศนา+กฎชุดเดียวกันแบบ deterministic (solver ตรวจผลเองได้)
   ===================================================================== */

// PRNG แบบ deterministic จาก string seed (mulberry32) — ต้องได้ผลเดิมทุกเครื่อง
// หมายเหตุ: weightedPick เดิมใช้ Math.random (สุ่มสด) จึงใช้ที่นี่ไม่ได้ เพราะ 2 เครื่องต้องตรงกัน
function seededRng(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  let a = h >>> 0;
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rngInt = (rng, lo, hi) => lo + Math.floor(rng() * (hi - lo + 1)); // รวม hi

// เช็คว่า layout นี้ "กฎ apply ได้จริง" — กัน edge case ที่ guide อ่านกฎแล้วหาเส้นไม่เจอ
// (เช่น v1 มีเหลืองแต่ไม่มีน้ำเงิน, v4 มีเส้นเข้าเงื่อนไขไม่ถึง 2)
function wireRuleClean(colors, vid) {
  if (vid === "v1") return !colors.includes("yellow") || colors.includes("blue");
  if (vid === "v3") {
    const hasDup = colors.some((c, i) => colors.indexOf(c) !== i);
    return hasDup || colors.includes("green");
  }
  if (vid === "v4") return colors.filter(c => c !== "red" && c !== "green").length >= 2;
  return true; // v2 แก้ได้เสมอ
}

// สร้างสถานะ wire_cut จาก seed — ทั้ง solver/guide เรียกโค้ดเดียวกัน = ผลตรงกันเป๊ะ
function buildWireCut(rng) {
  const P = CONFIG.debug_rescue.patterns.find(p => p.id === "wire_cut");
  const n = rngInt(rng, P.wire_count_range[0], P.wire_count_range[1]);
  let variant = P.rule_variants[rngInt(rng, 0, P.rule_variants.length - 1)];
  let colors;
  // ดึงสีใหม่จนกฎ apply ได้จริง (rng เดินเหมือนกันทั้ง 2 เครื่อง จึงยัง deterministic)
  for (let tries = 0; tries < 24; tries++) {
    colors = Array.from({ length: n }, () => P.wire_colors[rngInt(rng, 0, P.wire_colors.length - 1)]);
    if (wireRuleClean(colors, variant.id)) break;
    if (tries === 23) variant = P.rule_variants[1]; // v2 แก้ได้เสมอ — กันลูปไม่จบ
  }
  return { colors, variant, answer: wireAnswer(colors, variant.id) };
}

// คำนวณลำดับเส้นที่ต้องตัด (index) ตามกฎแต่ละเวอร์ชัน — fallback ให้แก้ได้เสมอ
function wireAnswer(colors, vid) {
  const firstOf = c => colors.indexOf(c);
  if (vid === "v1") {
    if (colors.includes("yellow")) { const b = firstOf("blue"); return [b >= 0 ? b : 0]; }
    return [0];
  }
  if (vid === "v2") {
    const reds = colors.filter(c => c === "red").length;
    return [reds % 2 === 0 ? colors.length - 1 : Math.max(0, colors.length - 2)];
  }
  if (vid === "v3") {
    const dupColor = colors.find((c, i) => colors.indexOf(c) !== i && colors.indexOf(c) === colors.lastIndexOf(c) - (colors.filter(x => x === c).length - 1))
      || colors.find(c => colors.filter(x => x === c).length >= 2);
    if (dupColor) return [colors.indexOf(dupColor)];
    const g = firstOf("green"); return [g >= 0 ? g : 0];
  }
  if (vid === "v4") {
    const idxs = colors.map((c, i) => ({ c, i })).filter(o => o.c !== "red" && o.c !== "green").map(o => o.i);
    return idxs.length ? idxs.slice(0, 2) : [0];
  }
  return [0];
}

const WIRE_HEX = { red: "#F87171", green: "#4ADE80", blue: colorVar("--office"), yellow: "#FBBF24", white: "#E2E8F0" };

// หน้าแรก: เลือก/สร้างรหัสร่วม + เลือก role

// timer ร่วม (เริ่มนับเมื่อกด "เริ่ม" บนเครื่องตัวเอง — ไม่ sync เป๊ะข้ามเครื่อง ตามสเปค)
// onEnd(false) เมื่อหมดเวลา, คืนฟังก์ชัน stop ให้หยุดเมื่อชนะ/ออกจากหน้า
function rescueTimer(seconds, boxId, onEnd) {
  let t = seconds;
  const tb = document.getElementById(boxId);
  const paint = () => tb.innerHTML = `<div class="timer ${t <= 5 ? "danger" : ""}">⏱ ${t} วินาที</div>`;
  paint();
  Wake.on();   // กันจอดับระหว่างลุ้น (มินิเกมนี้มือไม่ได้แตะจอนาน ๆ)
  const iv = setInterval(() => {
    t--; paint();
    if (t <= 0) { clearInterval(iv); Wake.off(); SFX.buzzer(); flash("red"); onEnd(false); }
    else SFX.tick(t <= 5);
  }, 1000);
  return {
    stop: () => { clearInterval(iv); Wake.off(); },
    cut: pct => { t = Math.max(1, Math.round(t * (1 - pct))); paint(); }, // ตัดเวลาเมื่อขอ hint
  };
}

// หน้า solver (ผู้กด) — เห็นปริศนา ตรวจผลเอง
function renderRescueSolver(code) {
  setHeaderHidden(true);   // Stage V2b FIX-3b: ต้องการ headroom ≥20px แต่ .wire-row ห้ามลดต่อจาก FIX-3 แล้ว
  const P = CONFIG.debug_rescue.patterns.find(p => p.id === "wire_cut");
  const state = buildWireCut(seededRng(code));
  let step = 0, done = false, timer = null, hinted = false;

  cancelScreenEnter();   // นาฬิกาเริ่มทันที — กัน fade ค้างจากหน้าก่อน
  // Stage V2: FIX-3 (เพิ่ม padding .wire-cut-btn ให้ ≥44px) ทำให้แถวสายไฟสูงขึ้น — บีบ margin
  // เฉพาะเทมเพลตนี้ (?space=debug_rescue&role=solver) กันหน้าที่จับเวลาล้นจอ ไม่แตะขนาดปุ่มตัด
  screen.innerHTML = `
    <div class="card">
      <span class="zone-tag" style="margin-bottom:2px;background:var(--gold);color:var(--ink-on-bright)">🖥 ผู้กด · รหัส ${code}</span>
      <h2 style="margin-bottom:2px;">${P.name} — ตัดให้ถูก!</h2>
      <p class="content" style="margin-bottom:2px;">ฟังผู้อ่านคู่มือบอก แล้วกด "ตัด" ตามลำดับ</p>
      <div id="rTimer"></div>
      <div id="wires" style="margin:4px 0;"></div>
      <button class="btn ghost" id="rHint" style="margin-top:4px;">💡 ขอ hint (เสียเวลา ${Math.round(CONFIG.debug_rescue.hint_time_cut*100)}%)</button>
      <div id="rHintBox"></div>
      <div id="rResult"></div>
    </div>`;

  const wrap = document.getElementById("wires");
  state.colors.forEach((c, i) => {
    const row = document.createElement("div");
    row.className = "wire-row";
    row.innerHTML = `<span class="wire-idx">${i + 1}</span>
      <div class="wire-bar" style="background:${WIRE_HEX[c]}"></div>
      <button class="wire-cut-btn">✂ ตัด</button>`;
    row.querySelector("button").onclick = () => cut(i, row);
    wrap.appendChild(row);
  });

  const finish = (ok, timedOut, cutIndex) => {
    if (done) return;
    done = true; timer.stop();
    wrap.querySelectorAll("button").forEach(b => b.disabled = true);
    document.getElementById("rHint").disabled = true;
    const r = CONFIG.debug_rescue.reward, pen = CONFIG.debug_rescue.penalty;
    if (ok) { SFX.celebrate(); confetti();
      document.getElementById("rResult").innerHTML = `<div class="result win pop">🎉 กู้ระบบสำเร็จ! ทั้งคู่รับ ${r.toLocaleString()} TechCoin</div>`;
    } else { SFX.wrong(); flash("red");
      document.getElementById("rResult").innerHTML = `<div class="result lose">💀 ระบบล่ม — ทั้งคู่เสีย ${pen.toLocaleString()} TechCoin</div>`;
    }
    // มินิเกมตัดสายไฟ ไม่ใช่คำถามจากคลัง → ไม่มี question_id/picked
    // และไม่ได้ใช้ Session → elapsed_ms จะเป็น null ถาวร (ตัวจับเวลาเป็น rescueTimer แยกของตัวเอง)
    // cut_index = เลขเส้นที่กดตัดเป็นเส้นสุดท้าย ฐาน 1 ตรงกับตัวเลขที่โชว์ข้างเส้นบนจอ
    // (ตอบผิด = เส้นที่พลาด, ตอบถูก = เส้นสุดท้ายที่ปิดจ๊อบ, หมดเวลา = null เพราะไม่ได้กด)
    logAnswer("debug_rescue", "debug_rescue", 0, ok,
      { pattern: "wire_cut", variant: state.variant.id, hinted, qtype: "wire_cut", timed_out: !!timedOut,
        cut_index: (cutIndex === undefined || cutIndex === null) ? null : cutIndex + 1 });
    const back = document.createElement("button");
    back.className = "btn"; back.textContent = "กลับเมนู";
    back.onclick = renderMenu; document.getElementById("rResult").appendChild(back);
  };

  function cut(i, row) {
    if (done || row.classList.contains("cut")) return;
    row.classList.add("cut");
    row.querySelector("button").disabled = true;
    if (i === state.answer[step]) { SFX.correct(); step++; if (step >= state.answer.length) finish(true, false, i); }
    else finish(false, false, i);  // ตัดผิดเส้น = ล่มทันที
  }

  document.getElementById("rHint").onclick = () => {
    hinted = true;
    document.getElementById("rHint").disabled = true;
    timer.cut(CONFIG.debug_rescue.hint_time_cut);
    document.getElementById("rHintBox").innerHTML =
      `<div class="result info" style="margin-top:8px;">💡 กฎรอบนี้: ${state.variant.guide_text}</div>`;
  };

  timer = rescueTimer(P.time_limit, "rTimer", () => finish(false, true));   // onEnd ยิงเฉพาะตอนหมดเวลา
}

// seed ผูกกับ "รอบ + จำนวนคน + เลขผู้เล่น" — คนละ slot = คนละชุดคำถาม (กันลอก)
// slot เดียวกัน = ได้ชุดเดิมเป๊ะ (จำเป็นตอน refresh กลางเกม)
const meltdownSeed = (round, count, slot) => `meltdown-${round}-${count}-${slot}`;
const meltdownTarget = count => Math.ceil(count * CONFIG.cooling_boss.hp_per_player);

// คลังคำถามบอส: คละทุกวิชา (ต่างจากช่องทรัพย์สินที่ผูกวิชาตามช่อง) เอาเฉพาะระดับที่ยากพอ
// สับด้วย seeded RNG ทีละรอบ — ไม่ซ้ำภายในรอบเดียว คลังหมดแล้ววนใหม่โดยสับลำดับใหม่
function meltdownDeck(seedStr) {
  const lv = CONFIG.cooling_boss.question_levels;
  // เฉพาะแบบตัวเลือก — บอสไฟต์เป็นการรัวตอบ ไม่เหมาะกับข้อที่ต้องแตะตำแหน่ง
  let pool = QUESTIONS.filter(q => lv.includes(q.level) && !q.qtype);
  if (!pool.length) pool = QUESTIONS.filter(q => !q.qtype);   // กันเคสข้อมูลสำรองที่ไม่มีระดับเหล่านี้
  const rng = seededRng(seedStr);
  const deck = [];
  while (deck.length < 120 && pool.length)
    shuffleOrderSeeded(pool.length, rng).forEach(i => deck.push(pool[i]));
  return deck;
}

// คำถามข้อที่ idx — ตัวเลือกสับด้วย seed ที่ผูกกับ idx จึงคำนวณกลับมาได้ตอน refresh
const meltdownQuestion = (deck, idx, seedStr) => {
  const q = deck[idx % deck.length];
  return shuffledBug(q, 0, shuffleOrderSeeded(q.choices.length, seededRng(seedStr + "#" + idx)));
};

// ---- หน้า 1: เข้าร่วม (เลือกเลขรอบ / จำนวนคน / เลขผู้เล่นของตัวเอง) ----
function renderMeltdownJoin(pre) {
  const C = CONFIG.cooling_boss;
  // slot: เติมค่าเริ่มต้นจากเลขผู้เล่นที่ตั้งไว้ในเครื่อง (เลือกไว้ให้ล่วงหน้าเฉย ๆ กดเปลี่ยนได้เสมอ)
  // ถ้าเลขเกินจำนวนคนในโต๊ะ ตัว paint() ด้านล่างจะล้างให้เลือกใหม่เองอยู่แล้ว
  let round = (pre && pre.round) || 0, count = (pre && pre.count) || 0,
      slot = (pre && pre.slot) || Player.get() || 0;
  // paint() ถูกเรียกซ้ำทุกครั้งที่กดชิปเลือกตัวเลข (วาดทั้งหน้าใหม่) — เข้าหน้าใหม่ครั้งแรกครั้งเดียวพอ
  // ไม่งั้นทุกคลิกเลือกตัวเลขจะเห็นหน้าเลื่อนเข้าซ้ำ ๆ ทั้งที่ยังอยู่หน้าเดิม
  let entered = false;

  const chips = (a, b, cur, attr) => {
    let s = "";
    for (let i = a; i <= b; i++)
      s += `<button class="pick${cur === i ? " on" : ""}" data-${attr}="${i}">${i}</button>`;
    return s;
  };

  const paint = err => {
    if (count && slot > count) slot = 0;   // ลดจำนวนคนแล้วเลขเดิมเกิน — ล้างให้เลือกใหม่
    screen.innerHTML = `
      <div class="card">
        <span class="zone-tag" style="background:var(--office)">จุดพักเครื่อง (Cooling Zone)</span>
        <h2>🔥 SERVER MELTDOWN</h2>
        <p class="content"><b>ทุกคนหยิบมือถือขึ้นมาสแกน QR ช่องนี้ — ไม่ใช่เฉพาะคนที่หยุด!</b>
          บอสมีพลังชีวิตร่วมกันทั้งโต๊ะ · <b>ตอบถูก 1 ข้อ = ฟันบอส 1 แต้ม</b></p>
        <div class="result info" style="margin-top:10px;font-size:13px;">
          💸 ค่าเข้าร่วม ${C.entry_fee.toLocaleString()} TechCoin — จ่ายเข้ากองกลางก่อนกดเริ่ม (ไม่ผ่าน = เสียเลย)
        </div>
      </div>
      <div class="card">
        <p class="q">1️⃣ เลขรอบปัจจุบัน <span style="color:var(--muted);font-weight:400;font-size:12px;">(คนที่หยุดประกาศ — ทั้งโต๊ะต้องตรงกัน)</span></p>
        <div class="pick-row">${chips(1, 12, round, "round")}</div>

        <p class="q">2️⃣ โต๊ะนี้มีกี่คน <span style="color:var(--muted);font-weight:400;font-size:12px;">(ทั้งโต๊ะต้องตรงกัน)</span></p>
        <div class="pick-row">${chips(2, C.max_players, count, "count")}</div>

        <p class="q">3️⃣ คุณคือผู้เล่นหมายเลข <span style="color:var(--muted);font-weight:400;font-size:12px;">(ห้ามซ้ำกับเพื่อน)</span></p>
        <div class="pick-row">${count
          ? chips(1, count, slot, "slot")
          : `<span class="content" style="font-size:13px;color:var(--muted);">— เลือกจำนวนผู้เล่นก่อน —</span>`}</div>

        <div class="result info">🎯 เป้าหมายทีม: ฟันบอสให้ครบ <b>${count ? meltdownTarget(count) : "—"}</b> แต้ม ใน ${C.seconds} วินาที</div>
        ${err ? `<div class="result lose" style="margin-top:8px;">${err}</div>` : ""}
        <button class="btn" id="meltGo">เข้าร่วมบอสไฟต์</button>
        <button class="btn ghost" onclick="renderMenu()">กลับเมนู</button>
      </div>`;
    if (!entered) { entered = true; enterScreen(); }

    const pick = (attr, set) => screen.querySelectorAll(`[data-${attr}]`).forEach(b =>
      b.onclick = () => { set(+b.dataset[attr]); SFX.tick(false); paint(); });
    pick("round", v => round = v);
    pick("count", v => count = v);
    // เลือกที่นี่ = ตั้งเลขผู้เล่นประจำเครื่องไปด้วย (sync สองทาง — ทุก log หลังจากนี้ได้เลขเดียวกัน)
    pick("slot", v => { slot = v; if (v >= 1 && v <= Player.MAX_STORE) Player.set(v); });

    document.getElementById("meltGo").onclick = () => {
      if (!round || !count || !slot) { paint("⚠️ ยังเลือกไม่ครบทั้ง 3 ข้อ"); return; }
      if (slot > count) { paint("⚠️ หมายเลขผู้เล่นเกินจำนวนคนในโต๊ะ"); return; }
      renderMeltdownReady({ round, count, slot });
    };
  };
  paint();
}

// ---- หน้า 2: เตรียมพร้อม + นับ 3-2-1 ----
function renderMeltdownReady(cfg) {

    <div class="card">

      <h2>🔥 SERVER MELTDOWN</h2>

      <p class="content" style="margin-top:10px;">คำถามของแต่ละคน<b>คนละชุด</b> — ชำเลืองจอเพื่อนไม่ได้ช่วยอะไร
        <b>เชียร์กันได้เต็มที่</b> แต่ห้ามบอกเฉลย</p>
      <p class="content" style="margin-top:8px;font-size:13px;">

      <div id="cdBox"></div>
      <button class="btn" id="meltStart">🚀 เริ่ม!</button>
      <button class="btn ghost" id="meltBack">ย้อนกลับ</button>
    </div>`;
  enterScreen();

  document.getElementById("meltBack").onclick = () => renderMeltdownJoin(cfg);
  document.getElementById("meltStart").onclick = () => {
    document.getElementById("meltStart").disabled = true;
    document.getElementById("meltBack").disabled = true;

  };
